<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoCal WLC</title>
<style>
  :root{--bg:#0c1116;--panel:#141c24;--panel2:#1a232c;--line:#26323d;--text:#e7edf3;--muted:#8b9aa8;
        --accent:#e8643c;--accent2:#3c9ee8;--good:#3ec97a;--warn:#e8b13c;--bad:#e85c5c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:760px;margin:0 auto;padding:18px 16px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .brand{font-weight:800;letter-spacing:.3px}.brand .o{color:var(--accent)}
  .who{font-size:12px;color:var(--muted);text-align:right}
  .who b{color:var(--text)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer}
  .btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.blue{background:var(--accent2)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
  .sub{color:var(--muted);font-size:13px}
  /* login */
  .login{max-width:380px;margin:8vh auto 0}
  .login .card{padding:24px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:12px 0 5px}
  input{width:100%;background:#0e151c;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--text);font-size:15px}
  input:focus{outline:none;border-color:var(--accent2)}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px}
  .hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
  .hint .lk{color:var(--accent2);font-weight:700;cursor:pointer}.hint .lk:hover{text-decoration:underline}
  .csection-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
  .inv-link-box{background:#13202c;border:1px solid #27425c;border-radius:10px;padding:12px;margin-top:12px}
  .inv-link-box input{flex:1;font-size:12px}
  /* session */
  .pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:11px;background:var(--panel2);color:var(--accent2)}
  .exh{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
  .exh .nm{font-weight:800;font-size:15px}
  .note{font-size:12.5px;color:var(--muted);font-style:italic;background:var(--panel2);border-left:2px solid var(--accent2);border-radius:0 8px 8px 0;padding:8px 11px;margin:6px 0 10px}
  table{width:100%;border-collapse:collapse}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;text-align:left;padding:6px 8px}
  td{padding:6px 8px;border-top:1px solid var(--line)}
  .tgt{color:var(--muted);font-size:13px}
  td input.cell{width:62px;padding:8px;text-align:center;font-weight:700}
  .chk{width:22px;height:22px;accent-color:var(--good)}
  .savebar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(12,17,22,0),var(--bg) 36%);padding:14px 0 4px;margin-top:8px;display:flex;gap:10px;align-items:center}
  .saved{color:var(--good);font-size:13px;font-weight:700}
  /* coach */
  .athrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
  .athrow.on{border-color:var(--accent)}
  .athrow .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .pa{display:flex;gap:8px;font-size:13px}
  .pa .p{color:var(--muted)}.pa .a{font-weight:800}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--good)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .delta-pos{color:var(--good)}.delta-neg{color:var(--bad)}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .spin{color:var(--muted);padding:30px;text-align:center}
  /* coach session builder */
  .b-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .b-ex{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
  .b-ex .b-name{width:100%;font-weight:700;font-size:15px;margin-bottom:6px}
  .b-ex .b-note{width:100%;font-size:13px;margin-bottom:8px}
  .b-set{display:flex;gap:8px;align-items:center;margin:5px 0}
  .b-set .lbl{flex:0 0 42px;color:var(--muted);font-size:12px;font-weight:700}
  .b-set input{width:74px;text-align:center;padding:8px}
  .b-x{color:var(--muted);cursor:pointer;font-size:13px;padding:2px 7px;user-select:none}
  .b-x:hover{color:var(--bad)}
  .b-add{display:inline-block;font-size:13px;font-weight:700;color:var(--accent2);cursor:pointer;margin-top:4px;user-select:none}
  .b-add:hover{text-decoration:underline}
  /* athlete logging table (mockup look) */
  .pill.phase{background:#2a3a2c;color:var(--good)}
  .pill.primary{background:#2a3340;color:var(--accent2)}
  .pill.accessory{background:#332d22;color:var(--warn)}
  .ex{border:1px solid var(--line);border-radius:11px;margin-bottom:14px;overflow:hidden}
  .av-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border-bottom:1px solid var(--line);padding:12px 14px}
  .av-head .name{font-weight:800;font-size:15px}
  .av-head .tag{margin-left:auto;font-size:11px;color:var(--muted)}
  .logwrap{overflow-x:auto}
  .logtable{width:100%;border-collapse:collapse;min-width:560px}
  .logtable th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:9px 6px;text-align:center}
  .logtable td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);font-size:13px}
  .logtable td:nth-child(2),.logtable th:nth-child(2){text-align:left}
  .logtable input{width:52px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);text-align:center;padding:7px 4px;font-size:13px;font-weight:700}
  .logtable input.mini{width:44px}
  .logtable input:focus{outline:none;border-color:var(--accent2)}
  .logtable .tgt{color:var(--accent2);font-weight:700;font-size:12px}
  .logtable .chk{width:20px;height:20px;accent-color:var(--good)}
  .lights{display:inline-flex;gap:3px;vertical-align:middle}
  .lights i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  .lights i.w{background:#eef3f8}.lights i.r{background:var(--bad)}
  .lights.sm i{width:9px;height:9px}
  .lg-lts{cursor:pointer;padding:4px 5px;border-radius:6px;gap:4px}
  .lg-lts:hover{background:#16202b}.lg-lts i{width:14px;height:14px}
  .lg-eff{display:inline-flex;gap:3px}
  .lg-light{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:#0e151c;color:var(--muted);opacity:.6}
  .lg-light:hover{opacity:1}
  .lg-light.on{opacity:1;color:#06121d}
  .lg-light.easy.on{background:var(--good);border-color:var(--good)}
  .lg-light.moderate.on{background:var(--accent2);border-color:var(--accent2)}
  .lg-light.hard.on{background:var(--warn);border-color:var(--warn)}
  .lg-light.max.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .upvid{display:inline-flex;align-items:center;gap:4px;background:#2a2340;border:1px dashed #3d3460;color:#b9a8ff;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
  .upvid.on{background:#1d3a2a;border-color:#2f6b48;color:#7fdca8;border-style:solid}
  .upvid.up{background:#33302a;border-color:#5a4419;color:var(--warn);border-style:solid;cursor:default}
  .vidcell{white-space:nowrap}
  .vidrm{color:var(--muted);cursor:pointer;font-weight:700;margin-left:6px;font-size:12px}
  .vidrm:hover{color:var(--bad)}
  .vidrm.arm{color:var(--bad);font-size:11px;font-weight:800}
  .vidlink{color:#7fdca8;cursor:pointer;font-weight:700;white-space:nowrap}
  .vidlink:hover{text-decoration:underline}
  .vid-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;align-items:center;justify-content:center;padding:24px}
  .vid-box{position:relative;max-width:540px;width:100%;background:#0c1116;border:1px solid var(--line);border-radius:12px;padding:14px}
  .vid-x{position:absolute;top:-12px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
  .lg-add{display:inline-block;margin:9px 14px;color:var(--accent2);font-weight:700;font-size:12px;cursor:pointer;user-select:none}
  .lg-add:hover{color:#7bc0f5}
  .lg-del{color:var(--muted);cursor:pointer;font-weight:700;opacity:.45;padding:0 4px}
  .lg-del:hover{color:var(--bad);opacity:1}
  .addedtag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--warn);background:rgba(232,177,60,.13);border-radius:9px;padding:2px 8px}
  .av-note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:#1c2530;border-top:1px solid var(--line);font-size:12.5px}
  .av-note .tag{color:var(--accent2);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.5px;white-space:nowrap;padding-top:2px}
  /* morning readiness check-in */
  .rk-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .rk-score{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
  .rk-num{font-size:26px;font-weight:800;color:var(--text)}
  .rk-num.good{color:var(--good)}.rk-num.warn{color:var(--warn)}.rk-num.bad{color:var(--bad)}
  .rk-meta{font-size:10px;color:var(--muted);line-height:1.3;text-transform:uppercase;letter-spacing:.4px}
  .rk-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .rk-row:last-of-type{border-bottom:none}
  .rk-lbl{flex:0 0 130px;font-size:14px;font-weight:600;color:var(--text)}
  .rk-hint{display:block;font-size:10px;color:var(--muted);font-weight:400}
  .rk-scale{display:flex;gap:6px;flex-wrap:wrap}
  .rk-dot{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#0e151c;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s}
  .rk-dot:hover{border-color:var(--accent2)}
  .rk-dot.on{background:var(--accent2);border-color:var(--accent2);color:#06121d}
  .rk-foot{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-top:14px}
  .rk-bw label,.rk-note label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
  .rk-bwrow{display:flex;align-items:center;gap:7px}
  .rk-bw input{background:#0e151c;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:15px;font-weight:700;width:96px}
  .rk-bw input:focus,.rk-note textarea:focus{outline:none;border-color:var(--accent2)}
  .rk-unit{color:var(--muted);font-size:13px;font-weight:600}
  .rk-note{flex:1;min-width:220px}
  .rk-note textarea{width:100%;background:#0e151c;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;min-height:48px;resize:vertical;font-family:inherit}
  /* coach view of a check-in */
  .rkc-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rkc-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .rkc-chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12px}
  .rkc-chip .rkc-l{color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .rkc-chip b{font-size:14px}
  .rkc-note{margin-top:10px;font-size:13px;font-style:italic;color:var(--text);background:var(--panel2);border-left:2px solid var(--accent2);border-radius:0 8px 8px 0;padding:8px 12px}
  .rk-scale{flex-wrap:nowrap}
  @media(max-width:560px){
    .rk-row{flex-direction:column;align-items:stretch;gap:8px;padding:11px 0}
    .rk-lbl{flex:none}
    .rk-scale{width:100%;gap:7px}
    .rk-dot{flex:1;width:auto;height:42px;font-size:14px}
  }
  .rk-donebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
  .rk-donebar .ok{color:var(--good);font-weight:700}
  .rk-edit{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent2)}
  /* week day-strip */
  .av-weekcard{padding:14px 16px}
  .av-weekhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:11px}
  .av-weeklbl{font-size:13px;color:var(--muted)}
  .av-weeklbl b{color:var(--text)}
  .av-weekprog{font-size:12px;font-weight:700;color:var(--accent2)}
  .av-daystrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
  .av-day{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 5px 8px;cursor:pointer;transition:border-color .12s}
  .av-day:hover{border-color:var(--accent2)}
  .av-day.on{border-color:var(--accent);background:rgba(232,100,60,.08)}
  .av-day.rest{opacity:.62;cursor:default}
  .av-day.rest:hover{border-color:var(--line)}
  .av-day-dow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .av-day.on .av-day-dow{color:var(--accent)}
  .av-day-d{font-size:17px;font-weight:800;line-height:1.1}
  .av-day-type{font-size:10px;color:var(--muted);max-width:66px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .av-day-dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .av-day-dot.done{background:var(--good)}
  .av-day-dot.today{background:var(--accent)}
  .av-day-dot.up{background:var(--accent2)}
  .av-day-dot.rest{background:#3a4754}
  .av-day-dot.draft{background:var(--warn)}
  /* expandable week — each day shows its sessions */
  .cwd-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  @media(max-width:1100px){.cwd-grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:680px){.cwd-grid{grid-template-columns:repeat(2,1fr)}}
  .cwd-col{background:#0e151c;border:1px solid var(--line);border-radius:11px;padding:9px;min-height:96px;display:flex;flex-direction:column;gap:6px}
  .cwd-col.today{border-color:var(--accent)}
  .cwd-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1px}
  .cwd-dow{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .cwd-col.today .cwd-dow{color:var(--accent)}
  .cwd-dnum{font-size:15px;font-weight:800;color:var(--text)}
  .cwd-sess{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:8px;padding:7px 9px;cursor:pointer;transition:border-color .12s}
  .cwd-sess.draft{border-left-color:var(--warn)}
  .cwd-sess:hover{border-color:var(--accent2)}
  .cwd-sess.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .cwd-st{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cwd-dchip{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--warn);background:rgba(232,158,60,.16);border-radius:6px;padding:1px 5px}
  .cwd-sx{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .cwd-sm{font-size:10px;color:var(--accent2);font-weight:700;margin-top:3px}
  .cwd-rest{font-size:10.5px;color:var(--muted);text-align:center;padding:14px 0;opacity:.7}
  .cwd-add{font-size:10px;color:var(--accent2);font-weight:700;text-align:center;border:1px dashed var(--line);border-radius:7px;padding:5px;cursor:pointer;margin-top:auto}
  .cwd-add:hover{border-color:var(--accent2)}
  .pv-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap;align-items:center}
  .pv-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  /* scheme library picker */
  .vid-box.sch-wide{max-width:1560px;width:97vw}
  .sl-scope{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:700}
  .sl-scope select{background:#0e151c;border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;font-weight:700;padding:8px 10px;cursor:pointer}
  .sl-grid th.wk,.sl-grid td{min-width:96px}
  .tw-cell{display:inline-flex;align-items:center;gap:3px;justify-content:center}
  .tw-in{width:34px;background:#0e151c;border:1px solid var(--line);border-radius:6px;color:var(--text);text-align:center;padding:5px 3px;font-size:12px;font-weight:700}
  .tw-in.wp{width:42px;color:var(--accent)}
  .tw-in:focus{outline:none;border-color:var(--accent2)}
  .tw-at{color:var(--muted);font-size:11px}
  /* exercise autocomplete */
  .ex-drop{position:fixed;z-index:300;background:#0e151c;border:1px solid var(--accent2);border-radius:10px;max-height:320px;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none;padding:4px}
  .ex-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;cursor:pointer}
  .ex-item:hover,.ex-item.on{background:var(--panel2)}
  .ex-nm{font-weight:700;font-size:13.5px;color:var(--text)}
  .ex-grp{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
  /* ============ COACH NAV + CONSOLE ============ */
  .cnav{display:flex;gap:6px;margin:0 0 16px}
  .cnav button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:9px 18px;cursor:pointer;font-size:14px;font-weight:700;border-radius:10px}
  .cnav button.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .cnav button:hover:not(.on){color:var(--text)}
  .console-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .console-head h1{font-size:24px;margin:0;font-weight:800}
  .console-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .cstat-row{display:flex;gap:10px;flex-wrap:wrap}
  .cstat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:96px}
  .cstat .n{font-size:22px;font-weight:800;color:var(--text)}
  .cstat .n.accent{color:var(--accent)}.cstat .n.good{color:var(--good)}.cstat .n.warn{color:var(--warn)}
  .cstat .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:2px}
  .ctabs{display:flex;gap:4px;margin:8px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ctabs button{background:none;border:none;color:var(--muted);padding:11px 18px;cursor:pointer;font-size:14px;font-weight:700;border-bottom:2px solid transparent}
  .ctabs button.on{color:var(--text);border-bottom-color:var(--accent)}

function addSetRow(exId){

    video_path:null, uploading:false, logId:null, gym_id:curSession.gym_id, psId:null, exId:exId, added:true };

function recompute(){
  let pNL=0,aNL=0,aTon=0,miss=0,planSets=0,doneSets=0,good=0,effSum=0,effN=0;
  const per=curExercises.map(ex=>{
    let e={name:ex.name,pNL:0,aNL:0,aTon:0,miss:0,sets:ex.setIds.length,done:0};
    ex.setIds.forEach(id=>{ const st=logState[id];
      const pr=parseInt(st.targetReps)||0, r=parseInt(st.reps)||0, k=num(st.kg), m=parseInt(st.miss)||0;
      planSets++; if(st.done){doneSets++;e.done++;}
      if(st.lights===3)good++;
      if(st.effort){effN++;effSum+=EFFN[st.effort];}
      e.pNL+=pr; e.aNL+=r; e.aTon+=r*k; e.miss+=m;
      pNL+=pr; aNL+=r; aTon+=r*k; miss+=m;
    });
    return e;
  });
  const completion=planSets?Math.round(doneSets/planSets*100):0, avgEff=effN?EFFL[Math.round(effSum/effN)]:'—';
  const tile=(l,a,p)=>`<div class="ss-tile"><div class="ss-v">${a}${p!=null?`<span class="ss-p"> / ${p}</span>`:''}</div><div class="ss-l">${l}</div></div>`;
  const tiles=`<div class="ss-tiles">${tile('Volume (NL)',aNL,pNL)}${tile('Tonnage',(aTon/1000).toFixed(1)+'t')}${tile('Set completion',completion+'%')}${tile('Good lifts',good+'/'+planSets)}${tile('Misses',miss)}${tile('Avg effort',avgEff)}</div>`;
  const lines=`<table class="ss-ex"><tbody>${per.map(e=>`<tr><td>${esc(e.name)}</td><td>${e.done}/${e.sets} sets</td><td><b style="color:var(--text)">${e.aNL}</b> NL / ${e.pNL}</td><td>${(e.aTon/1000).toFixed(1)}t</td><td>${e.miss?`<span style="color:var(--bad)">${e.miss} miss</span>`:'<span style="color:var(--good)">clean</span>'}</td></tr>`).join('')}</tbody></table>`;
  const box=document.getElementById('ssBody'); if(box) box.innerHTML=tiles+lines;
}
function wireLogging(){
  const root=document.getElementById('logRoot'); if(!root) return;
  root.addEventListener('input', e=>{ const inp=e.target.closest('.cell'); if(!inp) return; logState[inp.closest('tr').dataset.set][inp.dataset.f]=inp.value; recompute(); });
  root.addEventListener('change', e=>{ const c=e.target.closest('.chk'); if(!c) return; logState[c.closest('tr').dataset.set].done=c.checked; recompute(); });
  root.addEventListener('click', e=>{
    const tr=e.target.closest('tr[data-set]'); if(!tr) return; const id=tr.dataset.set; const st=logState[id];
    if(e.target.closest('.lg-lts')){ st.lights = st.lights===0?3:st.lights-1; refreshRow(id); recompute(); return; }
    const eff=e.target.closest('.lg-light'); if(eff){ st.effort=(st.effort===eff.dataset.eff?null:eff.dataset.eff); refreshRow(id); recompute(); return; }
    const v=e.target.closest('.upvid'); if(v){ if(st.video_path) playVideo(st.video_path); else { uploadTargetSet=id; document.getElementById('vidInput').click(); } return; }
    const vr=e.target.closest('.vidrm'); if(vr){
      if(!vr.classList.contains('arm')){ vr.classList.add('arm'); vr.textContent='remove?'; setTimeout(()=>{ if(vr.isConnected){ vr.classList.remove('arm'); vr.textContent='✕'; } }, 4500); }

    const del=e.target.closest('.lg-del'); if(del){ removeSetRow(id); return; }
  });
}

    .eq('athlete_id', me_.id).neq('status','draft').gte('session_date', wkIso[0]).lte('session_date', wkIso[6])
    .order('session_date',{ascending:true}).order('created_at',{ascending:true});

  const byDate={}; (weekSess||[]).forEach(s=>{ (byDate[s.session_date]=byDate[s.session_date]||[]).push(s); });
  // fallback: latest session ever, if nothing this week
  let fallback=null;
  if(!Object.keys(byDate).length){
    const { data: latest } = await sb.from('sessions').select(SESSION_SELECT)
      .eq('athlete_id', me_.id).neq('status','draft').order('session_date',{ascending:false}).order('created_at',{ascending:false}).limit(1);

    if(!fallback){ app.innerHTML = topbar('Athlete') + athNav('athlete') + `<div class="card"><div class="empty">No session assigned yet — your coach will publish your training here.</div></div>`; return; }
  }
  // logs for everything in view (prefill + status dots)
  const ids=[]; Object.values(byDate).forEach(list=>list.forEach(s=>ids.push(s.id))); if(fallback) ids.push(fallback.id);
  // today's readiness check-in (independent of which day is being viewed).
  // Gated: if the readiness table doesn't exist yet (migration not run), hide the card entirely.
  if(!rkState || rkState.date!==todayStr){

  // block context (gated — skipped if blocks table missing)
  let athBlockLbl='';

    .lte('start_date', wkIso[6]).gte('end_date', wkIso[0]).order('start_date',{ascending:false}).limit(1);

  }
  const isLogged = s => (logsBySession[s.id]||[]).some(l=>l.done);
  // which day is selected
  let sel = (selDate && byDate[selDate]) ? selDate : null;
  if(!sel && byDate[todayStr]) sel=todayStr;

  athSelSess = session.id;
  curSession = session;

      <span class="av-day-type">${s?esc(shortTitle(s.title))+(list.length>1?` +${list.length-1}`:''):'Rest'}</span><span class="av-day-dot ${dot}"></span>
    </div>`;
  }).join('');
  const r0=wk[0], r6=wk[6];
  const weekLabel = MONS[r0.getMonth()]+' '+r0.getDate()+' – '+(r6.getMonth()===r0.getMonth()?'':MONS[r6.getMonth()]+' ')+r6.getDate();
  const dayPill = session.session_date===todayStr ? 'TODAY' : (session.session_date<todayStr ? (isLogged(session)?'COMPLETED':'OPEN') : 'UPCOMING');

  // can athletes add extra sets yet? (lights up once 05_addset.sql has been run)
  const probe = await sb.from('logged_sets').select('exercise_id').limit(1);
  addSetReady = !probe.error;
  const exs = (session.prescribed_exercises||[]).slice().sort(sortByPos);
  logState = {}; curExercises = [];
  let body = '';
  exs.forEach(ex=>{
    const sets = (ex.prescribed_sets||[]).slice().sort(sortByPos);
    const cat = (ex.category||'primary').toLowerCase(), isAcc = cat==='accessory';
    const setIds=[]; let rows='';
    sets.forEach((s,i)=>{
      const lg = logBySet[s.id];
      logState[s.id] = {
        idx:i+1, targetReps: s.target_reps, targetText: s.target_text||'',
        reps: lg && lg.actual_reps!=null ? lg.actual_reps : (s.target_reps!=null?s.target_reps:''),
        kg:   lg && lg.actual_kg!=null ? lg.actual_kg : (s.target_kg!=null?s.target_kg:''),
        lights: lg && lg.lights!=null ? lg.lights : 3,
        effort: lg ? (lg.effort||null) : null,
        miss: lg && lg.miss!=null ? lg.miss : 0,
        done: lg ? !!lg.done : false,
        video_path: lg ? (lg.video_path||null) : null, uploading:false,

      setIds.push(s.id); rows += rowHtml(s.id,i);
    });
    // athlete-added sets already saved for this exercise
    (logs||[]).filter(l=>!l.prescribed_set_id && l.exercise_id===ex.id)
      .sort((a,b)=>new Date(a.logged_at)-new Date(b.logged_at))
      .forEach(l=>{
        const key='a_'+l.id;
        logState[key]={ idx:setIds.length+1, targetReps:null, targetText:'',
          reps:l.actual_reps!=null?l.actual_reps:'', kg:l.actual_kg!=null?l.actual_kg:'',
          lights:l.lights!=null?l.lights:3, effort:l.effort||null, miss:l.miss!=null?l.miss:0,

        setIds.push(key); rows += rowHtml(key, setIds.length-1);
      });
    curExercises.push({name:ex.name, exId:ex.id, setIds});
    body += `<div class="ex">
      <div class="av-head"><span class="pill ${isAcc?'accessory':'primary'}">${esc(cat)}</span><span class="name">${esc(ex.name)}</span></div>
      <div class="logwrap"><table class="logtable" data-ex="${ex.id}"><thead><tr><th>Set</th><th>Target</th><th>Reps</th><th>Weight</th><th>Miss</th><th>Lights</th><th>Effort</th><th>Video</th><th>Done</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>

    </div>`;
  });

  app.innerHTML = topbar('Athlete') + athNav('athlete') + `
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="pill phase">${esc((session.status||'training').toUpperCase())}</span>

        <span class="pill" style="margin-left:auto">${dayPill}</span>
      </div>
      <div class="sub" style="margin-top:6px">Log what you did · tap the lights (white = good lift, red = miss) · rate effort E/M/H/X · tick each set off. Saves straight to your coach.</div>
    </div>

      <div class="av-daystrip">${strip}</div>
    </div>
    <div id="rkHost">${checkinCard()}</div>
    ${dayList.length>1?`<div class="cw-stabs" style="margin:0 0 12px">${dayList.map(x=>`<button class="cw-stab${x.id===session.id?' on':''}" onclick="athSelectSess('${x.id}')">${esc(x.title||'Session')}</button>`).join('')}</div>`:''}

async function saveSession(){
  const btn=document.getElementById('save'), msg=document.getElementById('savedmsg');
  btn.disabled=true; btn.textContent='Saving…'; msg.style.color=''; msg.textContent='';
  const { data:{ user } } = await sb.auth.getUser();
  if(!user || user.id !== me_.id){
    btn.disabled=false; btn.textContent='Submit session';
    msg.style.color='var(--bad)'; msg.textContent='⚠ Login mismatch — sign out and sign back in as this athlete.';
    return;
  }
  try{
    let saved=0;
    for(const id in logState){
      const st=logState[id];
      const payload=setPayload(st);
      const res = st.logId
        ? await sb.from('logged_sets').update(payload).eq('id', st.logId).select()
        : await sb.from('logged_sets').insert(payload).select();
      if(res.error) throw res.error;
      if(!res.data || res.data.length===0) throw new Error('the database rejected the save (login). Sign out and back in.');
      st.logId = res.data[0].id;
      saved++;
    }
    btn.disabled=false; btn.textContent='Submit session';
    msg.style.color='var(--good)'; msg.textContent='✓ Submitted — your coach has it'; setTimeout(()=>{ msg.textContent=''; },3500);
  }catch(e){
    btn.disabled=false; btn.textContent='Submit session';
    msg.style.color='var(--bad)'; msg.textContent='⚠ Save failed — '+(e.message||e);
  }
}

function relTime(ts){ if(!ts) return '—'; const d=new Date(ts); const days=Math.floor((Date.now()-d.getTime())/864e5);

function rdyClass(s){ return s==null?'':(s>=4?'ok':(s>=3?'watch':'attention')); }
function avColor(name){ let h=0; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h); const hue=Math.abs(h)%360; return `hsl(${hue},45%,62%)`; }

function rosterRunway(a, st){ const m=(st.maxFutureByAth||{})[a.id]; if(!m) return -1; return Math.max(0, Math.round((new Date(m+'T00:00:00')-new Date(iso(new Date())+'T00:00:00'))/864e5)); }
function rosterProgsFor(aid){
  return (conState._assigns||[]).filter(x=>x.athlete_id===aid).map(x=>{
    const p=(conState._programs||[]).find(pp=>pp.id===x.program_id); if(!p) return null;
    return { name:p.name, pr:asgProgress(x) };
  }).filter(Boolean);
}
window.rosterSortBy=(col)=>{ const s=conState.rosterSort||{col:'name',dir:1}; conState.rosterSort = s.col===col ? {col, dir:-s.dir} : {col, dir:1}; renderRosterTable(); };
function renderRosterTable(){
  const host=document.getElementById('rosterTableHost'); if(!host) return;
  const st=conState._stats||{lastByAth:{},rdyByAth:{},upcomingByAth:{},maxFutureByAth:{}};
  const q=(conState.rosterQ||'').toLowerCase();
  let list=(coachState.athletes||[]).filter(a=>!q||a.full_name.toLowerCase().indexOf(q)>-1);
  if(conState.rosterTeam) list=list.filter(a=>a.team_id===conState.rosterTeam);
  if(conState.rosterProg) list=list.filter(a=>(conState._assigns||[]).some(x=>x.athlete_id===a.id && x.program_id===conState.rosterProg));
  // sort
  const so=conState.rosterSort||{col:'name',dir:1};
  const teamName=(a)=>{ const t=(conState._teams||[]).find(x=>x.id===a.team_id); return t?t.name:'~'; };
  const key={
    name:a=>a.full_name.toLowerCase(),
    team:a=>teamName(a).toLowerCase(),
    last:a=>st.lastByAth[a.id]?new Date(st.lastByAth[a.id]).getTime():0,
    needs:a=>{ const r=rosterRunway(a,st); return r<0?99999:r; },
    rdy:a=>st.rdyByAth[a.id]==null?-1:st.rdyByAth[a.id],
    prog:a=>(rosterProgsFor(a.id)[0]||{name:'~'}).name.toLowerCase()
  }[so.col]||(a=>a.full_name.toLowerCase());
  list=list.slice().sort((a,b)=>{ const ka=key(a),kb=key(b); return (ka<kb?-1:ka>kb?1:0)*so.dir; });
  const arrow=(c)=>so.col===c?(so.dir>0?' ↑':' ↓'):' ↕';
  const th=(c,lbl,extra)=>`<th class="rsort${so.col===c?' on':''}" onclick="event.stopPropagation();rosterSortBy('${c}')"${extra||''}>${lbl}<span class="sc">${arrow(c)}</span></th>`;
  const rows=list.map(a=>{
    const rdy=st.rdyByAth[a.id];
    const rw=rosterRunway(a,st);
    const rwHtml = rw<0 ? '<span class="dt-flag attention">none</span>'
      : `<b style="color:${rw===0?'var(--bad)':(rw<7?'var(--warn)':'var(--good)')}">${rw}d</b>`;
    const ps=rosterProgsFor(a.id);
    const progHtml = ps.length ? `<div class="rprogs">${ps.map(x=>`<span class="rprog-chip">${esc(x.name)}<i>${esc(x.pr.label)}</i></span>`).join('')}</div>` : '<span class="sub">—</span>';
    return `<tr onclick="conOpenAthlete('${a.id}')">
      <td><div class="rname"><span class="rava" style="background:${avColor(a.full_name)}">${esc(initials(a.full_name))}</span><div><b>${esc(a.full_name)}</b></div></div></td>
      <td>${teamCell(a)}</td>
      <td><span class="sdot active"><i></i>active</span></td>
      <td>${progHtml}</td>
      <td>${relTime(st.lastByAth[a.id])}</td>
      <td>${rwHtml}</td>
      <td>${rdy!=null?`<span class="dt-flag ${rdyClass(rdy)}">${rdy.toFixed(1)}</span>`:'<span class="sub">—</span>'}</td>
      <td style="text-align:right;color:var(--accent2);font-weight:700">open →</td>
    </tr>`;
  }).join('');
  host.innerHTML=`
    <div class="card" style="padding:6px 4px">
      <table class="roster"><thead><tr>
        ${th('name','Athlete')}${th('team','Team')}<th>Status</th>${th('prog','Programs')}${th('last','Last logged')}${th('needs','Needs programming')}${th('rdy','Readiness')}<th></th>
      </tr></thead><tbody>${rows}</tbody></table>
      ${list.length?'':'<div class="con-empty">No athletes match.</div>'}
    </div>`;
}

/* ---- TEAMS tab ---- */
function teamAthCount(tid){ return (coachState.athletes||[]).filter(a=>a.team_id===tid).length; }
function teamProgram(team){
  const progs=conState._programs||[];
  let p=progs.find(pp=>pp.team_id===team.id && !pp.archived);
  if(p) return p;
  const athIds=new Set((coachState.athletes||[]).filter(a=>a.team_id===team.id).map(a=>a.id));
  const counts={}; (conState._assigns||[]).forEach(x=>{ if(athIds.has(x.athlete_id)) counts[x.program_id]=(counts[x.program_id]||0)+1; });
  let best=null,bn=0; Object.keys(counts).forEach(pid=>{ if(counts[pid]>bn){ bn=counts[pid]; best=pid; } });
  return best ? progs.find(pp=>pp.id===best) : null;
}
function teamScore(team){
  const rdy=(conState._stats||{}).rdyByAth||{};
  const vals=(coachState.athletes||[]).filter(a=>a.team_id===team.id).map(a=>rdy[a.id]).filter(v=>v!=null);
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*20) : null;
}
function scoreColor(s){ return s>=80?'var(--good)':(s>=60?'var(--warn)':'var(--bad)'); }
function teamBuffer(p){ if(!p) return ''; const u=pubInfo(progDerive(p));
  if(u.bufWks>0) return ` · <span class="bufmini">+${u.bufDays}d ready</span>`;
  if(u.built>=u.wks && u.pub>=u.wks) return ` · <span class="bufmini" style="color:var(--good)">fully published</span>`;
  return ` · <span class="bufmini" style="color:var(--muted)">no buffer</span>`;
}
function teamProgHtml(team){ const p=teamProgram(team); return p ? `<span class="tm-prog">${esc(p.name)}</span>${teamBuffer(p)}` : `<span style="color:var(--warn)">none assigned</span>`; }
function teamNextComp(team){
  if(!team.next_comp) return '—';
  let d=''; if(team.next_comp_date){ const dt=new Date(team.next_comp_date+'T00:00:00'); d=' · '+MONS[dt.getMonth()]+' '+dt.getDate(); }
  return esc(team.next_comp)+d;
}

function mondayOfDate(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function weekIdxInBlock(block, dateStr){
  const m0=mondayOfDate(new Date(block.start_date+'T00:00:00'));
  const m=mondayOfDate(new Date(dateStr+'T00:00:00'));
  return Math.round((m-m0)/(7*864e5));
}
window.saveBlockAsProgram=async function(){
  if(!cw || !cw.block){ alert('No training block is set for this week. Define a block first (✎ edit on the block banner).'); return; }
  if(ed && ed.dirty){ alert('Save your current changes first, then save the block as a program.'); return; }
  const block=cw.block;
  // fetch every session in the block for this athlete
  const { data: sess, error } = await sb.from('sessions')
    .select(SESSION_SELECT)
    .eq('athlete_id', cw.athId).gte('session_date', block.start_date).lte('session_date', block.end_date)
    .order('session_date',{ascending:true}).order('created_at',{ascending:true});
  if(error){ alert('Could not read the block — '+error.message); return; }
  const sessions=(sess||[]).filter(s=>(s.prescribed_exercises||[]).length);
  if(!sessions.length){ alert('This block has no programmed sessions to save yet.'); return; }
  const days=sessions.map(s=>({
    wk: Math.max(0, weekIdxInBlock(block, s.session_date)),
    dow: (new Date(s.session_date+'T00:00:00').getDay()+6)%7,
    title: s.title||'Training',
    exercises: (s.prescribed_exercises||[]).slice().sort(sortByPos).map(ex=>({
      name: ex.name, category: ex.category||'primary', load_type: ex.load_type||'percentage',
      cues: Array.isArray(ex.cues)?ex.cues:null, coach_note: ex.coach_note||null,
      sets: (ex.prescribed_sets||[]).slice().sort(sortByPos).map(ps=>({
        reps: ps.target_reps, pct: ps.target_pct!=null?parseFloat(ps.target_pct):null,
        vel: ps.target_vel!=null?parseFloat(ps.target_vel):null, eff: ps.target_eff!=null?parseFloat(ps.target_eff):null,
        kg: (ex.load_type==='weight' && ps.target_kg!=null)?parseFloat(ps.target_kg):null }))
    }))
  }));
  const weeksN=Math.max.apply(null, days.map(d=>d.wk+1).concat([1]));
  window._pgCapture={ name: block.name+' — program', phase: block.phase||null, weeks: weeksN, wave: block.wave||null, data:{days} };
  ovModal('pgSaveModal', `
    <div class="ov-hd"><h2 style="margin:0">⊞ Save block as program</h2><span class="vid-x" onclick="document.getElementById('pgSaveModal').style.display='none'">✕</span></div>
    <div class="sub" style="margin:6px 0 12px">Captured <b>${sessions.length} day${sessions.length===1?'':'s'}</b> across <b>${weeksN} week${weeksN===1?'':'s'}</b> (reps, %1RM/velocity, cues & notes). Loads re-price off each athlete's maxes when you stamp it.</div>
    <div class="bf-row"><input id="pgName" value="${esc(window._pgCapture.name)}" placeholder="Program name" style="flex:1;min-width:240px;font-weight:700;font-size:15px"></div>
    <div class="bf-row" style="margin-top:12px"><button class="btn" onclick="doSaveProgram()">Save to program library</button>
      <span class="saved" id="pgSaveMsg"></span></div>`);
};

  const wk=elapsed+1;
  if(wk>wks) return {label:'completed', done:true};
  return {label:'wk '+wk+'/'+wks};
}

function progAudience(p, assigns){
  if(p.team_id){ const n=teamNameById(p.team_id); if(n) return n; }
  const teamIds=new Set(); assigns.forEach(a=>{ const ath=(coachState.athletes||[]).find(x=>x.id===a.athlete_id); if(ath&&ath.team_id) teamIds.add(ath.team_id); });
  if(teamIds.size===1){ const n=teamNameById(Array.from(teamIds)[0]); if(n) return n; }
  return assigns.length ? 'Individual' : '—';
}
function progEdited(p, status){
  if(status==='draft') return 'Draft';
  const ts=p.updated_at||p.created_at;
  if(status==='arch') return 'Archived'+(p.updated_at?' · '+relTime(p.updated_at):'');
  return ts ? 'Edited '+relTime(ts) : 'Edited recently';
}
function progDerive(p){
  const assigns=(conState._assigns||[]).filter(a=>a.program_id===p.id);
  const status = p.archived ? 'arch' : (assigns.length ? 'active' : 'draft');
  const wks=p.weeks||1;
  let cur=0;
  if(assigns.length){
    const minStart=Math.min.apply(null, assigns.map(a=>mondayOfDate(new Date(a.start_date+'T00:00:00')).getTime()));
    const elapsed=Math.round((mondayOfDate(new Date())-minStart)/(7*864e5));
    cur=Math.max(0, Math.min(wks, elapsed+1));
  }
  const startByAth={}; assigns.forEach(a=>startByAth[a.athlete_id]=mondayOfDate(new Date(a.start_date+'T00:00:00')).getTime());
  const pubWeeks=new Set();
  (conState._progSess||[]).forEach(s=>{ if(s.program_id!==p.id||s.status!=='published') return; const st=startByAth[s.athlete_id]; if(st==null) return;
    const wk=Math.round((mondayOfDate(new Date(s.session_date+'T00:00:00'))-st)/(7*864e5)); if(wk>=0&&wk<wks) pubWeeks.add(wk); });
  return { id:p.id, name:p.name, phase:p.phase||'', wks, status, team:progAudience(p,assigns), athletes:assigns.length, edited:progEdited(p,status), built:wks, pub:pubWeeks.size, cur };
}
function pubInfo(d){ let wks=d.wks||0, built=Math.min(d.built==null?wks:d.built, wks), pub=Math.min(d.pub||0, built); const bufWks=built-pub; return {wks,built,pub,bufWks,bufDays:bufWks*7}; }
function pubMeter(d){ const u=pubInfo(d); if(!u.wks) return '';
  const live=Math.round(u.pub/u.wks*100), buf=Math.round(u.bufWks/u.wks*100);
  return `<div class="pub-bar">${live>0?`<span class="pub-live" style="width:${live}%"></span>`:''}${buf>0?`<span class="pub-buf" style="width:${buf}%"></span>`:''}</div>
    <div class="pub-legend"><span class="lg-live"><i></i>${u.pub}w published</span>${u.bufWks>0?`<span class="lg-buf"><i></i>${u.bufWks}w built ahead</span>`:''}${u.built<u.wks?`<span class="lg-un"><i></i>${u.wks-u.built}w unwritten</span>`:''}</div>`;
}
function pubChip(d){ const u=pubInfo(d);
  if(d.status==='draft') return `<div class="bufchip draftb">● Draft — ${u.built}w (${u.built*7}d) written, unpublished</div>`;
  if(d.status==='arch') return '';
  if(u.bufWks>0) return `<div class="bufchip ready">+${u.bufDays}d ready to publish (${u.bufWks}w built ahead)</div>`;
  if(u.built>=u.wks) return `<div class="bufchip full">✓ Fully published</div>`;
  return `<div class="bufchip none">No buffer — build next week</div>`;
}
function listPubNote(d){ const u=pubInfo(d);
  if(d.status==='draft') return `<span class="bufmini" style="color:var(--warn)">Draft · ${u.built*7}d written</span>`;
  if(d.status==='arch') return esc(d.edited);

    if(!targets.length){ const m=document.getElementById('stampMsg'); if(m){m.style.color='var(--warn)';m.textContent='That team has no athletes yet.';} return; }
  } else {
    targets=[document.getElementById('stampAth').value];
  }
  const msg=document.getElementById('stampMsg'); if(msg){ msg.style.color=''; msg.textContent='Stamping…'; }
  const btn=document.querySelector('#stampModal .btn'); if(btn) btn.disabled=true;
  const startMon=mondayOfDate(new Date(start+'T00:00:00'));
  let athDone=0, totalSessions=0;
  try{
    for(const athId of targets){
      const { data: mx } = await sb.from('maxes').select('lift,kg').eq('athlete_id', athId);
      const maxes={}; (mx||[]).forEach(m=>maxes[m.lift]=parseFloat(m.kg));
      for(const day of (p.data.days||[])){
        const d=new Date(startMon); d.setDate(d.getDate()+ (day.wk||0)*7 + (day.dow||0));
        const sIns={ gym_id:me_.gym_id, athlete_id:athId, session_date:iso(d), title:day.title||'Training', status:'draft' };
        if(PROG_ID_READY) sIns.program_id=p.id;
        const { data: ns, error: se } = await sb.from('sessions').insert(sIns).select().single();
        if(se) throw se;
        let pos=0;
        for(const ex of (day.exercises||[])){
          const exIns={ gym_id:me_.gym_id, session_id:ns.id, position:pos++, name:ex.name, category:ex.category||'primary', coach_note:ex.coach_note||null };
          if(LT_READY){ exIns.load_type=ex.load_type||'percentage'; exIns.cues=ex.cues||null; }
          const { data: ne, error: ee } = await sb.from('prescribed_exercises').insert(exIns).select().single(); if(ee) throw ee;
          const orm=(ex.load_type||'percentage')==='percentage'?ormLookup(ex.name, maxes):null;
          const rows=(ex.sets||[]).map((s,si)=>{ const kg=(s.kg!=null&&s.kg!=='')?s.kg:((s.pct!=null&&orm)?Math.round(orm*s.pct/100):null);
            const st={reps:s.reps,pct:s.pct,kg,vel:s.vel,eff:s.eff};
            const row={ gym_id:me_.gym_id, exercise_id:ne.id, position:si,
              target_reps:s.reps!=null?s.reps:null, target_pct:s.pct!=null?s.pct:null, target_kg:st.kg,
              target_text:targetText({reps:s.reps==null?'':s.reps,pct:s.pct==null?'':s.pct,kg:st.kg==null?'':st.kg,vel:s.vel==null?'':s.vel,eff:s.eff==null?'':s.eff}, ex.load_type||'percentage') };
            if(LT_READY){ row.target_vel=s.vel!=null?s.vel:null; row.target_eff=s.eff!=null?s.eff:null; } return row; });
          if(rows.length){ const { error: re } = await sb.from('prescribed_sets').insert(rows); if(re) throw re; }
        }
        totalSessions++;
      }
      await sb.from('program_assignments').upsert({ gym_id:me_.gym_id, program_id:p.id, athlete_id:athId, start_date:start, weeks:p.weeks||1, status:'active' }, { onConflict:'program_id,athlete_id' });
      athDone++;
      if(msg) msg.textContent='Stamping… '+athDone+'/'+targets.length;
    }
    document.getElementById('stampModal').style.display='none';
    conState._assigns=undefined; conState._progSess=undefined;
    const who = window._stampMode==='team'
      ? (athDone+' athlete'+(athDone===1?'':'s'))
      : (((coachState.athletes||[]).find(a=>a.id===targets[0])||{}).full_name || 'athlete');
    alert('✓ Stamped "'+p.name+'" onto '+who+' — '+totalSessions+' draft session'+(totalSessions===1?'':'s')+' created starting '+start+'. Open them in Coach View to review & publish.');
    if(coachState.screen==='console' && conState.tab==='programs') renderConBody();
  }catch(e){ if(btn) btn.disabled=false; if(msg){ msg.style.color='var(--bad)'; msg.textContent='Stamp failed — '+(e.message||e); } }
};

let pbState=null; // {id,name,phase,weeks,wave,days:[{wk,dow,title,exercises:[{name,category,load_type,cues,coach_note,sets:[{reps,pct,vel,eff,kg}]}]}],wk}

window.pbWeeks=(delta)=>{

function waveLevels(pattern,n){ const L=['light','moderate','heavy','peak']; const out=[];
  for(let i=0;i<n;i++){ let lv;
    if(pattern==='Linear Ascending') lv=L[Math.min(3,Math.floor(i/Math.max(1,n-1)*3.99))];
    else if(pattern==='Linear Descending') lv=L[Math.min(3,Math.floor((n-1-i)/Math.max(1,n-1)*3.99))];
    else if(pattern==='Peak on W2') lv = i===1?'peak':(i===0?'moderate':'light');
    else if(pattern==='Peak on W3') lv = i===2?'peak':(i<2?L[Math.min(2,i+1)]:'light');
    else if(pattern==='Undulating') lv = (i%2===0)?'moderate':'heavy';
    else if(pattern==='Deload') lv='light';

    out.push(lv); }

const CAL_DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], CAL_DOWm=['S','M','T','W','T','F','S'], MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
function dIdx(y,m,d){ return Math.round(new Date(y,m,d).getTime()/864e5); }
function calEventsList(){
  const out=[];
  planState.events.forEach(e=>{
    if(planState.teamId && e.team_id && e.team_id!==planState.teamId) return;
    if(e.athlete_id && e.athlete_id!==planState.athleteId) return;
    out.push({ id:e.id, src:'ev', title:e.title, kind:e.kind, y:+e.start_date.slice(0,4), m:+e.start_date.slice(5,7)-1, d:+e.start_date.slice(8,10), days:e.days||1 });
  });
  planState.comps.forEach(c=>{
    if(planState.teamId && c.team_id && c.team_id!==planState.teamId) return;
    out.push({ id:c.id, src:'comp', title:c.name, kind:(c.kind==='test'?'testing':'competition'), y:+c.comp_date.slice(0,4), m:+c.comp_date.slice(5,7)-1, d:+c.comp_date.slice(8,10), days:1 });
  });
  return out;
}
function evOn(y,m,d){ const idx=dIdx(y,m,d); return calEventsList().filter(e=>{ const s=dIdx(e.y,e.m,e.d); return idx>=s && idx<=s+(e.days||1)-1; }).map(e=>{ const s=dIdx(e.y,e.m,e.d); return Object.assign({}, e, { cont: idx>s, start: idx===s }); }); }
function evChip(e){ const lbl=e.cont?('↳ '+e.title):(e.title+(e.days>1?' · '+e.days+'d':'')); const click=e.cont?'':`onclick="event.stopPropagation();planEditEvent('${e.src}','${e.id}')"`; return `<div class="cx-ev${e.cont?' cont':''}" style="background:${calColor(e.kind)}" title="${esc(e.title)}" ${click}>${esc(lbl)}</div>`; }
async function loadCalSessions(){
  planState.calSess={};
  if(!planState.athleteId || planState.calView==='year') return;
  const c=planState.cur; let a,b;
  if(planState.calView==='month'){ a=iso(new Date(c.y,c.m,1)); b=iso(new Date(c.y,c.m+1,0)); }
  else if(planState.calView==='week'){ const base=new Date(c.y,c.m,c.d); base.setDate(base.getDate()-base.getDay()); const e=new Date(base); e.setDate(e.getDate()+6); a=iso(base); b=iso(e); }
  else { a=b=iso(new Date(c.y,c.m,c.d)); }
  const { data: sess } = await sb.from('sessions').select('id,title,session_date,status,prescribed_exercises(name,position,prescribed_sets(target_reps,target_pct))').eq('athlete_id', planState.athleteId).gte('session_date', a).lte('session_date', b).order('created_at',{ascending:true});
  const ids=(sess||[]).map(s=>s.id); let logged=new Set();
  if(ids.length){ const r=await sb.from('logged_sets').select('session_id').in('session_id', ids); (r.data||[]).forEach(l=>logged.add(l.session_id)); }
  (sess||[]).forEach(s=>{ if(planState.calSess[s.session_date]) return; const st=statsFor([s],[]);
    const status = logged.has(s.id)?'done':(s.status==='draft'?'draft':'pub');
    planState.calSess[s.session_date]={ id:s.id, title:s.title, status, nl:st.vol, ari:st.ari?Math.round(st.ari):null, exs:(s.prescribed_exercises||[]).slice().sort(sortByPos).map(e=>e.name).filter(Boolean).slice(0,3).join(' · ') }; });
}
function sessOn(y,m,d){ return planState.calSess[iso(new Date(y,m,d))]; }
function sessChip(s){ const cls=s.status==='draft'?'draft':(s.status==='done'?'done':''); const txt=s.status==='draft'?'Training · draft':('Training · '+s.nl+'NL'); return `<div class="cx-sess ${cls}">${txt}</div>`; }
function calLegend(){ return `<div class="cx-legend2">${Object.keys(CAL_KINDS).map(k=>`<span><i style="background:${CAL_KINDS[k][0]}"></i>${CAL_KINDS[k][1]}</span>`).join('')}<span style="margin-left:6px"><i style="background:#3c9ee8"></i>Session · published</span><span><i style="background:#3ec97a"></i>Session · done</span><span><i style="border:1px dashed #3c5a7a;background:transparent"></i>Session · draft</span></div>`; }
window.planSetView=(v)=>{ planState.calView=v; paintPlan(); };
window.planToday=()=>{ const t=new Date(); planState.cur={y:t.getFullYear(),m:t.getMonth(),d:t.getDate()}; paintPlan(); };
window.planNav=(dir)=>{ const c=planState.cur, v=planState.calView;
  if(v==='year') c.y+=dir;
  else if(v==='month'){ c.m+=dir; if(c.m<0){c.m=11;c.y--;} if(c.m>11){c.m=0;c.y++;} }
  else { const st=v==='week'?7:1; const dt=new Date(c.y,c.m,c.d); dt.setDate(dt.getDate()+st*dir); c.y=dt.getFullYear(); c.m=dt.getMonth(); c.d=dt.getDate(); }
  paintPlan(); };
window.planOpenMonth=(m)=>{ planState.cur.m=m; planState.calView='month'; paintPlan(); };
window.planOpenDay=(y,m,d)=>{ planState.cur={y,m,d}; planState.calView='day'; paintPlan(); };
async function renderPlanCal(){
  const host=document.getElementById('planBody'); if(!host) return;
  await loadCalSessions();
  const v=planState.calView, c=planState.cur, td=new Date(), isToday=(y,m,d)=>y===td.getFullYear()&&m===td.getMonth()&&d===td.getDate();
  let title='', body='';
  if(v==='year'){
    title=String(c.y);
    let minis='';
    for(let m=0;m<12;m++){ const fd=new Date(c.y,m,1).getDay(), n=new Date(c.y,m+1,0).getDate();
      let cells=''; for(let i=0;i<fd;i++) cells+=`<div class="cx-md dim"></div>`;
      for(let d=1;d<=n;d++){ const e=evOn(c.y,m,d); const dot=e.length?`<span class="cx-dot" style="background:${calColor(e[0].kind)}"></span>`:''; cells+=`<div class="cx-md${isToday(c.y,m,d)?' today':''}">${d}${dot}</div>`; }
      minis+=`<div class="cx-mini" onclick="planOpenMonth(${m})"><h4>${MONF[m]}</h4><div class="cx-mini-dow">${CAL_DOWm.map(x=>`<span>${x}</span>`).join('')}</div><div class="cx-mini-grid">${cells}</div></div>`; }
    body=`<div class="cx-year">${minis}</div>`;
  } else if(v==='month'){
    title=MONF[c.m]+' '+c.y; const fd=new Date(c.y,c.m,1).getDay(), n=new Date(c.y,c.m+1,0).getDate();
    const pm=c.m===0?11:c.m-1, py=c.m===0?c.y-1:c.y, pn=new Date(py,pm+1,0).getDate();
    let cells=''; for(let i=0;i<fd;i++) cells+=`<div class="cx-cell dim"><span class="cx-date">${pn-fd+1+i}</span></div>`;
    for(let d=1;d<=n;d++){ cells+=`<div class="cx-cell${isToday(c.y,c.m,d)?' today':''}" onclick="planOpenDay(${c.y},${c.m},${d})"><span class="cx-date">${d}</span>${evOn(c.y,c.m,d).map(evChip).join('')}${(()=>{const s=sessOn(c.y,c.m,d);return s?sessChip(s):'';})()}</div>`; }
    const trail=(7-((fd+n)%7))%7; for(let t=1;t<=trail;t++) cells+=`<div class="cx-cell dim"><span class="cx-date">${t}</span></div>`;
    body=`<div class="cx-dow">${CAL_DOW.map(d=>`<span>${d}</span>`).join('')}</div><div class="cx-grid">${cells}</div>`;
  } else if(v==='week'){
    const base=new Date(c.y,c.m,c.d); base.setDate(base.getDate()-base.getDay()); const end=new Date(base); end.setDate(end.getDate()+6);
    title=MONS[base.getMonth()]+' '+base.getDate()+' – '+MONS[end.getMonth()]+' '+end.getDate()+', '+end.getFullYear();
    let cols=''; for(let i=0;i<7;i++){ const dt=new Date(base); dt.setDate(dt.getDate()+i); const y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate(); const s=sessOn(y,m,d);
      cols+=`<div class="cx-wcol${isToday(y,m,d)?' today':''}" onclick="planOpenDay(${y},${m},${d})"><h5>${CAL_DOW[i]}</h5><div class="cx-wd">${d}</div>${evOn(y,m,d).map(evChip).join('')}${s?sessChip(s)+(s.status!=='draft'?`<div class="cx-wmet">${s.nl}NL${s.ari?' · '+s.ari+'%':''}</div>`:''):''}</div>`; }
    body=`<div class="cx-week">${cols}</div>`;
  } else {
    const dt=new Date(c.y,c.m,c.d); title=CAL_DOW[dt.getDay()]+', '+MONF[c.m]+' '+c.d+', '+c.y;
    const evs=evOn(c.y,c.m,c.d), s=sessOn(c.y,c.m,c.d);
    let h=`<div class="cx-day"><div class="cx-day-hd">${MONF[c.m]} ${c.d}${isToday(c.y,c.m,c.d)?' · Today':''}</div>`;
    if(!evs.length && !s) h+='<div class="note sub">Nothing scheduled. Use ＋ Add event to put a meet, test, deload or team event on this day.</div>';
    evs.forEach(e=>{ h+=`<div class="cx-evrow" style="border-left-color:${calColor(e.kind)}" onclick="planEditEvent('${e.src}','${e.id}')"><b>${esc(e.title)}</b><span class="cx-etype">${calLbl(e.kind)}${e.days>1?' · '+e.days+'d':''}</span></div>`; });
    if(s){ const sc=s.status==='draft'?'draft':(s.status==='done'?'done':''); const badge=s.status==='draft'?'<span class="cx-sbadge draft">Draft · not published</span>':(s.status==='done'?'<span class="cx-sbadge done">Done</span>':'<span class="cx-sbadge pub">Published</span>');
      h+=`<div class="cx-scard ${sc}"><div class="cx-scard-hd"><div><b>${esc(s.title||'Training')}</b><div class="cx-etype">${esc(s.exs||'')}</div></div>${badge}</div>
        <div class="cx-mets"><div class="cx-met"><b>${s.nl}</b><span>Vol (NL)</span></div>${s.ari?`<div class="cx-met"><b>${s.ari}%</b><span>ARI</span></div>`:''}</div>
        <div class="note sub" style="margin-top:8px;font-size:11px">${s.status==='done'?'Logged — actuals are in.':(s.status==='draft'?'Planned — built ahead; publish the week to release it.':'Planned — published; the athlete can see it.')}</div>
        <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="openbtn" onclick="planOpenInCoach('${planState.athleteId}','${iso(new Date(c.y,c.m,c.d))}')">Open in Coach View — edit / build / publish →</button></div></div>`; }
    h+='</div>'; body=h;
  }
  host.innerHTML=`<div class="card">
    <div class="calx-head">
      <div class="calx-title">${esc(title)}</div>
      <div class="calx-views">${[['year','Year'],['month','Month'],['week','Week'],['day','Day']].map(x=>`<button class="${v===x[0]?'on':''}" onclick="planSetView('${x[0]}')">${x[1]}</button>`).join('')}</div>
      <div class="calx-nav"><button onclick="planNav(-1)">‹</button><button onclick="planToday()">Today</button><button onclick="planNav(1)">›</button></div>
      <span style="flex:1"></span>
      <span class="cbtn" onclick="planAddEvent()">＋ Add event</span>
    </div>
    ${body}
    ${calLegend()}
  </div>`;
}
window.planOpenInCoach=(athId,dStr)=>{ if(!athId) return; coachState.selected=athId; cw=null; ed=null; coachState.screen='coach'; paintCoach();
  setTimeout(()=>{ if(window.cw){ cw.selDate=dStr; renderCoachDay&&renderCoachDay(); } },400); };

  ovModal('calEvtModal', `
    <div class="ov-hd"><h2 style="margin:0">＋ Add to calendar</h2><span class="vid-x" onclick="document.getElementById('calEvtModal').style.display='none'">✕</span></div>
    <div class="sub" style="margin:6px 0 12px">Pick a start date and how many days it runs.</div>
    <div class="bf-row"><input id="ceTitle" placeholder="e.g. Squat max test" style="flex:1;min-width:220px"></div>
    <div class="bf-row" style="margin-top:10px">
      <span class="bf-wk"><label>Start date</label><input id="ceDate" type="date" value="${d}"></span>
      <span class="bf-wk"><label>Length</label><select id="ceDays" class="cw-sel">${[1,2,3,4,5,6,7,10,14].map(n=>`<option value="${n}">${n} day${n===1?'':'s'}</option>`).join('')}</select></span>
      <span class="bf-wk"><label>Type</label><select id="ceType" class="cw-sel">${Object.keys(CAL_KINDS).map(k=>`<option value="${k}">${CAL_KINDS[k][1]}</option>`).join('')}</select></span>
    </div>
    <div class="bf-row" style="margin-top:8px"><span class="bf-wk"><label>Team (optional)</label><select id="ceTeam" class="cw-sel"><option value="">Whole gym</option>${teams.map(t=>`<option value="${t.id}"${planState.teamId===t.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select></span></div>
    <div class="bf-row" style="margin-top:12px"><button class="btn" onclick="planSaveEvent()">Add event</button><span class="saved" id="ceMsg"></span></div>`);
  setTimeout(()=>{ const t=document.getElementById('ceTitle'); if(t) t.focus(); },30);
};
window.planEditEvent=(src,id)=>{
  if(src==='comp'){ planEditComp(id); return; } // comps edit via the macrocycle modal
  const e=planState.events.find(x=>x.id===id); if(!e) return;
  const teams=conState._teams||[];
  ovModal('calEvtModal', `
    <div class="ov-hd"><h2 style="margin:0">Edit event</h2><span class="vid-x" onclick="document.getElementById('calEvtModal').style.display='none'">✕</span></div>
    <div class="bf-row"><input id="ceTitle" value="${esc(e.title)}" style="flex:1;min-width:220px"></div>
    <div class="bf-row" style="margin-top:10px">
      <span class="bf-wk"><label>Start date</label><input id="ceDate" type="date" value="${e.start_date}"></span>
      <span class="bf-wk"><label>Length</label><select id="ceDays" class="cw-sel">${[1,2,3,4,5,6,7,10,14].map(n=>`<option value="${n}"${(e.days||1)===n?' selected':''}>${n} day${n===1?'':'s'}</option>`).join('')}</select></span>

    </div>
    <div class="bf-row" style="margin-top:8px"><span class="bf-wk"><label>Team (optional)</label><select id="ceTeam" class="cw-sel"><option value="">Whole gym</option>${teams.map(t=>`<option value="${t.id}"${e.team_id===t.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select></span></div>
    <div class="bf-row" style="margin-top:12px"><button class="btn" onclick="planSaveEvent('${id}')">Save</button><span class="extool del" style="margin-left:10px" onclick="planDelEvent('${id}')">✕ delete</span><span class="saved" id="ceMsg"></span></div>`);
};
window.planSaveEvent=async(id)=>{
  const title=(document.getElementById('ceTitle').value||'').trim(); const msg=document.getElementById('ceMsg');
  if(!title){ document.getElementById('ceTitle').focus(); return; }
  const date=document.getElementById('ceDate').value; if(!date){ if(msg){msg.style.color='var(--warn)';msg.textContent='Pick a start date.';} return; }
  const payload={ title, kind:document.getElementById('ceType').value, start_date:date, days:+document.getElementById('ceDays').value||1, team_id:document.getElementById('ceTeam').value||null };
  let res; if(id) res=await sb.from('calendar_events').update(payload).eq('id',id).select(); else res=await sb.from('calendar_events').insert(Object.assign({gym_id:me_.gym_id},payload)).select();
  if(res.error||!res.data||!res.data.length){ if(msg){msg.style.color='var(--bad)';msg.textContent='Save failed — '+(res.error?res.error.message:'try again');} return; }
  const p=date.split('-'); planState.cur={y:+p[0],m:+p[1]-1,d:+p[2]}; if(planState.calView==='year') planState.calView='month';
  document.getElementById('calEvtModal').style.display='none'; await loadPlan(); paintPlan();
};
window.planDelEvent=async(id)=>{ const res=await sb.from('calendar_events').delete().eq('id',id).select(); if(res.error){ alert('Delete failed — '+res.error.message); return; } const m=document.getElementById('calEvtModal'); if(m) m.style.display='none'; await loadPlan(); paintPlan(); };

  if(!name){ document.getElementById('phName').focus(); return; }
  const start=document.getElementById('phStart').value, end=document.getElementById('phEnd').value;

};

window.planAddTrack=(grp)=>{

/* ---- Set/Rep scheme BUILDER (+ New scheme) ---- */
const SCHEME_MVS=['Squat','Snatch','Clean & Jerk','Pull','Press'];
const SCHEME_PHASES=['Comprehension','Ascension','Summit','Realization'];
const SCHB_FOOT=[['vol','Volume (NL)'],['ari','Rel. Int.'],['inol','INOL'],['peak','Peak']];
let schBuild=null;
function schbBlank(){ const d={name:'',mv:'Squat',ph:'Ascension',grid:[]}; for(let s=0;s<4;s++){ const row=[]; for(let w=0;w<3;w++) row.push({r:'3',l:String(70+w*5)}); d.grid.push(row); } return d; }
function schbMetrics(grid,w){ const rows=grid.map(set=>{ const c=set[w]||{}; const r=parseFloat(c.r)||0; const p=(c.l!==''&&c.l!=null&&!isNaN(parseFloat(c.l)))?parseFloat(c.l):null; return {s:1, r, p}; }); return wkMetrics(rows); }
function schbFmt(key,m){ if(key==='vol') return m.vol||0; if(key==='ari') return (m.ari?m.ari.toFixed(1):'0')+'%'; if(key==='inol') return (m.inol?m.inol.toFixed(2):'0.00'); if(key==='peak') return (m.peak||0)+'%'; return ''; }
function schbRenderGrid(){
  if(!schBuild) return;
  const g=schBuild.grid, nw=g[0]?g[0].length:0, ns=g.length;
  let h='<table class="sb-grid"><thead><tr><th class="setlbl">Set</th>';
  for(let w=0;w<nw;w++) h+=`<th>WK ${w+1}${nw>1?`<span class="wkx" onclick="schbRmWeek(${w})" title="Remove week">✕</span>`:''}</th>`;
  h+='</tr></thead><tbody>';
  for(let s=0;s<ns;s++){
    h+=`<tr><td class="setlbl">Set ${s+1}${ns>1?`<span class="setx" onclick="schbRmSet(${s})" title="Remove set">✕</span>`:''}</td>`;
    for(let w=0;w<nw;w++){ const c=g[s][w]||{r:'',l:''};
      h+=`<td class="cell"><input class="sbcell" inputmode="numeric" value="${esc(c.r)}" placeholder="reps" oninput="schbCell(${s},${w},'r',this.value)">×<input class="sbcell ld" inputmode="numeric" value="${esc(c.l)}" placeholder="%" oninput="schbCell(${s},${w},'l',this.value)">%</td>`;
    }
    h+='</tr>';
  }
  const mets=[]; for(let w=0;w<nw;w++) mets.push(schbMetrics(g,w));
  SCHB_FOOT.forEach(f=>{ h+=`<tr class="foot"><td class="setlbl">${f[1]}</td>`;
    for(let w=0;w<nw;w++) h+=`<td data-foot="${f[0]}" data-fw="${w}"><span class="fl">${f[1]}</span>${schbFmt(f[0],mets[w])}</td>`;
    h+='</tr>'; });

function statsFor(sessRows, logs){
  let vol=0, vw=0, pv=0, peak=0, totalSets=0;
  (sessRows||[]).forEach(s=>(s.prescribed_exercises||[]).forEach(ex=>(ex.prescribed_sets||[]).forEach(ps=>{
    const r=ps.target_reps||0, p=ps.target_pct!=null?parseFloat(ps.target_pct):0;
    vol+=r; totalSets++; if(p&&r){ vw+=p*r; pv+=r; if(p>peak)peak=p; }
  })));
  let miss=0, done=0, added=0;
  (logs||[]).forEach(l=>{ miss+=(l.miss||0); if(l.done) done++; if(!l.prescribed_set_id) added++; });
  return { vol, ari: pv?vw/pv:0, peak, miss, done, total: totalSets+added, sessions:(sessRows||[]).length };
}

function ormLookup(name, maxes){
  if(!maxes) return null;

  const rules=[[/power\s*snatch/,'Power Snatch'],[/power\s*clean/,'Power Clean'],
    [/snatch.*(dl|pull|deadlift)/,'Snatch DL'],[/clean.*(dl|pull|deadlift)/,'Clean DL'],
    [/clean\s*(&|and|\+)\s*jerk/,'Clean & Jerk'],
    [/hang\s*snatch|block\s*snatch|snatch\s*balance/,'Snatch'],[/hang\s*clean|block\s*clean/,'Clean'],
    [/front\s*squat/,'Front Squat'],[/squat/,'Back Squat'],
    [/push\s*press|strict\s*press/,'Push Press'],[/jerk/,'Jerk'],[/snatch/,'Snatch'],[/clean/,'Clean']];
  for(const r of rules){ if(r[0].test(n) && maxes[r[1]]!=null) return maxes[r[1]]; }

async function cvCopyWeek(){

  if(!sessions.length){ if(msg){msg.style.color='var(--warn)';msg.textContent='nothing to copy';} return; }

async function cloneSessionTo(full, targetDate){
  const { data: ns, error: se } = await sb.from('sessions').insert({
    gym_id: me_.gym_id, athlete_id: coachState.selected, session_date: targetDate,
    title: full.title||'Training', status:'draft' }).select().single();
  if(se) throw se;
  const exs=(full.prescribed_exercises||[]).slice().sort(sortByPos);
  for(let ei=0; ei<exs.length; ei++){
    const ex=exs[ei];
    const cIns={ gym_id: me_.gym_id, session_id: ns.id, position: ei, name: ex.name,
      category: ex.category||'primary', coach_note: ex.coach_note||null };
    if(LT_READY){ cIns.load_type=ex.load_type||'percentage'; cIns.cues=ex.cues||null; }
    const { data: ne, error: ee } = await sb.from('prescribed_exercises').insert(cIns).select().single();
    if(ee) throw ee;
    const rows=(ex.prescribed_sets||[]).slice().sort(sortByPos).map((ps,si)=>{ const row={
      gym_id: me_.gym_id, exercise_id: ne.id, position: si,
      target_reps: ps.target_reps, target_pct: ps.target_pct, target_kg: ps.target_kg, target_text: ps.target_text };
      if(LT_READY){ row.target_vel=ps.target_vel!=null?ps.target_vel:null; row.target_eff=ps.target_eff!=null?ps.target_eff:null; }
      return row; });
    if(rows.length){ const { error: re } = await sb.from('prescribed_sets').insert(rows); if(re) throw re; }
  }
  return ns;
}
function exTiles(ex){
  let vol=0,ton=0,vw=0,pv=0,peak=0,inol=0;
  ex.sets.forEach(st=>{ const r=parseInt(st.reps)||0,k=parseFloat(st.kg)||0,p=parseFloat(st.pct)||0;
    vol+=r; ton+=r*k; if(p&&r){ vw+=p*r; pv+=r; if(p>peak)peak=p; if(p<100) inol+=r/(100-p); } });
  const avg=vol?ton/vol:0, ari=pv?vw/pv:0;
  const ids=new Set(ex.sets.map(s=>s.id).filter(Boolean));
  let miss=0, lit=0, legal=0;
  (ed?ed.logs:[]).forEach(l=>{ const mine=(l.prescribed_set_id&&ids.has(l.prescribed_set_id))||(!l.prescribed_set_id&&l.exercise_id===ex.id);
    if(!mine) return; miss+=(l.miss||0); if(l.lights!=null){ lit++; if(l.lights>=2) legal++; } });
  const legalPct=lit?Math.round(legal/lit*100):null;
  const t=(v,l,col)=>`<span class="cv-tile"><b${col?` style="color:${col}"`:''}>${v}</b>${l}</span>`;
  return `<div class="cv-tiles">${t(vol||'—','volume')}${t(avg?avg.toFixed(1):'—','avg int (kg)')}${t(ari?ari.toFixed(1)+'%':'—','ARI')}${t('—','RI (effort)')}${t(inol?inol.toFixed(2):'—','INOL')}${t(peak?peak+'%':'—','peak %')}${t(String(miss),'misses',miss?'var(--bad)':null)}${t(legalPct!=null?legalPct+'%':'—','comp-legal',legalPct!=null?(legalPct>=90?'var(--good)':'var(--warn)'):null)}</div>`;
}
function sessionTiles(){
  if(!ed) return '';
  let vol=0,vw=0,pv=0;
  ed.exercises.forEach(ex=>ex.sets.forEach(st=>{ const r=parseInt(st.reps)||0,p=parseFloat(st.pct)||0;
    vol+=r; if(p&&r){ vw+=p*r; pv+=r; } }));
  const ari=pv?vw/pv:0;
  let miss=0; ed.logs.forEach(l=>{ miss+=(l.miss||0); });
  return `<span><label>vol</label><b>${vol||'—'}</b></span><span><label>ari</label><b>${ari?ari.toFixed(1)+'%':'—'}</b></span><span><label>misses</label><b${miss?' style="color:var(--bad)"':''}>${miss}</b></span>`;
}

function actCols(type){ return type==='vbt'?5:4; }
function actualCells(lg, type){
  const vbt = type==='vbt';
  if(!lg || (lg.actual_reps==null && lg.actual_kg==null && lg.velocity==null && !lg.done))
    return `<td class="cva nolog" colspan="${actCols(type)}"><span class="cv-nolog">not logged</span></td>`;

    +`<td class="cva ca-n">${lg.actual_kg!=null?lg.actual_kg:'–'}</td>`;

    +`<td class="cva ca-le"><span class="cv-le">${le.join('')||'<span class="cv-nolog">–</span>'}</span></td>`;

// compact actuals for a collapsed multi-set row (Sets × N)
function actualsSummary(logs, type){
  const vbt = type==='vbt';
  const real=(logs||[]).filter(l=>l && (l.actual_reps!=null||l.actual_kg!=null||l.velocity!=null||l.done));
  if(!real.length) return `<td class="cva nolog summ" colspan="${actCols(type)}"><span class="cv-nolog">not logged</span></td>`;
  const list=(arr,suf)=>{ const v=arr.filter(x=>x!=null); if(!v.length) return '–'; const all=v.every(x=>x===v[0]); return (all?`${v[0]}×${v.length}`:v.join('·'))+(suf||''); };
  const reps=list(real.map(l=>l.actual_reps));
  const kg=list(real.map(l=>l.actual_kg));
  const miss=real.reduce((a,l)=>a+(l.miss||0),0);
  const done=real.filter(l=>l.done).length;
  const clips=real.filter(l=>l.video_path).map(l=>`<span class="vidlink" onclick="playVideo('${esc(l.video_path)}')">▶</span>`).join('');
  let cells=`<td class="cva summ"><b>${reps}</b></td><td class="cva summ"><b>${kg}</b></td>`;
  if(vbt){ cells+=`<td class="cva summ vbt-pk"><b>${list(real.map(l=>l.velocity))}</b></td>`; }
  cells+=`<td class="cva summ">${miss?`<span style="color:var(--bad)">${miss}</span>`:'0'}</td>`
    +`<td class="cva summ">${done}/${real.length}✓ ${clips}</td>`;
  return cells;
}

function sameSetVals(a,b){ const k=v=>(v==null?'':String(v)); return k(a.reps)===k(b.reps) && k(a.pct)===k(b.pct) && k(a.kg)===k(b.kg) && k(a.vel)===k(b.vel) && k(a.eff)===k(b.eff); }

async function renderRollup(){

  const needFetch = !cw.rollupCache || (cw.block && !cw.rollupCache.block) || !cw.rollupCache.all;
  if(needFetch && !host.querySelector('table.ru')){
    host.innerHTML=`<div class="card"><h2 style="margin:0 0 4px">Metric rollup</h2><div class="sub" style="margin-bottom:8px">This session, then up the hierarchy.</div><div class="spin" style="padding:12px">computing…</div></div>`;
  }
  try{
    if(!cw.rollupCache) cw.rollupCache={};
    if(cw.block && !cw.rollupCache.block){
      const { data: bs } = await sb.from('sessions')
        .select('id,session_date,prescribed_exercises(prescribed_sets(target_reps,target_pct))')
        .eq('athlete_id', cw.athId).gte('session_date', cw.block.start_date).lte('session_date', cw.block.end_date);
      const bids=(bs||[]).map(x=>x.id);
      let blogs=[];
      if(bids.length){ const { data: bl } = await sb.from('logged_sets').select('miss,done,session_id,prescribed_set_id').in('session_id', bids); blogs=bl||[]; }
      cw.rollupCache.block={ rows:bs||[], logs:blogs };
    }
    if(!cw.rollupCache.all){
      const { data: as_ } = await sb.from('sessions')
        .select('id,session_date,prescribed_exercises(prescribed_sets(target_reps,target_pct))')
        .eq('athlete_id', cw.athId);
      const aids=(as_||[]).map(x=>x.id);
      let alogs=[];
      if(aids.length){ const { data: al } = await sb.from('logged_sets').select('miss,done,session_id,prescribed_set_id').in('session_id', aids); alogs=al||[]; }
      cw.rollupCache.all={ rows:as_||[], logs:alogs };
    }
  }catch(e){ if(!cw.rollupCache) cw.rollupCache={}; /* blocks table may be missing */ }
  paintRollup();
}

function wireEditor(){
  const card=document.getElementById('edCard'); if(!card) return;
  card.addEventListener('focusin', e=>{ const n=e.target.closest('.cvx-name'); if(n){ const cvx=n.closest('.cvx'); showExDrop(n, +cvx.dataset.ei); } });
  card.addEventListener('keydown', e=>{
    if(!e.target.closest('.cvx-name')) return;
    const drop=document.getElementById('exDrop'); if(!drop||drop.style.display==='none') return;
    const items=drop.querySelectorAll('.ex-item'); if(!items.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); exDropIdx=Math.min(items.length-1, exDropIdx+1); renderExDrop(); drop.querySelector('.ex-item.on')&&drop.querySelector('.ex-item.on').scrollIntoView({block:'nearest'}); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); exDropIdx=Math.max(0, exDropIdx-1); renderExDrop(); drop.querySelector('.ex-item.on')&&drop.querySelector('.ex-item.on').scrollIntoView({block:'nearest'}); }
    else if(e.key==='Enter' && exDropIdx>=0 && items[exDropIdx]){ e.preventDefault(); pickEx(items[exDropIdx].dataset.name); }
    else if(e.key==='Escape'){ hideExDrop(); }
  });
  card.addEventListener('input', e=>{
    const t=e.target;
    if(t.id==='edTitle'){ ed.session.title=t.value; ed.dirty=true; return; }
    const cvx=t.closest('.cvx'); if(!cvx) return;
    const ex=ed.exercises[+cvx.dataset.ei]; if(!ex) return;
    if(t.dataset.f==='name'){ ex.name=t.value; ed.dirty=true;
      const orm=oneRMFor(ex.name);
      cvx.querySelector('.cvx-orm').innerHTML = (orm&&(ex.loadType||'percentage')==='percentage')?`1RM <b>${orm}</b> · from maxes`:((ex.loadType||'percentage')==='percentage'&&cw.maxes?'<span class="cv-nolog">no 1RM link</span>':'');
      if((ex.loadType||'percentage')==='percentage') cvx.querySelectorAll('[data-f="tgt"]').forEach(p=>{ p.disabled=!orm; });
      showExDrop(t, +cvx.dataset.ei);
      return; }
    if(t.dataset.f==='note'){ ex.note=t.value; ed.dirty=true; return; }
    if(t.dataset.f==='count') return; // handled on 'change' (structural)
    const tr=t.closest('tr[data-si]'); if(!tr) return;
    const si=+tr.dataset.si, cnt=+(tr.dataset.count||1);
    const groupSets=ex.sets.slice(si, si+cnt); if(!groupSets.length) return;
    const type=ex.loadType||'percentage';
    const orm=oneRMFor(ex.name);
    if(t.dataset.f==='reps'){ groupSets.forEach(st=>st.reps=t.value); }
    if(t.dataset.f==='tgt'){
      if(type==='percentage'){ const kg=(orm && t.value!=='')?rnd1(orm*parseFloat(t.value)/100):null;
        groupSets.forEach(st=>{ st.pct=t.value; if(kg!=null) st.kg=kg; });
        if(kg!=null){ const k=tr.querySelector('[data-f="kg"]'); if(k) k.value=kg; } }
      else if(type==='vbt'){ groupSets.forEach(st=>st.vel=t.value); }
      else if(type==='rpe'||type==='rir'){ groupSets.forEach(st=>st.eff=t.value); }
    }
    if(t.dataset.f==='kg'){ groupSets.forEach(st=>st.kg=t.value);
      if(type==='percentage' && orm && t.value!==''){ const pct=rnd1(parseFloat(t.value)/orm*100); groupSets.forEach(st=>st.pct=pct); const pi=tr.querySelector('[data-f="tgt"]'); if(pi) pi.value=pct; } }
    ed.dirty=true;
    const tiles=cvx.querySelector('.cv-tiles'); if(tiles) tiles.outerHTML=exTiles(ex);
    const st2=document.getElementById('edTiles'); if(st2) st2.innerHTML=sessionTiles();
    paintRollup();
  });
  card.addEventListener('change', e=>{
    const t=e.target;
    if(t.dataset && t.dataset.f==='count'){
      const cvx=t.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei]; if(!ex) return;
      const tr=t.closest('tr[data-si]'); const si=+tr.dataset.si, cur=+(tr.dataset.count||1);
      let want=Math.max(1, Math.min(50, parseInt(t.value,10)||1));
      if(want===cur){ paintEditor(); return; }
      const tmpl=ex.sets[si];
      if(want>cur){ const add=want-cur; const at=si+cur;
        for(let k=0;k<add;k++) ex.sets.splice(at+k, 0, {id:null, reps:tmpl.reps, pct:tmpl.pct, kg:tmpl.kg, vel:tmpl.vel, eff:tmpl.eff}); }
      else { const drop=cur-want;
        for(let k=0;k<drop;k++){ const idx=si+cur-1-k; const st=ex.sets[idx]; if(st&&st.id) ex.delSets.push(st.id); }
        ex.sets.splice(si+want, drop); }
      ed.dirty=true; paintEditor();
      const st2=document.getElementById('edTiles'); if(st2) st2.innerHTML=sessionTiles(); paintRollup();
      return;
    }
    const sel=t.closest('.lt-sel'); if(!sel) return;
    const cvx=sel.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei]; if(!ex) return;
    ex.loadType=sel.value; ed.dirty=true; paintEditor();
  });
  card.addEventListener('click', e=>{
    const add=e.target.closest('[data-addrow]');
    if(add){ const cvx=add.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei];
      ex.sets.push({id:null, reps:'', pct:'', kg:'', vel:'', eff:''}); ed.dirty=true; paintEditor(); return; }
    const rm=e.target.closest('[data-rmrow]');
    if(rm){ const tr=rm.closest('tr'); const cvx=rm.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei];
      const si=+tr.dataset.si, cnt=+(tr.dataset.count||1);
      for(let k=0;k<cnt;k++){ const st=ex.sets[si+k]; if(st && st.id) ex.delSets.push(st.id); }
      ex.sets.splice(si, cnt); ed.dirty=true; paintEditor(); return; }
    const cu=e.target.closest('.cue-x');
    if(cu){ const cvx=cu.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei];
      ex.cues.splice(+cu.dataset.ci,1); ed.dirty=true; paintEditor(); return; }
    const ca=e.target.closest('[data-cue]');
    if(ca){ const cvx=ca.closest('.cvx'); openCueModal(+cvx.dataset.ei); return; }
    const sc=e.target.closest('[data-scheme]');
    if(sc){ const cvx=sc.closest('.cvx'); openSchemeModal(+cvx.dataset.ei); return; }
    const dx=e.target.closest('[data-delex]');
    if(dx){ if(!dx.classList.contains('arm')){ dx.classList.add('arm'); dx.textContent='remove?';
        setTimeout(()=>{ if(dx.isConnected){ dx.classList.remove('arm'); dx.textContent='✕ remove'; } },3500); return; }
      const cvx=dx.closest('.cvx'); const ei=+cvx.dataset.ei; const ex=ed.exercises[ei];
      if(ex.id) ed.delExs.push(ex.id);
      ed.exercises.splice(ei,1); ed.dirty=true; paintEditor(); return; }
    if(e.target.id==='edAddEx' || e.target.closest('#edAddEx')){
      ed.exercises.push({id:null,name:'',note:'',category:'primary',loadType:'percentage',cues:[],sets:[{id:null,reps:'',pct:'',kg:'',vel:'',eff:''}],delSets:[]});
      ed.dirty=true; paintEditor(); return; }
    if(e.target.id==='edSave'){ saveEditor(false); return; }
    if(e.target.id==='edPublish' || e.target.id==='edPublish2'){ saveEditor(true); return; }
    if(e.target.id==='edUnpublish'){ saveEditor('draft'); return; }
    if(e.target.id==='edCopyOpen'){ const ui=document.getElementById('edCopyUI'); ui.style.display = ui.style.display==='none'?'inline-flex':'none'; return; }
    if(e.target.id==='edCopyGo'){ cvCopyDay(document.getElementById('edCopyDate').value); return; }
    const ds=e.target.closest('#edDelSess');
    if(ds){ if(!ds.classList.contains('arm')){ ds.classList.add('arm'); ds.textContent='delete session?';
        setTimeout(()=>{ if(ds.isConnected){ ds.classList.remove('arm'); ds.textContent='✕ session'; } },3500); return; }
      deleteSession(); return; }
  });
}

function schemeExpand(n,reps,shape,top,rampFrom,amp){
  const out=[];
  for(let i=0;i<n;i++){
    let v=top;
    if(shape==='ramp' && n>1) v=top-rampFrom + rampFrom*(i/(n-1));
    if(shape==='wave') v=(i%2===0)?top-amp:top;
    out.push({reps:reps, val:Math.round(v*100)/100});
  }
  return out;
}

function schemeRowsToSets(weekRows, exName){
  const anyPct=weekRows.some(r=>r.p!=null);

  const sets=[];
  weekRows.forEach(r=>{ for(let i=0;i<(r.s||1);i++){
    sets.push({id:null, reps:r.r!=null?r.r:'', pct:r.p!=null?r.p:'', kg:(r.p!=null&&orm)?rnd1(orm*r.p/100):'', vel:'', eff:''});
  }});

}
