<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoCal WLC</title>
<style>
  :root{--bg:#0c1116;--panel:#141c24;--panel2:#1a232c;--line:#26323d;--text:#e7edf3;--muted:#8b9aa8;
        --accent:#e8643c;--accent2:#3c9ee8;--good:#3ec97a;--warn:#e8b13c;--bad:#e85c5c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:760px;margin:0 auto;padding:18px 16px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .brand{font-weight:800;letter-spacing:.3px}.brand .o{color:var(--accent)}
  .who{font-size:12px;color:var(--muted);text-align:right}
  .who b{color:var(--text)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer}
  .btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.blue{background:var(--accent2)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
  .sub{color:var(--muted);font-size:13px}
  /* login */
  .login{max-width:380px;margin:8vh auto 0}
  .login .card{padding:24px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:12px 0 5px}
  input{width:100%;background:#0e151c;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--text);font-size:15px}
  input:focus{outline:none;border-color:var(--accent2)}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px}
  .hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
  /* session */
  .pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:11px;background:var(--panel2);color:var(--accent2)}
  .exh{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
  .exh .nm{font-weight:800;font-size:15px}
  .note{font-size:12.5px;color:var(--muted);font-style:italic;background:var(--panel2);border-left:2px solid var(--accent2);border-radius:0 8px 8px 0;padding:8px 11px;margin:6px 0 10px}
  table{width:100%;border-collapse:collapse}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;text-align:left;padding:6px 8px}
  td{padding:6px 8px;border-top:1px solid var(--line)}
  .tgt{color:var(--muted);font-size:13px}
  td input.cell{width:62px;padding:8px;text-align:center;font-weight:700}
  .chk{width:22px;height:22px;accent-color:var(--good)}
  .savebar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(12,17,22,0),var(--bg) 36%);padding:14px 0 4px;margin-top:8px;display:flex;gap:10px;align-items:center}
  .saved{color:var(--good);font-size:13px;font-weight:700}
  /* coach */
  .athrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
  .athrow.on{border-color:var(--accent)}
  .athrow .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .pa{display:flex;gap:8px;font-size:13px}
  .pa .p{color:var(--muted)}.pa .a{font-weight:800}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--good)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .delta-pos{color:var(--good)}.delta-neg{color:var(--bad)}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .spin{color:var(--muted);padding:30px;text-align:center}
  /* coach session builder */
  .b-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .b-ex{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
  .b-ex .b-name{width:100%;font-weight:700;font-size:15px;margin-bottom:6px}
  .b-ex .b-note{width:100%;font-size:13px;margin-bottom:8px}
  .b-set{display:flex;gap:8px;align-items:center;margin:5px 0}
  .b-set .lbl{flex:0 0 42px;color:var(--muted);font-size:12px;font-weight:700}
  .b-set input{width:74px;text-align:center;padding:8px}
  .b-x{color:var(--muted);cursor:pointer;font-size:13px;padding:2px 7px;user-select:none}
  .b-x:hover{color:var(--bad)}
  .b-add{display:inline-block;font-size:13px;font-weight:700;color:var(--accent2);cursor:pointer;margin-top:4px;user-select:none}
  .b-add:hover{text-decoration:underline}
  /* athlete logging table (mockup look) */
  .pill.phase{background:#2a3a2c;color:var(--good)}
  .pill.primary{background:#2a3340;color:var(--accent2)}
  .pill.accessory{background:#332d22;color:var(--warn)}
  .ex{border:1px solid var(--line);border-radius:11px;margin-bottom:14px;overflow:hidden}
  .av-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border-bottom:1px solid var(--line);padding:12px 14px}
  .av-head .name{font-weight:800;font-size:15px}
  .av-head .tag{margin-left:auto;font-size:11px;color:var(--muted)}
  .logwrap{overflow-x:auto}
  .logtable{width:100%;border-collapse:collapse;min-width:560px}
  .logtable th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:9px 6px;text-align:center}
  .logtable td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);font-size:13px}
  .logtable td:nth-child(2),.logtable th:nth-child(2){text-align:left}
  .logtable input{width:52px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);text-align:center;padding:7px 4px;font-size:13px;font-weight:700}
  .logtable input.mini{width:44px}
  .logtable input:focus{outline:none;border-color:var(--accent2)}
  .logtable .tgt{color:var(--accent2);font-weight:700;font-size:12px}
  .logtable .chk{width:20px;height:20px;accent-color:var(--good)}
  .lights{display:inline-flex;gap:3px;vertical-align:middle}
  .lights i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  .lights i.w{background:#eef3f8}.lights i.r{background:var(--bad)}
  .lights.sm i{width:9px;height:9px}
  .lg-lts{cursor:pointer;padding:4px 5px;border-radius:6px;gap:4px}
  .lg-lts:hover{background:#16202b}.lg-lts i{width:14px;height:14px}
  .lg-eff{display:inline-flex;gap:3px}
  .lg-light{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:#0e151c;color:var(--muted);opacity:.6}
  .lg-light:hover{opacity:1}
  .lg-light.on{opacity:1;color:#06121d}
  .lg-light.easy.on{background:var(--good);border-color:var(--good)}
  .lg-light.moderate.on{background:var(--accent2);border-color:var(--accent2)}
  .lg-light.hard.on{background:var(--warn);border-color:var(--warn)}
  .lg-light.max.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .upvid{display:inline-flex;align-items:center;gap:4px;background:#2a2340;border:1px dashed #3d3460;color:#b9a8ff;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
  .upvid.on{background:#1d3a2a;border-color:#2f6b48;color:#7fdca8;border-style:solid}
  .upvid.up{background:#33302a;border-color:#5a4419;color:var(--warn);border-style:solid;cursor:default}
  .vidcell{white-space:nowrap}
  .vidrm{color:var(--muted);cursor:pointer;font-weight:700;margin-left:6px;font-size:12px}
  .vidrm:hover{color:var(--bad)}
  .vidrm.arm{color:var(--bad);font-size:11px;font-weight:800}
  .vidlink{color:#7fdca8;cursor:pointer;font-weight:700;white-space:nowrap}
  .vidlink:hover{text-decoration:underline}
  .vid-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;align-items:center;justify-content:center;padding:24px}
  .vid-box{position:relative;max-width:540px;width:100%;background:#0c1116;border:1px solid var(--line);border-radius:12px;padding:14px}
  .vid-x{position:absolute;top:-12px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
  .lg-add{display:inline-block;margin:9px 14px;color:var(--accent2);font-weight:700;font-size:12px;cursor:pointer;user-select:none}
  .lg-add:hover{color:#7bc0f5}
  .lg-del{color:var(--muted);cursor:pointer;font-weight:700;opacity:.45;padding:0 4px}
  .lg-del:hover{color:var(--bad);opacity:1}
  .addedtag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--warn);background:rgba(232,177,60,.13);border-radius:9px;padding:2px 8px}
  .av-note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:#1c2530;border-top:1px solid var(--line);font-size:12.5px}
  .av-note .tag{color:var(--accent2);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.5px;white-space:nowrap;padding-top:2px}
  /* morning readiness check-in */
  .rk-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .rk-score{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
  .rk-num{font-size:26px;font-weight:800;color:var(--text)}
  .rk-num.good{color:var(--good)}.rk-num.warn{color:var(--warn)}.rk-num.bad{color:var(--bad)}
  .rk-meta{font-size:10px;color:var(--muted);line-height:1.3;text-transform:uppercase;letter-spacing:.4px}
  .rk-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .rk-row:last-of-type{border-bottom:none}
  .rk-lbl{flex:0 0 130px;font-size:14px;font-weight:600;color:var(--text)}
  .rk-hint{display:block;font-size:10px;color:var(--muted);font-weight:400}
  .rk-scale{display:flex;gap:6px;flex-wrap:wrap}
  .rk-dot{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#0e151c;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s}
  .rk-dot:hover{border-color:var(--accent2)}
  .rk-dot.on{background:var(--accent2);border-color:var(--accent2);color:#06121d}
  .rk-foot{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-top:14px}
  .rk-bw label,.rk-note label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
  .rk-bwrow{display:flex;align-items:center;gap:7px}
  .rk-bw input{background:#0e151c;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:15px;font-weight:700;width:96px}
  .rk-bw input:focus,.rk-note textarea:focus{outline:none;border-color:var(--accent2)}
  .rk-unit{color:var(--muted);font-size:13px;font-weight:600}
  .rk-note{flex:1;min-width:220px}
  .rk-note textarea{width:100%;background:#0e151c;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;min-height:48px;resize:vertical;font-family:inherit}
  /* coach view of a check-in */
  .rkc-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rkc-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .rkc-chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12px}
  .rkc-chip .rkc-l{color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .rkc-chip b{font-size:14px}
  .rkc-note{margin-top:10px;font-size:13px;font-style:italic;color:var(--text);background:var(--panel2);border-left:2px solid var(--accent2);border-radius:0 8px 8px 0;padding:8px 12px}
  .rk-scale{flex-wrap:nowrap}
  @media(max-width:560px){
    .rk-row{flex-direction:column;align-items:stretch;gap:8px;padding:11px 0}
    .rk-lbl{flex:none}
    .rk-scale{width:100%;gap:7px}
    .rk-dot{flex:1;width:auto;height:42px;font-size:14px}
  }
  .rk-donebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
  .rk-donebar .ok{color:var(--good);font-weight:700}
  .rk-edit{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent2)}
  /* week day-strip */
  .av-weekcard{padding:14px 16px}
  .av-weekhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:11px}
  .av-weeklbl{font-size:13px;color:var(--muted)}
  .av-weeklbl b{color:var(--text)}
  .av-weekprog{font-size:12px;font-weight:700;color:var(--accent2)}
  .av-daystrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
  .av-day{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 5px 8px;cursor:pointer;transition:border-color .12s}
  .av-day:hover{border-color:var(--accent2)}
  .av-day.on{border-color:var(--accent);background:rgba(232,100,60,.08)}
  .av-day.rest{opacity:.62;cursor:default}
  .av-day.rest:hover{border-color:var(--line)}
  .av-day-dow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .av-day.on .av-day-dow{color:var(--accent)}
  .av-day-d{font-size:17px;font-weight:800;line-height:1.1}
  .av-day-type{font-size:10px;color:var(--muted);max-width:66px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .av-day-dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .av-day-dot.done{background:var(--good)}
  .av-day-dot.today{background:var(--accent)}
  .av-day-dot.up{background:var(--accent2)}
  .av-day-dot.rest{background:#3a4754}
  .av-day-dot.draft{background:var(--warn)}
  .pv-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap;align-items:center}
  .pv-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  /* mockup-feel editor: banners, cues, scheme, hdstats */
  .cvt .bandrow th{font-size:10px;letter-spacing:.8px;padding:8px 6px}
  .cvt .bandrow th.plh{color:var(--accent2)}
  .cvt .bandrow th.ach{color:var(--accent)}
  .cv-hdstats{display:inline-flex;gap:16px;margin-left:auto;align-items:center}
  .cv-hdstats span{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.2}
  .cv-hdstats label{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800}
  .cv-hdstats b{font-size:16px}
  .lt-wrap{display:inline-flex;align-items:center;gap:7px}
  .lt-wrap label{font-size:11px;color:var(--muted);font-weight:600}
  .scheme-btn{font-size:12px;font-weight:700;color:var(--good);border:1px dashed rgba(62,201,122,.5);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  .scheme-btn:hover{background:rgba(62,201,122,.08)}
  .rm-ex{font-size:12px;font-weight:700;color:var(--bad);background:rgba(232,92,92,.08);border:1px solid rgba(232,92,92,.3);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  .rm-ex.arm{background:var(--bad);color:#fff}
  .addrow{margin:2px 13px 4px;padding:7px 10px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .addrow:hover{border-color:var(--good);color:var(--text)}
  .addrow .plus{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;background:#16261c;color:var(--good);border:1px solid #2f5a3f;font-weight:800;font-size:13px}
  .cue-row{display:flex;gap:10px;align-items:flex-start;margin:8px 13px 0}
  .cuelbl{color:var(--accent2);font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.5px;line-height:1.3;padding-top:4px;white-space:nowrap}
  .cues{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
  .cuechip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11.5px;color:var(--muted)}
  .cuechip b{color:var(--text)}
  .cuechip .cue-x{cursor:pointer;color:var(--muted);font-style:normal;font-weight:700}
  .cuechip .cue-x:hover{color:var(--bad)}
  .cue-add{font-size:11.5px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
  .cue-add:hover{color:var(--accent2);border-color:var(--accent2)}
  .ov-box{max-width:640px}
  .ov-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .ov-hd .vid-x{position:static}
  .cue-cats{display:flex;gap:7px;flex-wrap:wrap}
  .cue-cat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-weight:700;font-size:13px;padding:8px 14px;cursor:pointer}
  .cue-cat.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .cue-vals{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .cue-val{background:#0e151c;border:1px solid var(--line);border-radius:9px;color:var(--text);font-weight:700;font-size:13px;padding:9px 14px;cursor:pointer}
  .cue-val:hover{border-color:var(--accent)}
  .cue-val.add{border-style:dashed;color:var(--muted)}
  .cue-custom{display:inline-flex;gap:6px;align-items:center}
  .cue-custom input{background:#0e151c;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--text);font-size:13px;width:120px}
  .sch-preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px}
  .sch-prev{font-size:12px;font-weight:700;color:var(--accent2);background:#0e151c;border:1px solid var(--line);border-radius:7px;padding:5px 9px}
  .bf-wk input{background:#0e151c;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--text);font-size:13px;font-weight:700;width:74px;text-align:center}
  /* block banner + wave + block form */
  .cw-block{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .cw-block.none{background:transparent;border-style:dashed}
  .bw-bars{display:inline-flex;align-items:flex-end;gap:3px;height:22px;margin:0 2px}
  .bw-bars .bw{display:inline-block;width:9px;border-radius:2px 2px 0 0;opacity:.45}
  .bw-bars .bw.cur{opacity:1;outline:1px solid rgba(255,255,255,.5)}
  .bw-now{font-size:11px;color:var(--text);font-weight:700}
  .bf{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px}
  .bf-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
  .bf-row:last-child{margin-bottom:0}
  .bf-row input{background:#0e151c;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-weight:600}
  .bf-row input:focus{outline:none;border-color:var(--accent2)}
  .bf-wk{display:inline-flex;flex-direction:column;gap:3px}
  .bf-wk label{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800}
  /* session tabs (AM/PM) + block banner + rollup */
  .cw-stabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}

<body>
<div id="app"><div class="spin">Loading…</div></div>
<input type="file" id="vidInput" accept="video/*" onchange="onVidPicked()" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = "https://jurlbzobhdkijyvijjfg.supabase.co";
const SUPA_KEY = "sb_publishable_3DfhkND-7yxN3yziwJ7Qhg_SuZr8eAB";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const app = document.getElementById('app');
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => (n||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();

let me_ = null;        // current profile
let coachChan = null;  // realtime channel
let leavingOnPurpose = false; // set by logout() so the auth listener doesn't double-fire

/* ---------------- boot ---------------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(error || !profile){ await sb.auth.signOut(); renderLogin('Could not load your profile.'); return; }
  me_ = profile;
  await probeLoadTypes();
  if(profile.role === 'coach') renderCoach(); else renderAthlete();
}
// if the login expires or dies mid-use, say so plainly instead of showing empty screens
sb.auth.onAuthStateChange((event)=>{
  if(event==='SIGNED_OUT' && me_ && !leavingOnPurpose){
    me_=null; if(coachChan){ sb.removeChannel(coachChan); coachChan=null; }
    renderLogin('Your session expired — please sign in again.');
  }
});
// guard before any data render: a live login must exist
async function requireSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ me_=null; renderLogin('Your session expired — please sign in again.'); return null; }
  return session;
}

/* ---------------- login ---------------- */
function renderLogin(msg){
  app.innerHTML = `
    <div class="login">
      <div class="topbar"><div class="brand">SoCal <span class="o">WLC</span></div></div>
      <div class="card">
        <h1>Sign in</h1>
        <div class="sub">Coach or athlete — same login.</div>
        <label>Email</label><input id="email" type="email" autocomplete="username" placeholder="you@socalwlc.test">
        <label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
        <div style="margin-top:16px"><button class="btn" id="go" style="width:100%">Sign in</button></div>
        <div class="err" id="err">${esc(msg||'')}</div>
        <div class="hint">Test logins · coach@socalwlc.test · georgia@socalwlc.test</div>
      </div>
    </div>`;
  const go = document.getElementById('go');
  const doLogin = async () => {
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('err');
    err.textContent=''; go.disabled=true; go.textContent='Signing in…';
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if(error){ err.textContent = error.message; go.disabled=false; go.textContent='Sign in'; return; }
    boot();
  };
  go.onclick = doLogin;
  document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function logout(){ leavingOnPurpose=true; if(coachChan){ sb.removeChannel(coachChan); coachChan=null; } await sb.auth.signOut(); me_=null; leavingOnPurpose=false; renderLogin(); }

function topbar(roleLabel){
  return `<div class="topbar">
    <div class="brand">SoCal <span class="o">WLC</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="who"><b>${esc(me_.full_name)}</b><br>${roleLabel}</div>
      <button class="btn ghost" onclick="logout()">Sign out</button>
    </div></div>`;
}

/* ---------------- athlete ---------------- */
function sortByPos(a,b){ return (a.position||0)-(b.position||0); }

let logState = {};      // key -> {idx,reps,kg,lights,effort,miss,done,logId,gym_id,targetReps,psId,exId,added}
let athSelDate=null, athSelSess=null;  // athlete's selected day + session (AM/PM)
window.athSelectSess=(id)=>{ athSelSess=id; renderAthlete(athSelDate); };
let curSession = null;
let curExercises = [];  // [{name,exId,setIds:[...]}] for the live summary
let addSetReady = false; // true once logged_sets.exercise_id exists (05_addset.sql run)
const EFFORTS=[['easy','E'],['moderate','M'],['hard','H'],['max','X']];
const EFFN={easy:1,moderate:2,hard:3,max:4}, EFFL=['—','Easy','Moderate','Hard','Max'];
function ltsDots(n){ let h=''; for(let i=0;i<3;i++) h+=`<i class="${i<n?'w':'r'}"></i>`; return h; }
function lightsHtml(n){ return ltsDots(n); }   // used by coach panel
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function fmtDate(d){ const D=new Date(d+'T00:00:00'); const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return days[D.getDay()]+', '+mon[D.getMonth()]+' '+D.getDate(); }
function effCells(id,eff){ return `<span class="lg-eff">${EFFORTS.map(e=>`<span class="lg-light ${e[0]}${eff===e[0]?' on':''}" data-eff="${e[0]}" data-set="${id}">${e[1]}</span>`).join('')}</span>`; }
function vidCell(id, st){
  if(st.uploading) return `<span class="upvid up" data-set="${id}">… uploading</span>`;
  if(st.video_path) return `<span class="upvid on" data-set="${id}">▶ clip · Set ${st.idx}</span><span class="vidrm" data-set="${id}" title="Remove this video">✕</span>`;
  return `<span class="upvid" data-set="${id}">⤴ video</span>`;
}
async function removeVideo(id){
  const st=logState[id]; if(!st || !st.video_path) return;
  try{
    const { error, data } = await sb.storage.from('lift-videos').remove([st.video_path]);
    if(error || !data || !data.length) throw (error || new Error('not removed (permission?)'));
    st.video_path=null; refreshRow(id);
    await saveOneSet(id); // persist the cleared link
  }catch(e){
    console.error('video remove failed:', e.message||e);
    const tr=document.querySelector('tr[data-set="'+id+'"]');
    const vr=tr && tr.querySelector('.vidrm'); if(vr){ vr.classList.remove('arm'); vr.textContent='⚠'; setTimeout(()=>{ if(vr.isConnected) vr.textContent='✕'; },2500); }
  }
}
let uploadTargetSet=null;
async function onVidPicked(){
  const inp=document.getElementById('vidInput'); const file=inp.files&&inp.files[0]; inp.value='';
  if(!file || !uploadTargetSet) return;
  const id=uploadTargetSet; const st=logState[id];
  st.uploading=true; refreshRow(id);
  try{
    const ext=(file.name.split('.').pop()||'mp4').toLowerCase();
    const path=`${me_.gym_id}/${me_.id}/${curSession.id}-${id}-${Date.now()}.${ext}`;
    const { error } = await sb.storage.from('lift-videos').upload(path, file, { contentType:file.type||'video/mp4', upsert:true });
    if(error) throw error;
    st.video_path=path; st.uploading=false; refreshRow(id);
    await saveOneSet(id); // link it now so it survives a reload
  }catch(e){ st.uploading=false; refreshRow(id); alert('Video upload failed — '+(e.message||e)); }
}
function setPayload(st){
  const p={ gym_id:st.gym_id, session_id:curSession.id, prescribed_set_id:st.psId||null, athlete_id:me_.id,
    actual_reps:(st.reps===''||st.reps==null)?null:parseInt(st.reps,10),
    actual_kg:(st.kg===''||st.kg==null)?null:parseFloat(st.kg),
    lights:st.lights, effort:st.effort, miss:(parseInt(st.miss)||0), done:st.done, video_path:st.video_path||null };
  if(addSetReady && st.exId) p.exercise_id=st.exId; // only when the column exists
  return p;
}
async function saveOneSet(id){
  const st=logState[id];
  const payload=setPayload(st);
  const res = st.logId ? await sb.from('logged_sets').update(payload).eq('id',st.logId).select()
                       : await sb.from('logged_sets').insert(payload).select();
  if(res.data && res.data[0]) st.logId=res.data[0].id;
}
async function playVideo(path){
  const { data, error } = await sb.storage.from('lift-videos').createSignedUrl(path, 3600);
  if(error || !data){ alert('Could not load that clip.'); return; }
  let m=document.getElementById('vidModal');
  if(!m){ m=document.createElement('div'); m.id='vidModal'; m.className='vid-modal'; document.body.appendChild(m); }
  m.innerHTML=`<div class="vid-box"><span class="vid-x" onclick="closeVid()">✕</span><video src="${data.signedUrl}" controls autoplay playsinline style="width:100%;border-radius:8px;max-height:70vh;background:#000"></video></div>`;
  m.style.display='flex'; m.onclick=(ev)=>{ if(ev.target===m) closeVid(); };
}
function closeVid(){ const m=document.getElementById('vidModal'); if(m){ m.style.display='none'; m.innerHTML=''; } }
function rowHtml(key,i){
  const st=logState[key];
  return `<tr data-set="${key}">
    <td>${i+1}</td>
    <td class="tgt">${st.added?'<span class="addedtag">added</span>':esc(st.targetText||'')}</td>
    <td><input class="cell" data-f="reps" value="${esc(st.reps)}" inputmode="numeric"></td>
    <td><input class="cell" data-f="kg" value="${esc(st.kg)}" inputmode="decimal"></td>
    <td><input class="cell mini" data-f="miss" value="${esc(st.miss)}" inputmode="numeric"></td>
    <td><span class="lights lg-lts" data-set="${key}" title="Tap: white = good lift, red = miss">${ltsDots(st.lights)}</span></td>
    <td>${effCells(key, st.effort)}</td>
    <td class="vidcell">${vidCell(key, st)}</td>
    <td><input type="checkbox" class="chk" data-f="done" ${st.done?'checked':''}></td>
    <td>${st.added?`<span class="lg-del" data-set="${key}" title="Remove this set">✕</span>`:''}</td>
  </tr>`;
}
let addSeq=0;
function addSetRow(exId){
  const ex=curExercises.find(e=>e.exId===exId); if(!ex) return;
  const last=ex.setIds.length?logState[ex.setIds[ex.setIds.length-1]]:null;
  const key='new_'+(++addSeq);
  logState[key]={ idx:ex.setIds.length+1, targetReps:null, targetText:'',
    reps: last?last.reps:'', kg: last?last.kg:'', lights:3, effort:null, miss:0, done:false,
    video_path:null, uploading:false, logId:null, gym_id:curSession.gym_id, psId:null, exId:exId, added:true };
  ex.setIds.push(key);
  const tb=document.querySelector(`table.logtable[data-ex="${exId}"] tbody`);
  if(tb) tb.insertAdjacentHTML('beforeend', rowHtml(key, ex.setIds.length-1));
  recompute();
}
async function removeSetRow(key){
  const st=logState[key]; if(!st || !st.added) return;
  if(st.logId){
    const res=await sb.from('logged_sets').delete().eq('id', st.logId).select();
    if(res.error || !res.data || !res.data.length){ console.error('set remove failed:', res.error&&res.error.message); return; }
  }
  const ex=curExercises.find(e=>e.exId===st.exId);
  if(ex) ex.setIds=ex.setIds.filter(k=>k!==key);
  delete logState[key];
  const tr=document.querySelector(`tr[data-set="${key}"]`); if(tr) tr.remove();
  recompute();
}
function refreshRow(id){
  const tr=document.querySelector('tr[data-set="'+id+'"]'); if(!tr) return; const st=logState[id];
  const lts=tr.querySelector('.lg-lts'); if(lts) lts.innerHTML=ltsDots(st.lights);
  tr.querySelectorAll('.lg-light').forEach(b=>b.classList.toggle('on', b.dataset.eff===st.effort));
  const vc=tr.querySelector('.vidcell'); if(vc) vc.innerHTML=vidCell(id, st);
}
function recompute(){
  let pNL=0,aNL=0,aTon=0,miss=0,planSets=0,doneSets=0,good=0,effSum=0,effN=0;
  const per=curExercises.map(ex=>{
    let e={name:ex.name,pNL:0,aNL:0,aTon:0,miss:0,sets:ex.setIds.length,done:0};
    ex.setIds.forEach(id=>{ const st=logState[id];
      const pr=parseInt(st.targetReps)||0, r=parseInt(st.reps)||0, k=num(st.kg), m=parseInt(st.miss)||0;
      planSets++; if(st.done){doneSets++;e.done++;}
      if(st.lights===3)good++;
      if(st.effort){effN++;effSum+=EFFN[st.effort];}
      e.pNL+=pr; e.aNL+=r; e.aTon+=r*k; e.miss+=m;
      pNL+=pr; aNL+=r; aTon+=r*k; miss+=m;
    });
    return e;
  });
  const completion=planSets?Math.round(doneSets/planSets*100):0, avgEff=effN?EFFL[Math.round(effSum/effN)]:'—';
  const tile=(l,a,p)=>`<div class="ss-tile"><div class="ss-v">${a}${p!=null?`<span class="ss-p"> / ${p}</span>`:''}</div><div class="ss-l">${l}</div></div>`;
  const tiles=`<div class="ss-tiles">${tile('Volume (NL)',aNL,pNL)}${tile('Tonnage',(aTon/1000).toFixed(1)+'t')}${tile('Set completion',completion+'%')}${tile('Good lifts',good+'/'+planSets)}${tile('Misses',miss)}${tile('Avg effort',avgEff)}</div>`;
  const lines=`<table class="ss-ex"><tbody>${per.map(e=>`<tr><td>${esc(e.name)}</td><td>${e.done}/${e.sets} sets</td><td><b style="color:var(--text)">${e.aNL}</b> NL / ${e.pNL}</td><td>${(e.aTon/1000).toFixed(1)}t</td><td>${e.miss?`<span style="color:var(--bad)">${e.miss} miss</span>`:'<span style="color:var(--good)">clean</span>'}</td></tr>`).join('')}</tbody></table>`;
  const box=document.getElementById('ssBody'); if(box) box.innerHTML=tiles+lines;
}
function wireLogging(){
  const root=document.getElementById('logRoot'); if(!root) return;
  root.addEventListener('input', e=>{ const inp=e.target.closest('.cell'); if(!inp) return; logState[inp.closest('tr').dataset.set][inp.dataset.f]=inp.value; recompute(); });
  root.addEventListener('change', e=>{ const c=e.target.closest('.chk'); if(!c) return; logState[c.closest('tr').dataset.set].done=c.checked; recompute(); });
  root.addEventListener('click', e=>{
    const tr=e.target.closest('tr[data-set]'); if(!tr) return; const id=tr.dataset.set; const st=logState[id];
    if(e.target.closest('.lg-lts')){ st.lights = st.lights===0?3:st.lights-1; refreshRow(id); recompute(); return; }
    const eff=e.target.closest('.lg-light'); if(eff){ st.effort=(st.effort===eff.dataset.eff?null:eff.dataset.eff); refreshRow(id); recompute(); return; }
    const v=e.target.closest('.upvid'); if(v){ if(st.video_path) playVideo(st.video_path); else { uploadTargetSet=id; document.getElementById('vidInput').click(); } return; }
    const vr=e.target.closest('.vidrm'); if(vr){
      if(!vr.classList.contains('arm')){ vr.classList.add('arm'); vr.textContent='remove?'; setTimeout(()=>{ if(vr.isConnected){ vr.classList.remove('arm'); vr.textContent='✕'; } }, 4500); }
      else removeVideo(id);
      return;
    }
    const del=e.target.closest('.lg-del'); if(del){ removeSetRow(id); return; }
  });
}
let LT_READY=false;
let SESSION_SELECT='id,gym_id,title,session_date,status,prescribed_exercises(id,name,position,category,coach_note,prescribed_sets(id,position,target_text,target_reps,target_kg,target_pct))';
async function probeLoadTypes(){
  const { error } = await sb.from('prescribed_exercises').select('load_type').limit(1);
  if(!error){
    LT_READY=true;
    SESSION_SELECT='id,gym_id,title,session_date,status,prescribed_exercises(id,name,position,category,coach_note,load_type,cues,prescribed_sets(id,position,target_text,target_reps,target_kg,target_pct,target_vel,target_eff))';
  }
}
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekDates(offset){ // Mon..Sun of the current week, shifted by `offset` weeks
  const now=new Date(); const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7)+7*(offset||0));
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function shortTitle(t){ const w=(t||'').split(/[\s·\-—]+/)[0]||'Train'; return w.length>8?w.slice(0,8):w; }
/* ---------------- morning readiness check-in ---------------- */
const RK_METRICS=[
  ['sleep','Sleep','hours & quality'],
  ['energy','Energy',''],
  ['motivation','Motivation',''],
  ['soreness','Soreness','5 = fresh · 1 = wrecked'],
  ['mood','Mood',''],
  ['stress','Stress','5 = calm · 1 = maxed out'],

let rkState=null; // {id, open, vals:{sleep..appetite}, bodyweight, note, savedToday}
function rkScore(){
  const vs=RK_METRICS.map(m=>rkState.vals[m[0]]).filter(v=>v!=null);
  if(vs.length<RK_METRICS.length) return null;
  return Math.round(vs.reduce((a,b)=>a+b,0)/vs.length*10)/10;
}
function rkScoreClass(s){ return s==null?'':(s>=4?'good':(s>=3?'warn':'bad')); }
function checkinCard(){
  if(!rkState) return '';
  if(rkState.savedToday && !rkState.open){
    const s=rkScore();

function repaintCheckin(){
  const host=document.getElementById('rkHost'); if(host) host.innerHTML=checkinCard();
}
function wireCheckin(){
  const host=document.getElementById('rkHost'); if(!host) return;
  host.addEventListener('click', e=>{
    const d=e.target.closest('.rk-dot'); if(!d) return;
    rkState.vals[d.dataset.k]=+d.dataset.v;
    // patch in place to keep textarea/bw values
    const card=document.getElementById('rkCard');
    card.querySelectorAll(`.rk-dot[data-k="${d.dataset.k}"]`).forEach(x=>x.classList.toggle('on', x===d));
    const s=rkScore(), n=document.getElementById('rkNum');
    if(n){ n.textContent=s==null?'—':s.toFixed(1); n.className='rk-num '+rkScoreClass(s); }
  });
  host.addEventListener('input', e=>{
    if(e.target.id==='rkBw') rkState.bodyweight=e.target.value;

async function submitCheckin(){
  const btn=document.getElementById('rkSubmit'), msg=document.getElementById('rkMsg');
  msg.style.color=''; msg.textContent='';
  const missing=RK_METRICS.filter(m=>rkState.vals[m[0]]==null).map(m=>m[1]);
  if(missing.length){ msg.style.color='var(--warn)'; msg.textContent='Tap a score for: '+missing.join(', '); return; }
  const { data:{ user } } = await sb.auth.getUser();
  if(!user || user.id!==me_.id){ msg.style.color='var(--bad)'; msg.textContent='⚠ Session expired — sign in again.'; return; }
  btn.disabled=true; btn.textContent='Sending…';
  const payload={ gym_id: me_.gym_id, athlete_id: me_.id, check_date: iso(new Date()),
    bodyweight: rkState.bodyweight===''||rkState.bodyweight==null?null:parseFloat(rkState.bodyweight),
    note: (rkState.note||'').trim()||null };
  RK_METRICS.forEach(m=>payload[m[0]]=rkState.vals[m[0]]);
  const res = await sb.from('readiness').upsert(payload, { onConflict:'athlete_id,check_date' }).select();
  btn.disabled=false; btn.textContent='✓ Submit check-in';
  if(res.error || !res.data || !res.data.length){
    msg.style.color='var(--bad)'; msg.textContent='⚠ Send failed — '+(res.error?res.error.message:'sign out and back in.'); return;
  }
  rkState.id=res.data[0].id; rkState.savedToday=true; rkState.open=false;
  repaintCheckin();
}

async function saveSession(){
  const btn=document.getElementById('save'), msg=document.getElementById('savedmsg');
  btn.disabled=true; btn.textContent='Saving…'; msg.style.color=''; msg.textContent='';
  const { data:{ user } } = await sb.auth.getUser();
  if(!user || user.id !== me_.id){
    btn.disabled=false; btn.textContent='Submit session';
    msg.style.color='var(--bad)'; msg.textContent='⚠ Login mismatch — sign out and sign back in as this athlete.';
    return;
  }
  try{
    let saved=0;
    for(const id in logState){
      const st=logState[id];
      const payload=setPayload(st);
      const res = st.logId
        ? await sb.from('logged_sets').update(payload).eq('id', st.logId).select()
        : await sb.from('logged_sets').insert(payload).select();
      if(res.error) throw res.error;
      if(!res.data || res.data.length===0) throw new Error('the database rejected the save (login). Sign out and back in.');
      st.logId = res.data[0].id;
      saved++;
    }
    btn.disabled=false; btn.textContent='Submit session';
    msg.style.color='var(--good)'; msg.textContent='✓ Submitted — your coach has it'; setTimeout(()=>{ msg.textContent=''; },3500);
  }catch(e){
    btn.disabled=false; btn.textContent='Submit session';
    msg.style.color='var(--bad)'; msg.textContent='⚠ Save failed — '+(e.message||e);
  }
}

function statsFor(sessRows, logs){

  (sessRows||[]).forEach(s=>(s.prescribed_exercises||[]).forEach(ex=>(ex.prescribed_sets||[]).forEach(ps=>{

async function renderRollup(){

  // WEEK: cached

  try{
    if(!cw.rollupCache) cw.rollupCache={};
    if(cw.block){
      blockName=cw.block.name;
      if(!cw.rollupCache.block){
        const { data: bs } = await sb.from('sessions')
          .select('id,session_date,prescribed_exercises(prescribed_sets(target_reps,target_pct))')
          .eq('athlete_id', cw.athId).gte('session_date', cw.block.start_date).lte('session_date', cw.block.end_date);
        const bids=(bs||[]).map(x=>x.id);
        let blogs=[];
        if(bids.length){ const { data: bl } = await sb.from('logged_sets').select('miss,done,session_id,prescribed_set_id').in('session_id', bids); blogs=bl||[]; }
        cw.rollupCache.block={ rows:bs||[], logs:blogs };
      }
      sBlock=statsFor(cw.rollupCache.block.rows, cw.rollupCache.block.logs);
    }
    if(!cw.rollupCache.all){
      const { data: as_ } = await sb.from('sessions')

        .eq('athlete_id', cw.athId);

      cw.rollupCache.all={ rows:as_||[], logs:alogs };
    }

  const row=(lbl,sub,st,hl)=>st?`<tr${hl?' class="ru-hl"':''}><td><b>${lbl}</b>${sub?` <span class="tgt">· ${esc(sub)}</span>`:''}</td>
    <td>${st.vol||'—'}</td><td>${st.ari?st.ari.toFixed(1)+'%':'—'}</td><td>${st.peak?st.peak+'%':'—'}</td>
    <td>${st.done}/${st.total}</td><td>${st.miss}</td><td>${st.sessions!=null?st.sessions:''}</td></tr>`:'';
  host.innerHTML=`<div class="card">
    <h2 style="margin:0 0 4px">Metric rollup</h2>
    <div class="sub" style="margin-bottom:10px">This session, then up the hierarchy — planned volume & intensity, logged completion & misses.</div>
    <div class="logwrap"><table class="logtable ru"><thead><tr><th style="text-align:left">Level</th><th>Volume</th><th>ARI</th><th>Peak %</th><th>Sets done</th><th>Misses</th><th>Sessions</th></tr></thead><tbody>
      ${row('Session', ed.session.title, {...sSession, sessions:null}, true)}
      ${row('↑ Day', fmtDate(cw.selDate), sDay)}
      ${row('↑ Week', null, sWeek)}
      ${sBlock?row('↑ Block', blockName, sBlock):''}
      ${sAll?row('↑ All-time', null, sAll):''}
    </tbody></table></div>

}

function wireEditor(){
  const card=document.getElementById('edCard'); if(!card) return;
  card.addEventListener('input', e=>{
    const t=e.target;
    if(t.id==='edTitle'){ ed.session.title=t.value; ed.dirty=true; return; }
    const cvx=t.closest('.cvx'); if(!cvx) return;
    const ex=ed.exercises[+cvx.dataset.ei]; if(!ex) return;
    if(t.dataset.f==='name'){ ex.name=t.value; ed.dirty=true;
      const orm=oneRMFor(ex.name);
      cvx.querySelector('.cvx-orm').innerHTML = (orm&&(ex.loadType||'percentage')==='percentage')?`1RM <b>${orm}</b> · from maxes`:((ex.loadType||'percentage')==='percentage'&&cw.maxes?'<span class="cv-nolog">no 1RM link</span>':'');
      if((ex.loadType||'percentage')==='percentage') cvx.querySelectorAll('[data-f="tgt"]').forEach(p=>{ p.disabled=!orm; });
      return; }
    if(t.dataset.f==='note'){ ex.note=t.value; ed.dirty=true; return; }
    const tr=t.closest('tr[data-si]'); if(!tr) return;
    const st=ex.sets[+tr.dataset.si]; if(!st) return;
    const type=ex.loadType||'percentage';
    const orm=oneRMFor(ex.name);
    if(t.dataset.f==='reps'){ st.reps=t.value; }
    if(t.dataset.f==='tgt'){
      if(type==='percentage'){ st.pct=t.value;
        if(orm && t.value!==''){ st.kg=rnd1(orm*parseFloat(t.value)/100); const k=tr.querySelector('[data-f="kg"]'); if(k) k.value=st.kg; } }
      else if(type==='vbt'){ st.vel=t.value; }
      else if(type==='rpe'||type==='rir'){ st.eff=t.value; }
    }
    if(t.dataset.f==='kg'){ st.kg=t.value;
      if(type==='percentage' && orm && t.value!==''){ st.pct=rnd1(parseFloat(t.value)/orm*100); const pi=tr.querySelector('[data-f="tgt"]'); if(pi) pi.value=st.pct; } }
    ed.dirty=true;
    const tiles=cvx.querySelector('.cv-tiles'); if(tiles) tiles.outerHTML=exTiles(ex);
    const st2=document.getElementById('edTiles'); if(st2) st2.innerHTML=sessionTiles();
  });
  card.addEventListener('change', e=>{
    const sel=e.target.closest('.lt-sel'); if(!sel) return;
    const cvx=sel.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei]; if(!ex) return;
    ex.loadType=sel.value; ed.dirty=true; paintEditor();
  });
  card.addEventListener('click', e=>{
    const add=e.target.closest('[data-addrow]');
    if(add){ const cvx=add.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei];
      const last=ex.sets[ex.sets.length-1]||{reps:'',pct:'',kg:'',vel:'',eff:''};
      ex.sets.push({id:null, reps:last.reps, pct:last.pct, kg:last.kg, vel:last.vel, eff:last.eff}); ed.dirty=true; paintEditor(); return; }
    const rm=e.target.closest('[data-rmrow]');
    if(rm){ const tr=rm.closest('tr'); const cvx=rm.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei];
      const st=ex.sets[+tr.dataset.si]; if(st && st.id) ex.delSets.push(st.id);
      ex.sets.splice(+tr.dataset.si,1); ed.dirty=true; paintEditor(); return; }
    const cu=e.target.closest('.cue-x');
    if(cu){ const cvx=cu.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei];
      ex.cues.splice(+cu.dataset.ci,1); ed.dirty=true; paintEditor(); return; }
    const ca=e.target.closest('[data-cue]');
    if(ca){ const cvx=ca.closest('.cvx'); openCueModal(+cvx.dataset.ei); return; }
    const sc=e.target.closest('[data-scheme]');
    if(sc){ const cvx=sc.closest('.cvx'); openSchemeModal(+cvx.dataset.ei); return; }
    const dx=e.target.closest('[data-delex]');
    if(dx){ if(!dx.classList.contains('arm')){ dx.classList.add('arm'); dx.textContent='remove?';
        setTimeout(()=>{ if(dx.isConnected){ dx.classList.remove('arm'); dx.textContent='✕ remove'; } },3500); return; }
      const cvx=dx.closest('.cvx'); const ei=+cvx.dataset.ei; const ex=ed.exercises[ei];
      if(ex.id) ed.delExs.push(ex.id);
      ed.exercises.splice(ei,1); ed.dirty=true; paintEditor(); return; }
    if(e.target.id==='edAddEx' || e.target.closest('#edAddEx')){
      ed.exercises.push({id:null,name:'',note:'',category:'primary',loadType:'percentage',cues:[],sets:[{id:null,reps:'',pct:'',kg:'',vel:'',eff:''}],delSets:[]});
      ed.dirty=true; paintEditor(); return; }
    if(e.target.id==='edSave'){ saveEditor(false); return; }
    if(e.target.id==='edPublish'){ saveEditor(true); return; }
    if(e.target.id==='edCopyOpen'){ const ui=document.getElementById('edCopyUI'); ui.style.display = ui.style.display==='none'?'inline-flex':'none'; return; }
    if(e.target.id==='edCopyGo'){ cvCopyDay(document.getElementById('edCopyDate').value); return; }
    const ds=e.target.closest('#edDelSess');
    if(ds){ if(!ds.classList.contains('arm')){ ds.classList.add('arm'); ds.textContent='delete session?';
        setTimeout(()=>{ if(ds.isConnected){ ds.classList.remove('arm'); ds.textContent='✕ session'; } },3500); return; }
      deleteSession(); return; }
  });
}

const SCHEME_PRESETS=[
  {n:'5×5 flat',sets:5,reps:5,shape:'flat',top:70},
  {n:'3×5 flat',sets:3,reps:5,shape:'flat',top:75},
  {n:'5×3 ramp',sets:5,reps:3,shape:'ramp',top:85,rampFrom:10},
  {n:'6×2 wave',sets:6,reps:2,shape:'wave',top:82,amp:4},
  {n:'8×2 flat',sets:8,reps:2,shape:'flat',top:75}

let schemeTarget=null;
function schemeExpand(n,reps,shape,top,rampFrom,amp){
  const out=[];
  for(let i=0;i<n;i++){
    let v=top;
    if(shape==='ramp' && n>1) v=top-rampFrom + rampFrom*(i/(n-1));
    if(shape==='wave') v=(i%2===0)?top-amp:top;
    out.push({reps:reps, val:Math.round(v*100)/100});
  }
  return out;
}
function openSchemeModal(ei){ schemeTarget=ei; paintSchemeModal(); }
function schemeUnit(){ const ex=ed&&ed.exercises[schemeTarget]; const t=ex?(ex.loadType||'percentage'):'percentage';

    if(ed.dirty) throw new Error('save your changes first, then copy');
    const { data: ns, error: se } = await sb.from('sessions').insert({
      gym_id: me_.gym_id, athlete_id: coachState.selected, session_date: targetDate,
      title: ed.session.title||'Training', status:'draft' }).select().single();
    if(se) throw se;
    for(let ei=0; ei<ed.exercises.length; ei++){
      const ex=ed.exercises[ei]; if(!ex.name.trim()) continue;
      const exIns={ gym_id: me_.gym_id, session_id: ns.id, position: ei, name: ex.name.trim(),
        category: ex.category||'primary', coach_note: ex.note.trim()||null };
      if(LT_READY){ exIns.load_type=ex.loadType||'percentage'; exIns.cues=(ex.cues&&ex.cues.length)?ex.cues:null; }
      const { data: ne, error: ee } = await sb.from('prescribed_exercises').insert(exIns).select().single();
      if(ee) throw ee;
      const rows = ex.sets
        .filter(st=>!(st.reps==='' && st.pct==='' && st.kg==='' && (st.vel===''||st.vel==null) && (st.eff===''||st.eff==null)))
        .map((st,si)=>{ const row={ gym_id: me_.gym_id, exercise_id: ne.id, position: si,
          target_reps: st.reps===''?null:parseInt(st.reps,10),
          target_pct: st.pct===''?null:parseFloat(st.pct),
          target_kg: st.kg===''?null:parseFloat(st.kg),
          target_text: targetText(st, ex.loadType) };
          if(LT_READY){ row.target_vel=st.vel===''||st.vel==null?null:parseFloat(st.vel); row.target_eff=st.eff===''||st.eff==null?null:parseFloat(st.eff); }
          return row; });
      if(rows.length){ const { error: re } = await sb.from('prescribed_sets').insert(rows); if(re) throw re; }
    }
    document.getElementById('edCopyUI').style.display='none';
    edMsgSet('✓ Copied to '+fmtDate(targetDate)+' as a draft','var(--good)');
    setTimeout(()=>edMsgSet(''),4000);
  }catch(e2){
    edMsgSet('⚠ Copy failed — '+(e2.message||e2),'var(--bad)');
  }
  if(go){ go.disabled=false; go.textContent='Copy as draft'; }
}
function refreshStripDot(){
  if(!cw) return; const chip=document.querySelector('#coachPanel .av-day.on'); if(!chip) return;
  const list=cw.sessByDate[cw.selDate]||[]; const dot=chip.querySelector('.av-day-dot'); if(!dot) return;
  const todayStr=iso(new Date());
  dot.className='av-day-dot '+(!list.length?'rest':(list.some(x=>x.status==='draft')?'draft':(cw.selDate===todayStr?'today':'up')));
}
async function deleteSession(){
  const id=ed.session.id;
  const res=await sb.from('sessions').delete().eq('id', id).select();
  if(res.error){ edMsgSet('⚠ Delete failed — '+res.error.message,'var(--bad)'); return; }
  // success — even if 0 rows came back (already deleted elsewhere)
  if(cw && cw.sessByDate && cw.sessByDate[cw.selDate]){
    cw.sessByDate[cw.selDate]=cw.sessByDate[cw.selDate].filter(s=>s.id!==id);
    if(!cw.sessByDate[cw.selDate].length) delete cw.sessByDate[cw.selDate];
  }
  if(cw){ cw.selSess=null; cw.rollupCache=null; }
  ed=null;
  renderCoachPanel();
}
function targetText(st, type){
  const r=st.reps===''||st.reps==null?null:parseInt(st.reps,10);
  const p=st.pct===''||st.pct==null?null:parseFloat(st.pct);
  const k=st.kg===''||st.kg==null?null:parseFloat(st.kg);
  const v=st.vel===''||st.vel==null?null:parseFloat(st.vel);
  const e=st.eff===''||st.eff==null?null:parseFloat(st.eff);
  type=type||'percentage';
  if(type==='vbt'){ if(r!=null&&v!=null) return `${r} @ ≥${v.toFixed(2)} m/s${k!=null?` (${k}kg)`:''}`; if(r!=null) return `${r} reps · VBT`; return '—'; }
  if(type==='rpe'){ if(r!=null&&e!=null) return `${r} @ RPE ${e}`; if(r!=null) return `${r} reps`; return '—'; }
  if(type==='rir'){ if(r!=null&&e!=null) return `${r} @ ${e} RIR`; if(r!=null) return `${r} reps`; return '—'; }
  if(type==='open'){ return r!=null?`${r} reps · open`:'open set'; }
  if(type==='weight'){ if(r!=null&&k!=null) return `${r} × ${k}kg`; if(k!=null) return `${k}kg`; if(r!=null) return `${r} reps`; return '—'; }
  if(r!=null&&p!=null&&k!=null) return `${r} @ ${p}% (${k}kg)`;
  if(r!=null&&k!=null) return `${r} × ${k}kg`;
  if(r!=null) return `${r} reps`;
  if(k!=null) return `${k}kg`;
  return '—';
}
async function saveEditor(publishAfter){
  const btn=document.getElementById('edSave'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  edMsgSet('');
  try{
    const { data:{ user } } = await sb.auth.getUser();
    if(!user || user.id!==me_.id) throw new Error('login mismatch — sign out and back in');
    const s=ed.session;
    // session title (+ optional publish)
    const sessPatch={ title:(s.title||'Training').trim()||'Training' };
    if(publishAfter) sessPatch.status='published';
    const su=await sb.from('sessions').update(sessPatch).eq('id', s.id).select();
    if(su.error || !su.data || !su.data.length) throw (su.error||new Error('session update rejected'));
    // removed exercises / sets
    if(ed.delExs.length){ const r=await sb.from('prescribed_exercises').delete().in('id', ed.delExs); if(r.error) throw r.error; }
    for(const ex of ed.exercises){ if(ex.delSets.length){ const r=await sb.from('prescribed_sets').delete().in('id', ex.delSets); if(r.error) throw r.error; } }
    // upsert exercises + sets
    for(let ei=0; ei<ed.exercises.length; ei++){
      const ex=ed.exercises[ei];
      if(!ex.name.trim()){ continue; }
      if(ex.id){
        const exPatch={ name:ex.name.trim(), coach_note:ex.note.trim()||null, position:ei };
        if(LT_READY){ exPatch.load_type=ex.loadType||'percentage'; exPatch.cues=(ex.cues&&ex.cues.length)?ex.cues:null; }
        const r=await sb.from('prescribed_exercises').update(exPatch).eq('id', ex.id).select();
        if(r.error) throw r.error;
      } else {
        const exIns={ gym_id:me_.gym_id, session_id:s.id, position:ei, name:ex.name.trim(), category:ex.category||'primary', coach_note:ex.note.trim()||null };
        if(LT_READY){ exIns.load_type=ex.loadType||'percentage'; exIns.cues=(ex.cues&&ex.cues.length)?ex.cues:null; }
        const r=await sb.from('prescribed_exercises').insert(exIns).select().single();
        if(r.error) throw r.error; ex.id=r.data.id;
      }
      for(let si=0; si<ex.sets.length; si++){
        const st=ex.sets[si];
        const empty = st.reps==='' && st.pct==='' && st.kg==='' && (st.vel===''||st.vel==null) && (st.eff===''||st.eff==null);
        if(empty && !st.id) continue;
        const payload={ gym_id:me_.gym_id, exercise_id:ex.id, position:si,
          target_reps: st.reps===''?null:parseInt(st.reps,10),
          target_pct: st.pct===''?null:parseFloat(st.pct),
          target_kg: st.kg===''?null:parseFloat(st.kg),
          target_text: targetText(st, ex.loadType) };
        if(LT_READY){ payload.target_vel = st.vel===''||st.vel==null?null:parseFloat(st.vel); payload.target_eff = st.eff===''||st.eff==null?null:parseFloat(st.eff); }
        if(st.id){ const r=await sb.from('prescribed_sets').update(payload).eq('id', st.id).select(); if(r.error) throw r.error; }
        else { const r=await sb.from('prescribed_sets').insert(payload).select().single(); if(r.error) throw r.error; st.id=r.data.id; }
      }
      ex.delSets=[];
    }
    ed.delExs=[]; ed.dirty=false;
    if(cw) cw.rollupCache=null;
    if(publishAfter) ed.session.status='published';
    const wkEntry = cw && cw.sessByDate && (cw.sessByDate[cw.selDate]||[]).find(s=>s.id===ed.session.id);
    if(wkEntry){ wkEntry.title=ed.session.title; if(publishAfter) wkEntry.status='published'; }
    refreshStripDot();
    if(publishAfter){ const ti=document.querySelector('.cw-stab.on i'); if(ti) ti.remove(); }
    paintEditor();
    edMsgSet(publishAfter?'✓ Saved & published — it\'s on '+cw.ath.full_name.split(' ')[0]+'\'s phone':'✓ Saved','var(--good)');
    setTimeout(()=>edMsgSet(''),3500);
  }catch(e2){
    if(btn){ btn.disabled=false; btn.textContent='Save changes'; }
    edMsgSet('⚠ Save failed — '+(e2.message||e2),'var(--bad)');
  }
  if(btn){ btn.disabled=false; btn.textContent='Save changes'; }
}
async function refreshEditorActuals(){
  if(!ed) return;
  const { data: logs } = await sb.from('logged_sets').select('*').eq('session_id', ed.session.id);
  ed.logs = logs||[];
  if(!ed.dirty){ paintEditor(); return; }
  // coach has unsaved edits — patch only the actual cells
  const logBySet={}; ed.logs.forEach(l=>{ if(l.prescribed_set_id) logBySet[l.prescribed_set_id]=l; });
  document.querySelectorAll('#edCard .cva[data-ps]').forEach(td=>{
    const ps=td.dataset.ps; if(ps) td.innerHTML=logResultHtml(logBySet[ps]);
  });
  if(cw) cw.rollupCache=null;
  renderRollup();
}

boot();
