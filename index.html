// keep the flat sections list in sync with the group structure (used by save/send + templates)
function reportSyncSections(){ const out=[]; (reportState.groups||[]).forEach(g=>(g.mods||[]).forEach(k=>{ if(out.indexOf(k)<0) out.push(k); })); if(reportState.sections&&reportState.sections.indexOf('summary')>=0) out.push('summary'); reportState.sections=out; }
let reportState={ athleteId:null, level:'meso', blockId:null, range:'1y', sections:REPORT_LEVEL_SECTIONS.meso.slice(), groups:reportDefaultGroups('meso'), summary:'', title:'', titleEdited:false, templates:null, tplId:'', theme:'light', editMode:false, overrides:{}, notes:{}, _noteSeq:0, _phases:null, _teamId:undefined, _focusAuto:'', _data:null, _busy:false };
// feature gate — set false until migration 36 is run (probed at boot)
let REPORTS_READY = true;

function reportRangeWindow(range){
  const today=new Date(); let start, label='';
  if(range==='12w'){ start=new Date(today); start.setDate(start.getDate()-7*12); label='Last 12 weeks'; }
  else if(range==='6m'){ start=new Date(today); start.setMonth(start.getMonth()-6); label='Last 6 months'; }
  else if(range==='ytd'){ start=new Date(today.getFullYear(),0,1); label='Year to date'; }
  else if(range==='career'){ start=new Date(2015,0,1); label='Full career'; }
  else { start=new Date(today); start.setFullYear(start.getFullYear()-1); label='Last 12 months'; }
  const months=(today.getFullYear()-start.getFullYear())*12+(today.getMonth()-start.getMonth());
  return { start, startStr:iso(start), endStr:iso(today), label, monthly: months>4 };
}
// the active mesocycle blocks for the selected athlete's scope (team or whole-gym), newest first not — start order
function reportBlocks(){ const ph=reportState._phases||[]; return ph.filter(p=>(p.level||'meso')==='meso'); }
function reportCurrentBlock(){ const today=iso(new Date()); const bl=reportBlocks(); return bl.find(p=>p.start_date<=today&&p.end_date>=today) || bl[bl.length-1] || null; }
// resolve the date window from the chosen level
function reportRangeFor(){
  const today=new Date();
  if(reportState.level==='meso'){
    const bl=reportBlocks(); const b=bl.find(p=>p.id===reportState.blockId)||reportCurrentBlock();
    if(b){ const months=(new Date(b.end_date)-new Date(b.start_date))/(30*864e5); return { start:new Date(b.start_date+'T00:00:00'), startStr:b.start_date, endStr:(b.end_date<iso(today)?b.end_date:iso(today)), label:b.name||'This block', monthly:months>4, block:b }; }
    // no blocks planned -> fall back to last 8 weeks
    const s=new Date(today); s.setDate(s.getDate()-7*8); return { start:s, startStr:iso(s), endStr:iso(today), label:'Recent training (no block set)', monthly:false, block:null };
  }
  if(reportState.level==='macro'){
    const ph=reportState._phases||[];
    if(ph.length){ const starts=ph.map(p=>p.start_date).sort(); const ends=ph.map(p=>p.end_date).sort(); const s0=starts[0], e0=ends[ends.length-1];

  }

}

// auto-draft a focus from the data (efficiency gaps, guardrail flags, completion, climb)
function reportFocusDraft(d){
  if(!d) return '';
  const first=(d.viewName||'The athlete').split(/\s+/)[0]; const bits=[];
  // headline: where they are
  if(d.cls){ if(d.cls.nextRank) bits.push(`${first} sits at ${d.cls.rank||'below Class III'} — ${d.cls.toGo}kg from ${d.cls.nextRank} (${d.cls.pct}% of the way).`);
    else bits.push(`${first} is at ${d.cls.rank} — top of the standards.`); }
  // efficiency: biggest gap to close
  const effAll=(d.eff&&d.eff.groups?d.eff.groups:[]).flatMap(g=>g.rows).filter(r=>r.read);
  const inf=effAll.filter(r=>r.read==='ineff').sort((a,b)=>a.gap-b.gap)[0];
  const hy=effAll.filter(r=>r.read==='hyper').sort((a,b)=>b.gap-a.gap)[0];
  if(inf) bits.push(`Focus: ${inf.mv} lags its target by ${Math.abs(inf.gap).toFixed(0)}kg — the priority to close.`);
  if(hy) bits.push(`Strength to lean on: ${hy.mv} (+${hy.gap.toFixed(0)}kg over ideal).`);
  // guardrails out of band
  if(d.redflags&&d.redflags.flags){ const off=d.redflags.rows.filter(r=>r.flag==='under'||r.flag==='over').map(r=>r.lbl.replace(/ \(.*\)/,'')); if(off.length) bits.push(`Programming watch: ${off.slice(0,3).join(', ')} ${off.length>1?'are':'is'} outside the class band.`); }
  // completion / consistency — only when there's a real sample (avoid scolding an in-progress block)
  if(d.method&&d.method.compPct!=null&&d.method.sessLogged>=3){ if(d.method.compPct>=90) bits.push(`Consistency is strong — ${d.method.compPct}% set completion this period.`); else if(d.method.compPct<75) bits.push(`Completion is running ${d.method.compPct}% — worth a check on adherence.`); }
  // persistent pain — a "watch" line if anything recurred or spiked
  const painLine=painFocusLine(d.pain, first); if(painLine) bits.push(painLine);
  return bits.join(' ');
}

async function reportLoadData(viewId){
  const win=reportRangeFor();
  const { startStr, endStr, monthly } = win;
  const today=new Date(), todayStr=iso(today); const D=s=>new Date(s+'T00:00:00');
  const rdScoreOf=r=>{ const vs=RK_METRICS.map(m=>r[m[0]]).filter(v=>v!=null); return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null; };

  // profile
  const pr=await sb.from('profiles').select('*').eq('id',viewId).maybeSingle();
  const prof=Object.assign({}, viewAth, pr.data||{});
  const viewName=prof.full_name||'Athlete';
  const sex=prof.sex; const age=prof.birthdate?Math.floor((Date.now()-new Date(prof.birthdate).getTime())/(365.25*864e5)):null;
  let teamName=null; if(prof.team_id){ const tr=await sb.from('teams').select('name').eq('id',prof.team_id).maybeSingle(); teamName=tr.data&&tr.data.name; }
  let gymName='Your gym'; try{ const g=await sb.from('gyms').select('name').eq('id',me_.gym_id).single(); if(g.data&&g.data.name) gymName=g.data.name; }catch(e){}
  // maxes + classification
  const maxesRows=(await sb.from('maxes').select('lift,kg,tested_at').eq('athlete_id',viewId)).data||[];
  const maxMap={}; maxesRows.forEach(m=>{ maxMap[normEx(m.lift)]={kg:parseFloat(m.kg),tested_at:m.tested_at,lift:m.lift}; });
  const totM=totalFromMaxes(maxesRows);
  // bodyweight series + classification bw
  const rR=await sb.from('readiness').select('*').eq('athlete_id',viewId).gte('check_date',startStr).lte('check_date',todayStr).order('check_date',{ascending:true});
  const rd=rR.data||[];
  const bwPts=rd.filter(r=>r.bodyweight!=null).map(r=>({ lbl:MONS[D(r.check_date).getMonth()]+' '+D(r.check_date).getDate(), bw:parseFloat(r.bodyweight) })).filter(p=>!isNaN(p.bw));
  const latestBw=bwPts.length?bwPts[bwPts.length-1].bw:null;
  const wcN=(prof.weight_class!=null)?parseFloat((String(prof.weight_class).match(/\d+(\.\d+)?/)||[])[0]):NaN;
  const clsBw=(!isNaN(wcN)&&wcN>0)?wcN:latestBw;   // digits-only parse (matches dashboard) so a "59kg"/"59+" string can't misclassify
  const cls=(sex&&clsBw!=null&&totM&&totM.hasBoth)?classify(sex,clsBw,totM.total):null;
  // meets
  const meetsR=await sb.from('meet_results').select('*').eq('athlete_id',viewId).order('meet_date',{ascending:true});
  const meets=meetsR.error?[]:(meetsR.data||[]);
  // range sessions + logs
  const sR=await sb.from('sessions').select('id,session_date,prescribed_exercises(name,category,prescribed_sets(target_reps,target_pct))').eq('athlete_id',viewId).neq('status','draft').gte('session_date',startStr).lte('session_date',todayStr);
  const sess=sR.data||[]; const ids=sess.map(s=>s.id);
  let logs=[]; if(ids.length){ for(let i=0;i<ids.length;i+=200){ const r=await sb.from('logged_sets').select('session_id,done,miss,prescribed_set_id,actual_kg,actual_reps,lights').in('session_id',ids.slice(i,i+200)); if(r.data) logs=logs.concat(r.data); } }
  // KPIs
  const trainedSess=new Set(logs.filter(l=>l.done).map(l=>l.session_id)); const sessLogged=trainedSess.size;
  let tonnage=0; logs.forEach(l=>{ if(l.done&&l.actual_kg&&l.actual_reps) tonnage+=l.actual_kg*l.actual_reps; });
  let presN=0; sess.forEach(s=>(s.prescribed_exercises||[]).forEach(ex=>presN+=(ex.prescribed_sets||[]).length));
  const doneSets=logs.filter(l=>l.done&&l.prescribed_set_id).length; const compPct=presN?Math.round(doneSets/presN*100):null;
  const rdScores=rd.map(rdScoreOf).filter(v=>v!=null); const rdAvg=rdScores.length?rdScores.reduce((a,b)=>a+b,0)/rdScores.length:null;
  const withLights=logs.filter(l=>l.done&&l.lights!=null); const cleanN=withLights.filter(l=>l.lights===3).length; const cleanPct=withLights.length?Math.round(cleanN/withLights.length*100):null;
  // methodology (planned, over range) via liftMetrics
  const flatSets=[]; let l90=0; const weeks=new Set();
  const mon=ds=>{ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
  sess.forEach(s=>{ weeks.add(mon(s.session_date)); (s.prescribed_exercises||[]).forEach(ex=>{ const acc=exIsAcc(ex); (ex.prescribed_sets||[]).forEach(ps=>{ const reps=ps.target_reps||0, pct=ps.target_pct!=null?parseFloat(ps.target_pct):0; if(reps){ flatSets.push({reps,pct,acc}); if(!acc&&pct>=90&&pct<=100) l90+=reps; } }); }); });
  const mm=liftMetrics(flatSets); const nWk=Math.max(1,weeks.size);
  const method={ vol:mm.vol, volPri:mm.volPri, volAcc:mm.volAcc, ari:mm.ari, ri:mm.ri, inol:mm.inol, peak:mm.peak, l90, weekly:Math.round(mm.volPri/nWk), nWk, sessLogged, tonnage, compPct, rdAvg, cleanPct };
  // trend buckets
  const bmap={}; const bkey=ds=>{ const d=D(ds); return monthly?(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')):mon(ds); };
  if(monthly){ let c=new Date(win.start.getFullYear(),win.start.getMonth(),1); while(c<=today){ const k=c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0'); bmap[k]={lbl:MONS[c.getMonth()], vol:0, rdSum:0, rdN:0, rd:null}; c.setMonth(c.getMonth()+1); } }
  else { let c=new Date(win.start); c.setDate(c.getDate()-((c.getDay()+6)%7)); let wi=1; while(c<=today){ bmap[iso(c)]={lbl:'Wk'+wi, vol:0, rdSum:0, rdN:0, rd:null}; c.setDate(c.getDate()+7); wi++; } }
  sess.forEach(s=>{ const k=bkey(s.session_date); if(!bmap[k]) return; let v=0; (s.prescribed_exercises||[]).forEach(ex=>(ex.prescribed_sets||[]).forEach(ps=>v+=ps.target_reps||0)); bmap[k].vol+=v; });
  rd.forEach(r=>{ const k=bkey(r.check_date); if(!bmap[k]) return; const sc=rdScoreOf(r); if(sc!=null){ bmap[k].rdSum+=sc; bmap[k].rdN++; } });
  const buckets=[]; Object.keys(bmap).sort().forEach(k=>{ const b=bmap[k]; b.rd=b.rdN?b.rdSum/b.rdN:null; buckets.push(b); });
  const hasTrend=buckets.some(b=>b.vol>0||b.rd!=null);
  // red-flag engine (52-week programmed vs guardrails) — only if classified
  let redflags=null;
  if(cls){
    const g=CLASS_GUARDRAILS[cls.rank]; const yStart=new Date(today); yStart.setDate(yStart.getDate()-364);
    const ysR=await sb.from('sessions').select('session_date,prescribed_exercises(name,prescribed_sets(target_reps,target_pct))').eq('athlete_id',viewId).neq('status','draft').gte('session_date',iso(yStart)).lte('session_date',todayStr);
    const ysess=ysR.error?[]:(ysR.data||[]);
    let reps=0,vw=0,pv=0,lifts90=0; const wkset=new Set(); const fam={snari:[0,0],cjari:[0,0],sqari:[0,0],pullari:[0,0]};
    ysess.forEach(s=>{ wkset.add(mon(s.session_date)); (s.prescribed_exercises||[]).forEach(ex=>{ const fk=guardFam(ex.name);
      (ex.prescribed_sets||[]).forEach(ps=>{ const r=ps.target_reps||0, p=ps.target_pct!=null?parseFloat(ps.target_pct):0; reps+=r;
        if(p){ vw+=p*r; pv+=r; if(p>=90&&p<=100) lifts90+=r; if(fk){ fam[fk][0]+=p*r; fam[fk][1]+=r; } } }); }); });
    const nWkY=Math.max(1,wkset.size); const meetsYr=meets.filter(m=>m.meet_date>=iso(yStart)).length;
    const famAri=k=>fam[k][1]?(fam[k][0]/fam[k][1])/100:null;
    const actual={ yearly:reps||null, weekly:reps?Math.round(reps/nWkY):null, lifts90:lifts90||null, ari:pv?vw/pv:null, meets:meetsYr, snari:famAri('snari'), cjari:famAri('cjari'), sqari:famAri('sqari') };
    const LBL={yearly:'Yearly loading (reps)',weekly:'Avg weekly volume',lifts90:'Lifts at 90–100% / yr',ari:'Avg intensity (ARI)',meets:'Meets / yr',snari:'Snatch ARI',cjari:'C&J ARI',sqari:'Squat ARI'};
    const fmtVal=(k,v)=>{ if(v==null) return '—'; if(k==='ari') return v.toFixed(1)+'%'; if(k==='snari'||k==='cjari'||k==='sqari') return v.toFixed(2); return Math.round(v).toLocaleString(); };
    const ov=(prof.bio&&prof.bio.guardrails)||{};
    const rows=GUARD_CHECK_KEYS.filter(k=>LBL[k]).map(k=>{ const band=parseBand(ov[k]||g[k]); const v=actual[k]; const f=gFlag(v,band);
      return { lbl:LBL[k], val:fmtVal(k,v), band:g[k]||'—', flag:f }; });
    const flagsN=rows.filter(r=>r.flag==='under'||r.flag==='over').length;
    redflags={ rank:cls.rank, rows, flags:flagsN };
  }
  // injury / pain over the range
  const pain = painAggregate(await loadPainRange(viewId, startStr, endStr));
  // vs-previous deltas for the executive KPI band (block basis lines up with a mesocycle review; falls back to rolling)
  let tr=null; try{ tr=await trainingResponse(viewId,{basis:'block'}); if(tr&&!tr.ok) tr=null; }catch(e){}
  const levelLbl = reportState.level==='meso'?'Mesocycle review':(reportState.level==='macro'?'Macrocycle review':'Progress report');
  const suggestedTitle = reportState.level==='meso'&&win.block ? (win.block.name+' — review') : levelLbl;
  return { prof, viewName, sex, age, teamName, gymName, maxesRows, maxMap, totM, cls, meets, eff:{groups:effRows(maxMap)}, method, buckets, bwPts, hasTrend, redflags, pain, tr, rangeLabel:win.label, startStr, endStr, level:reportState.level, block:win.block||null, levelLbl, suggestedTitle };
}

      <div class="rx-note">Programmed numbers vs. the loading norms for this class. Out-of-band rows are where the program differs from what's typical for the level.</div>`; };
  const mEff=()=>{ const rows=d.eff.groups.map(g=>{ const rs=g.rows.filter(r=>r.read); if(!rs.length) return '';
      return `<tr class="rx-grp"><td colspan="5">${esc(g.grp)}</td></tr>`+rs.map(r=>`<tr><td>${esc(r.mv)}</td><td class="num">${ev('eff:'+r.mv+':1rm', r.cur!=null?r.cur:'—')}</td><td class="num">${r.eff!=null?Math.round(r.eff*100)+'%':'—'}</td><td class="num">${Math.round(r.ratio*100)}%</td><td class="num"><span class="rx-read ${r.read}">${EFF_READLBL[r.read]}</span></td></tr>`).join(''); }).join('');
    const story=effStory(d.eff.groups);
    return `<h4 class="rx-mod">Lift efficiency — strengths &amp; weaknesses</h4>${rows?`<table class="rx-tbl"><thead><tr><th>Movement</th><th class="num">1RM</th><th class="num">Current</th><th class="num">Target</th><th class="num">Read</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="rx-note">Fill in the maxes to compute efficiency.</div>'}${story?`<div class="rx-story"><b>Story:</b> ${esc(story)}</div>`:''}`; };
  const mInjury=()=>{ const p=d.pain; if(p && p.list.length){ const watch=p.persistent.length?` <span class="rx-modsub">${p.persistent.length} to watch</span>`:'';
      return `<h4 class="rx-mod">Injury / pain${watch}</h4>${painPanelHTML(p,{name:d.viewName,limit:12,rangeLabel:d.rangeLabel})}<div class="rx-note">Athlete-reported pain over ${esc(d.rangeLabel).toLowerCase()}. “N wks” means it was flagged in that many separate weeks — a persistence signal.</div>`; }
    return `<h4 class="rx-mod">Injury / pain</h4><div class="rx-note">No pain reported over ${esc(d.rangeLabel).toLowerCase()} — nothing flagged on the body map.</div>`; };

  // module registry — the coach's group structure (reportState.groups) decides order/placement
  const MOD={ maxes:mMaxes, climb:mClimb, meets:mMeets, methodology:mMethod, trends:mTrends, redflags:mGuard, efficiency:mEff, injury:mInjury };
  const isNote=k=>typeof k==='string'&&k.indexOf('note:')===0;
  let chNo=0, body='';
  (reportState.groups||[]).forEach(g=>{ const active=(g.mods||[]).filter(k=>MOD[k]||isNote(k)); if(!active.length) return; chNo++;
    const inner=active.map(k=>`<div class="rx-module">${isNote(k)?noteHTML(k):MOD[k]()}</div>`).join('');
    body+=`<section class="rx-chapter"><div class="rx-chhead"><div class="rx-chnum">${String(chNo).padStart(2,'0')}</div><div><div class="rx-chtitle">${esc(g.name||'Section')}</div></div></div><div class="rx-pad">${inner}</div></section>`; });

  return `<div class="rptx${reportState.editMode?' rx-editing':''}" id="reportDoc" data-theme="${theme}">
    ${mast}${execSec}${body}
    <footer class="rx-foot"><span class="conf">Confidential</span><span>${esc(d.gymName)} · ${esc(d.viewName)} · ${esc(d.levelLbl)} · ${MONS[today.getMonth()]+' '+today.getDate()+', '+today.getFullYear()}</span></footer>
  </div>`;
}
function bandNote(rf,lbl){ if(!rf) return ''; const r=(rf.rows||[]).find(x=>x.lbl===lbl); if(!r) return ''; return r.flag==='in'?('In band ('+esc(r.band)+')'):(r.flag==='over'?'Above band':(r.flag==='under'?'Below band':'')); }
function reportHTML_legacy(d){
  const sec=k=>reportState.sections.includes(k);
  const today=new Date();
  const idChips=[ d.sex?(d.sex==='F'?'Female':'Male'):null, d.age!=null?'Age '+d.age:null,
    d.prof.weight_class?d.prof.weight_class+' kg class':null, d.prof.skill_level||null, d.prof.experience||null, d.teamName?('Team: '+d.teamName):null
  ].filter(Boolean).map(c=>`<span class="rpt-chip">${esc(c)}</span>`).join('');
  let body='';
  // Header (always)
  body+=`<div class="rpt-head">
    <div class="rpt-brand">${esc(d.gymName)} · ${esc(d.levelLbl||'Report')}</div>
    <div class="rpt-title" id="rptHdrTitle">${esc(reportState.title||'Athlete Report')}</div>
    <div class="rpt-ath">${esc(d.viewName)}</div>
    <div class="rpt-chips">${idChips||''}</div>
    <div class="rpt-meta">${esc(d.rangeLabel)} · ${fmtShort(d.startStr)} – ${fmtShort(d.endStr)} &nbsp;·&nbsp; generated ${MONS[today.getMonth()]+' '+today.getDate()+', '+today.getFullYear()}</div>
  </div>`;
  // Current maxes
  if(sec('maxes')){
    const row=lift=>{ const m=d.maxMap[normEx(lift)]; return `<tr><td>${esc(lift)}</td><td class="rpt-num">${m&&m.kg!=null?m.kg:'—'}</td></tr>`; };
    const tot=d.totM?`<tr class="rpt-tot"><td>Total (Sn + C&amp;J)</td><td class="rpt-num">${d.totM.total}</td></tr>`:'';
    body+=`<div class="rpt-section"><h3>Current maxes</h3>
      <div class="rpt-2col">
        <table class="rpt-tbl"><thead><tr><th>Lift</th><th class="rpt-num">1RM (kg)</th></tr></thead><tbody>${PF_MAXES_L.map(row).join('')}${tot}</tbody></table>
        <table class="rpt-tbl"><thead><tr><th>Lift</th><th class="rpt-num">1RM (kg)</th></tr></thead><tbody>${PF_MAXES_R.map(row).join('')}</tbody></table>
      </div></div>`;
  }
  // Classification — the climb
  if(sec('climb')){
    if(d.cls){
      const c=d.cls; const goal=c.nextRank?`Next: <b>${esc(c.nextRank)}</b> at <b>${c.nextTotal}kg</b> — <b>${c.toGo}kg</b> to go (${c.pct}%).`:'At the top of the standards.';
      const thr=`<table class="rpt-thr"><thead><tr>${c.ranks.map((r,i)=>`<th class="${i===c.rankIdx?'on':''}">${r==='Class III'?'III':r==='Class II'?'II':r==='Class I'?'I':r}</th>`).join('')}</tr></thead><tbody><tr>${c.thresholds.map((t,i)=>`<td class="${i===c.rankIdx?'on':''}">${t}</td>`).join('')}</tr></tbody></table>`;
      body+=`<div class="rpt-section"><h3>Classification — the climb</h3>
        <div class="rpt-line">Total <b>${d.totM.total}kg</b> (Sn ${d.totM.sn!=null?d.totM.sn:'—'} + CJ ${d.totM.cj!=null?d.totM.cj:'—'}) — current class <b>${esc(c.rank||'Below Class III')}</b>. ${goal}</div>
        <div class="rpt-prog"><i style="width:${c.pct}%"></i></div>
        ${thr}
        ${d.meets.length?climbSVG(d.meets,c):'<div class="rpt-note">Standard: '+esc(c.label||'')+'. Log meets to plot the total over time.</div>'}</div>`;
    } else {
      body+=`<div class="rpt-section"><h3>Classification — the climb</h3><div class="rpt-note">Add sex, weight class, and Snatch + C&amp;J maxes to compute classification.</div></div>`;
    }
  }
  // Lift efficiency
  if(sec('efficiency')){
    const story=effStory(d.eff.groups);
    const rows=d.eff.groups.map(g=>{ const rs=g.rows.filter(r=>r.read); if(!rs.length) return '';
      return `<tr class="rpt-grp"><td colspan="5">${esc(g.grp)}</td></tr>`+rs.map(r=>`<tr>
        <td>${esc(r.mv)}</td><td class="rpt-num">${r.cur!=null?r.cur:'—'}</td>
        <td class="rpt-num">${r.eff!=null?Math.round(r.eff*100)+'%':'—'}</td>
        <td class="rpt-num">${Math.round(r.ratio*100)}%</td>
        <td><span class="rpt-read ${r.read}">${EFF_READLBL[r.read]}</span></td></tr>`).join(''); }).join('');
    body+=`<div class="rpt-section"><h3>Lift efficiency — strengths &amp; weaknesses</h3>
      ${rows?`<table class="rpt-tbl rpt-eff"><thead><tr><th>Movement</th><th class="rpt-num">1RM</th><th class="rpt-num">Current</th><th class="rpt-num">Target</th><th>Read</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="rpt-note">Fill in the maxes to compute efficiency.</div>'}
      ${story?`<div class="rpt-story"><b>Story:</b> ${esc(story)}</div>`:''}</div>`;
  }
  // Methodology metrics
  if(sec('methodology')){
    const m=d.method;
    const tile=(v,l)=>`<div class="rpt-tile"><div class="v">${v}</div><div class="l">${l}</div></div>`;
    body+=`<div class="rpt-section"><h3>Methodology metrics <span class="rpt-sub">· ${esc(d.rangeLabel).toLowerCase()}</span></h3>
      <div class="rpt-tiles">
        ${tile(m.ari?Math.round(m.ari)+'%':'—','Avg intensity (ARI)')}
        ${tile(riDisplay(m.ri),'RI (effort)')}
        ${tile(m.inol?m.inol.toFixed(2):'—','INOL')}
        ${tile(m.peak?Math.round(m.peak)+'%':'—','Peak %')}
        ${tile((m.volPri!=null?m.volPri:m.vol)?(m.volPri!=null?m.volPri:m.vol).toLocaleString()+(m.volAcc?`<span class="rpt-acc">+${m.volAcc.toLocaleString()} acc</span>`:''):'—',m.volAcc?'Volume (NL) · primary':'Volume (NL)')}
        ${tile(m.weekly?m.weekly.toLocaleString():'—','Avg weekly NL · primary')}
        ${tile(m.l90?m.l90.toLocaleString():'—','Lifts 90–100%')}
        ${tile(m.sessLogged,'Sessions logged')}
        ${tile(m.tonnage?Math.round(m.tonnage).toLocaleString():'—','Tonnage (kg)')}
        ${tile(m.compPct!=null?m.compPct+'%':'—','Set completion')}
        ${tile(m.rdAvg!=null?m.rdAvg.toFixed(1):'—','Avg readiness')}
        ${tile(m.cleanPct!=null?m.cleanPct+'%':'—','Clean lifts')}
      </div>
      <div class="rpt-note">Intensity, RI, INOL and volume are from programmed work over the range; tonnage, completion, readiness and clean-lift rate are from what the athlete actually logged.</div></div>`;
  }
  // Trends
  if(sec('trends')){
    body+=`<div class="rpt-section"><h3>Trends</h3>
      ${d.hasTrend?`<div class="rpt-chart-cap">Training load &amp; readiness <span class="rpt-leg"><i style="background:#e8643c"></i>Volume (NL) <i style="background:#3ec97a"></i>Readiness</span></div>${homeTrendSVG(d.buckets)}`:'<div class="rpt-note">Volume &amp; readiness trend builds as training and check-ins are logged over the range.</div>'}
      ${d.bwPts.length>=2?`<div class="rpt-chart-cap" style="margin-top:14px">Bodyweight over time</div>${dashBWSVG(d.bwPts)}`:''}</div>`;
  }
  // Red flags / guardrails
  if(sec('redflags')){
    if(d.redflags){
      const r=d.redflags;
      const rows=r.rows.map(x=>{ const col=x.flag==='in'?'var(--good)':(x.flag==='na'?'var(--muted)':'var(--warn)'); const fl=x.flag==='in'?'in band':(x.flag==='under'?'under':(x.flag==='over'?'over':'—'));
        return `<tr><td>${esc(x.lbl)}</td><td class="rpt-num" style="color:${col}">${x.val}</td><td class="rpt-num rpt-sub">${esc(x.band)}</td><td class="rpt-num" style="color:${col};font-weight:800">${fl}</td></tr>`; }).join('');
      body+=`<div class="rpt-section"><h3>Training check — ${esc(r.rank)} guardrails <span class="rpt-sub">· ${r.flags?r.flags+' out of band':'all in band'}</span></h3>
        <table class="rpt-tbl"><thead><tr><th>Metric</th><th class="rpt-num">Last 52 wks</th><th class="rpt-num">Class band</th><th class="rpt-num">Flag</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="rpt-note">Last-52-week programmed numbers vs the loading norms for this athlete's class. Out-of-band rows are where the program differs from what's typical for the level.</div></div>`;
    } else {
      body+=`<div class="rpt-section"><h3>Training check — class guardrails</h3><div class="rpt-note">Set the athlete's classification to compare their programming against the class loading norms.</div></div>`;
    }
  }
  // Injury / pain
  if(sec('injury')){
    const p=d.pain;
    if(p && p.list.length){
      const watch=p.persistent.length?` <span class="rpt-sub">· ${p.persistent.length} to watch</span>`:'';
      body+=`<div class="rpt-section"><h3>Injury / pain${watch}</h3>
        ${painPanelHTML(p,{name:d.viewName,limit:12,rangeLabel:d.rangeLabel})}
        <div class="rpt-note">Athlete-reported pain over ${esc(d.rangeLabel).toLowerCase()}. Colour shows the most recent severity; “N wks” means it was flagged in that many separate weeks — a persistence signal worth a closer look.</div></div>`;
    } else {
      body+=`<div class="rpt-section"><h3>Injury / pain</h3><div class="rpt-note">No pain reported over ${esc(d.rangeLabel).toLowerCase()} — nothing flagged on the body map.</div></div>`;
    }
  }
  // Meet results
  if(sec('meets')){
    if(d.meets.length){
      const rows=d.meets.slice().reverse().map(m=>{ const tot=m.total!=null?m.total:((+m.best_snatch||0)+(+m.best_cj||0));
        return `<tr><td>${fmtShort(m.meet_date)} ’${String(new Date(m.meet_date+'T00:00:00').getFullYear()).slice(2)}</td><td>${esc(m.meet_name||'Meet')}</td><td class="rpt-num">${m.best_snatch!=null?m.best_snatch:'—'}</td><td class="rpt-num">${m.best_cj!=null?m.best_cj:'—'}</td><td class="rpt-num"><b>${tot}</b></td><td class="rpt-num">${m.bodyweight!=null?m.bodyweight:'—'}</td><td class="rpt-num">${m.placement?'#'+m.placement:'—'}</td></tr>`; }).join('');
      body+=`<div class="rpt-section"><h3>Meet results</h3>
        <table class="rpt-tbl"><thead><tr><th>Date</th><th>Meet</th><th class="rpt-num">Sn</th><th class="rpt-num">CJ</th><th class="rpt-num">Total</th><th class="rpt-num">BW</th><th class="rpt-num">Pl</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    } else {
      body+=`<div class="rpt-section"><h3>Meet results</h3><div class="rpt-note">No competition results logged yet.</div></div>`;
    }
  }
  // Coach summary (always rendered if selected, even empty, so coach can type live)
  if(sec('summary')){
    body+=`<div class="rpt-section rpt-summary"><h3>Coach summary</h3><div class="rpt-sumbody" id="rptSumBody">${esc(reportState.summary)||'—'}</div></div>`;
  }
  body+=`<div class="rpt-foot">${esc(d.gymName)} · ${esc(d.viewName)} · ${MONS[today.getMonth()]+' '+today.getDate()+', '+today.getFullYear()}</div>`;
  return `<div class="report" id="reportDoc">${body}</div>`;
}

async function reportBuildPreview(){
  if(reportState._busy) return; reportState._busy=true;
  const host=document.getElementById('reportPreview'); if(host) host.innerHTML=`<div class="card"><div class="spin">Building preview…</div></div>`;
  try{
    if(reportState.level==='week'){
      const w=await weekReview(reportState.athleteId);
      reportState._weekAuto=w.autoFocus; reportState._weekPeriod=w.periodKey;
      let override=null; try{ const r=await sb.from('coach_focus').select('focus').eq('athlete_id',reportState.athleteId).eq('scope','week').eq('period_key',w.periodKey).maybeSingle(); if(!r.error&&r.data&&r.data.focus&&r.data.focus.trim()) override=r.data.focus.trim(); }catch(e){}
      if(override && !(reportState.summary||'').trim()){ reportState.summary=override; const ta=document.getElementById('rptSummary'); if(ta) ta.value=override; reportSyncSummary(); }
      else reportApplyFocus(false);
      const nm=esc(((coachState.athletes||[]).find(a=>a.id===reportState.athleteId)||{}).full_name||'Athlete');
      const focusPreview=(reportState.summary||'').trim()||w.autoFocus;
      const h=document.getElementById('reportPreview');
      if(h) h.innerHTML=`<div class="card mreview"><div class="mrev-head"><h2>📋 What ${nm} sees · This week</h2>${override?'<span class="rpt-chip" style="border-color:var(--accent);color:var(--accent)">coach focus saved</span>':''}</div><div class="mrev-body">${w.statsHtml}<div class="mrev-focus coach"><span class="mrev-flbl">🎯 Focus from your coach</span> <span id="rptSumBody">${esc(focusPreview)}</span></div>${w.upNextHtml}</div></div>`;
      reportState._busy=false; return;
    }
    const d=await reportLoadData(reportState.athleteId);
    reportState._data=d;
    // default title from the level/block until the coach types their own
    if(!reportState.titleEdited){ reportState.title=d.suggestedTitle; const ti=document.getElementById('rptTitle'); if(ti) ti.value=d.suggestedTitle; reportSyncHeader(); }
    // auto-draft the focus (only fills when empty or still the previous auto-draft)
    reportApplyFocus(false);
    const h=document.getElementById('reportPreview'); if(h) h.innerHTML=reportHTML(d);
  }catch(e){ const h=document.getElementById('reportPreview'); if(h) h.innerHTML=`<div class="card"><div class="note" style="color:var(--bad)">Couldn't build the preview — ${esc(e.message||e)}</div></div>`; }
  reportState._busy=false;
}

function reportFileName(d){ const nm=(d.viewName||'athlete').replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,''); return nm+'_report_'+iso(new Date())+'.pdf'; }
function reportPdfWorker(node, d){
  return html2pdf().set({
    margin:[8,8,8,8],
    filename:reportFileName(d),
    image:{ type:'jpeg', quality:0.96 },
    // scrollX/Y:0 pin the capture to the document top — without this, html2canvas grabs from the
    // window's current scroll offset, so a coach who scrolled through the report before hitting
    // "Download PDF" gets that scroll distance baked in as blank space above the masthead (the
    // "bunch of open space" bug). Fixes the download for every browser without moving the view.
    html2canvas:{ scale:2, backgroundColor:(reportState.theme==='dark'?'#0A0E13':'#EEF1F4'), useCORS:true, logging:false, scrollX:0, scrollY:0 },
    jsPDF:{ unit:'mm', format:'letter', orientation:'portrait' },
    pagebreak:{ mode:['css','legacy'] }
  }).from(node);
}
function reportMsg(t,bad){ const m=document.getElementById('rptMsg'); if(m){ m.style.color=bad?'var(--bad)':'var(--good)'; m.textContent=t; } }

// strip the on-screen edit chrome (outlines, placeholders) so it never bakes into the PDF; returns a restore fn
function reportPrepPrint(node){ const wasEd=node.classList.contains('rx-editing'); node.classList.remove('rx-editing');
  const eds=node.querySelectorAll('[contenteditable]'); eds.forEach(e=>e.removeAttribute('contenteditable'));
  return ()=>{ if(wasEd) node.classList.add('rx-editing'); };
}
window.reportDownloadPDF=async()=>{
  const node=document.getElementById('reportDoc'); if(!node){ reportMsg('Build a preview first.',true); return; }
  if(!window.html2pdf){ reportMsg('PDF library still loading — try again in a second.',true); return; }
  reportMsg('Generating PDF…'); const restore=reportPrepPrint(node);
  try{ await reportPdfWorker(node, reportState._data||{viewName:'athlete'}).save(); reportMsg('PDF downloaded ✓'); }
  catch(e){ reportMsg('PDF failed — '+(e.message||e),true); }
  finally{ restore(); }
};

window.reportSaveSend=async()=>{
  const d=reportState._data; const node=document.getElementById('reportDoc');
  if(!d||!node){ reportMsg('Build a preview first.',true); return; }
  if(!window.html2pdf){ reportMsg('PDF library still loading — try again.',true); return; }
  reportMsg('Generating + sending…');
  const restore=reportPrepPrint(node);
  try{
    const blob=await reportPdfWorker(node,d).outputPdf('blob');
    const ts=Date.now(); const path=`${me_.gym_id}/${reportState.athleteId}/${ts}_report.pdf`;
    const up=await sb.storage.from('reports').upload(path, blob, { contentType:'application/pdf', upsert:false });
    if(up.error){ reportMsg('Upload failed — '+up.error.message,true); return; }
    const win=reportRangeFor();
    const ins=await sb.from('reports').insert({ gym_id:me_.gym_id, athlete_id:reportState.athleteId, title:reportState.title||(d.suggestedTitle||'Athlete Report'), level:reportState.level, block_name:(win.block?win.block.name:null), range_start:win.startStr, range_end:win.endStr, summary:reportState.summary||null, sections:reportState.sections, pdf_path:path, delivered:true }).select();
    if(ins.error){ reportMsg('Saved the PDF but the record failed — '+ins.error.message,true); return; }
    reportMsg('Sent to '+(d.viewName||'the athlete')+' ✓ — they\'ll see it on their Home.');
  }catch(e){ reportMsg('Send failed — '+(e.message||e),true); }
  finally{ restore(); }
};

window.athReportOpen=async(id, btn)=>{

/* ---------------- VBT parsing (velocity engine) ---------------- */
const LB2KG=0.45359237, IN2CM=2.54;
function vNum(v){ if(v==null||v==='') return null; const n=typeof v==='number'?v:parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function vDate(v){ if(v==null||v==='') return null;
  if(v instanceof Date){ return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0'); }
  const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return m[3]+'-'+String(+m[1]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');
  const d=new Date(s); return isNaN(d)?null:vDate(d); }
// figure out which brand a workbook came from, by its sheets/columns
function detectVbtSource(wb){
  const sheets=wb.SheetNames||[];
  if(sheets.includes('Velocity')){ const hdr=vbtHeaders(wb.Sheets['Velocity']); if(hdr.some(h=>/avg velocity/i.test(h))) return 'ovr'; }
  // Flex / Metric (single-sheet CSV) — detect by columns
  const first=wb.Sheets[sheets[0]]; const hdr=vbtHeaders(first);
  if(hdr.some(h=>/velocity/i.test(h)) && hdr.some(h=>/load|weight/i.test(h)) && hdr.some(h=>/exercise|movement|lift/i.test(h))){
    if(hdr.some(h=>/flex/i.test(h))) return 'flex';
    return 'metric'; // generic single-sheet velocity csv
  }
  return null;
}
function vbtHeaders(ws){ const j=XLSX.utils.sheet_to_json(ws,{header:1,range:0}); return (j[0]||[]).map(x=>String(x==null?'':x)); }
function pick(row, names){ for(const n of names){ for(const k of Object.keys(row)){ if(k.toLowerCase().trim()===n.toLowerCase()){ return row[k]; } } }
  for(const n of names){ for(const k of Object.keys(row)){ if(k.toLowerCase().includes(n.toLowerCase())){ return row[k]; } } } return undefined; }
// normalize any supported VBT workbook -> array of rep objects
function vbtParse(wb, source){
  source = source || detectVbtSource(wb);
  if(!source) return { source:null, reps:[] };
  const sheetName = (source==='ovr') ? 'Velocity' : wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval:null });
  const reps=[];
  rows.forEach(r=>{
    const ex = pick(r,['Exercise','Movement','Lift']); const dt = vDate(pick(r,['Date','Session Date','Timestamp']));
    const mv = vNum(pick(r,['Avg Velocity (m/s)','Mean Velocity','Avg Velocity','MPV (m/s)','Mean Velocity (m/s)','Velocity']));
    const pv = vNum(pick(r,['Peak Velocity (m/s)','Peak Velocity','Max Velocity']));
    if(!ex || !dt || (mv==null && pv==null)) return;
    let loadLb=vNum(pick(r,['Load (lb)','Weight (lb)','Load lb'])), loadKg=vNum(pick(r,['Load (kg)','Weight (kg)','Load kg']));
    if(loadLb==null && loadKg!=null) loadLb=loadKg/LB2KG;
    if(loadKg==null && loadLb!=null) loadKg=loadLb*LB2KG;
    const romIn=vNum(pick(r,['ROM (in)'])); const romCm=romIn!=null?romIn*IN2CM:vNum(pick(r,['ROM (cm)']));
    reps.push({ source, exercise:String(ex).trim(), lift_date:dt,
      set_no:vNum(pick(r,['Set #','Set'])), rep_no:vNum(pick(r,['Rep #','Rep'])),
      load_lb:loadLb!=null?Math.round(loadLb*100)/100:null, load_kg:loadKg!=null?Math.round(loadKg*100)/100:null,
      mean_vel:mv, peak_vel:pv,
      mean_power:vNum(pick(r,['Avg Power (W)','Mean Power'])), peak_power:vNum(pick(r,['Peak Power (W)','Peak Power'])),
      rom_cm:romCm!=null?Math.round(romCm*10)/10:null, duration_s:vNum(pick(r,['Duration (s)','Duration'])) });
  });
  return { source, reps };
}
// fetch a stored upload, parse it, write vbt_reps, mark processed
window.processUpload=async(id)=>{
  const f=(upState.files||[]).find(x=>x.id===id); if(!f) return;
  const msg=document.getElementById('upMsg'); const set=(c,t)=>{ if(msg){ msg.style.color=c; msg.textContent=t; } };
  if(typeof XLSX==='undefined'){ set('var(--bad)','Spreadsheet reader still loading — try again in a second.'); return; }
  set('', 'Reading '+f.file_name+'…');
  try{
    const sig=await sb.storage.from('uploads').createSignedUrl(f.file_path, 600);
    if(sig.error||!sig.data) { set('var(--bad)','Couldn’t open the file.'); return; }
    const buf=await (await fetch(sig.data.signedUrl)).arrayBuffer();
    const wb=XLSX.read(buf, { type:'array', cellDates:true });
    const { source, reps }=vbtParse(wb);
    if(!source || !reps.length){ set('var(--warn)','No velocity data recognized in that file. (Supported now: OVR exports.)'); return; }
    const athId=f.athlete_id||me_.id;
    await sb.from('vbt_reps').delete().eq('upload_id', id);          // reprocess-safe
    const payload=reps.map(r=>Object.assign({ gym_id:me_.gym_id, athlete_id:athId, upload_id:id }, r));
    for(let i=0;i<payload.length;i+=300){ const ins=await sb.from('vbt_reps').insert(payload.slice(i,i+300));
      if(ins.error){
        let diag=''; try{ const rr=await sb.rpc('app_role'); const gg=await sb.rpc('app_gym_id');
          diag=' · [you: role='+(rr.error?'err':JSON.stringify(rr.data))+', gym '+(gg.data===me_.gym_id?'matches':'MISMATCH (db='+JSON.stringify(gg.data)+' vs me='+JSON.stringify(me_.gym_id)+')')+', file owner='+JSON.stringify(athId)+']'; }catch(e){}
        set('var(--bad)','Save failed — '+ins.error.message+diag); return; }
    }
    const dates=[...new Set(reps.map(r=>r.lift_date))].sort();
    const exs=[...new Set(reps.map(r=>r.exercise))];
    await sb.from('uploads').update({ processed:true, kind:source, matched_date:dates[dates.length-1] }).eq('id', id);
    set('var(--good)','✓ Processed '+reps.length+' reps · '+exs.length+' exercise'+(exs.length>1?'s':'')+' · '+dates.length+' day'+(dates.length>1?'s':''));
    setTimeout(paintUploads, 900);
  }catch(e){ set('var(--bad)','Couldn’t read that file — '+(e.message||e)); }
};

async function renderAthlete(selDate){
  athState.screen='athlete';
  if(_alogPending && _alogPending.size) await alogFlush();   // persist any pending edits from the session we're leaving (curSession still points at it)
  _alogPending.clear(); if(_alogDbTimer){clearTimeout(_alogDbTimer);_alogDbTimer=null;} if(_alogTimer){clearTimeout(_alogTimer);_alogTimer=null;} _alogRestored=false;
  app.innerHTML = topbar('Athlete') + athNav('athlete') + `<div class="spin">Loading your week…</div>`;
  if(!(await requireSession())) return;
  const todayStr=iso(new Date());
  // Anchor the week on what the athlete should see NEXT: a passed-in date, else today if it has a session,
  // else the NEXT upcoming session (a program that starts later this/next week), else the most recent past
  // session. Previously this hardcoded the CURRENT week and, when it was empty, fell back to the LATEST
  // session ever — so a program written for next week jumped to its LAST day (Sat) instead of its start (Mon),
  // and a date passed from the Home preview / calendar was ignored because it wasn't in the current week.
  let anchor = (selDate && /^\d{4}-\d\d-\d\d$/.test(selDate)) ? selDate : null;
  if(!anchor){
    const { data: sdRows } = await sb.from('sessions').select('session_date')
      .eq('athlete_id', me_.id).neq('status','draft').order('session_date',{ascending:true});
    const dates=[...new Set((sdRows||[]).map(s=>s.session_date))];
    if(dates.includes(todayStr)) anchor=todayStr;
    else { const up=dates.filter(d=>d>todayStr), past=dates.filter(d=>d<todayStr);
      anchor = up[0] || (past.length?past[past.length-1]:todayStr); }
  }
  const mon=planMonday(new Date(anchor+'T00:00:00'));
  const wk=Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
  const wkIso=wk.map(iso);
  // the anchor week's sessions
  const { data: weekSess, error: wkErr } = await sb.from('sessions').select(SESSION_SELECT)
    .eq('athlete_id', me_.id).neq('status','draft').gte('session_date', wkIso[0]).lte('session_date', wkIso[6])
    .order('session_date',{ascending:true}).order('created_at',{ascending:true});
  if(wkErr){ app.innerHTML = topbar('Athlete') + athNav('athlete') + `<div class="card"><div class="empty" style="color:var(--bad)">⚠ Couldn't load your training — ${esc(wkErr.message)}. Pull to refresh or sign out and back in.</div></div>`; return; }

  if(!Object.keys(byDate).length){ app.innerHTML = topbar('Athlete') + athNav('athlete') + `<div class="card"><div class="empty">No session assigned yet — your coach will publish your training here.</div></div>`; return; }

    else rkState={ date:todayStr, id: rk?rk.id:null, savedToday: !!rk, open:false,

async function saveSession(quiet){
  const btn=document.getElementById('save'), msg=document.getElementById('savedmsg');
  const orig=btn?btn.textContent:'Submit session';
  if(_alogDbTimer){ clearTimeout(_alogDbTimer); _alogDbTimer=null; }   // fold any pending autosave into this explicit submit
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; } if(msg){ msg.style.color=''; msg.textContent=''; }
  const { data:{ user } } = await sb.auth.getUser();
  if(!user || user.id !== me_.id){
    if(btn){ btn.disabled=false; btn.textContent=orig; }
    if(msg){ msg.style.color='var(--bad)'; msg.textContent='⚠ Login mismatch — sign out and sign back in as this athlete.'; }
    return false;
  }
  try{
    for(const id in logState){
      const st=logState[id];
      const payload=setPayload(st);
      const res = st.logId
        ? await sb.from('logged_sets').update(payload).eq('id', st.logId).select()
        : await sb.from('logged_sets').insert(payload).select();
      if(res.error) throw res.error;
      if(!res.data || res.data.length===0) throw new Error('the database rejected the save (login). Sign out and back in.');
      st.logId = res.data[0].id;
    }
    _alogPending.clear(); alogClearDraft(); alogSetStatus('');   // everything is durable in the DB now
    if(btn){ btn.disabled=false; btn.textContent=orig; }
    if(!quiet && msg){ msg.style.color='var(--good)'; msg.textContent='✓ Submitted — your coach has it'; setTimeout(()=>{ if(msg) msg.textContent=''; },3500); }
    return true;
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent=orig; }
    if(msg){ msg.style.color='var(--bad)'; msg.textContent='⚠ Save failed — '+(e.message||e); }
    return false;
  }
}

// review artifacts older than 14 days (the coach's recording + voice note + drawings/notes + bar-path
// track). REVIEW-ONLY — the athlete's original lift clip (in the athlete's own folder) is left untouched.
// Runs once per session; fully guarded so a failure never breaks the console.
async function sweepOldReviews(){
  try{
    if(!VNOTES_READY || coachState._sweptReviews) return; coachState._sweptReviews=true;
    const cutoff=new Date(Date.now()-14*864e5).toISOString();
    const { data, error }=await sb.from('video_notes').select('id,video_path,payload,updated_at').lt('updated_at', cutoff).limit(100);
    if(error||!data||!data.length) return;
    const files=[], noteIds=[], clipPaths=[];
    for(const r of data){ const pl=r.payload||{};
      if(pl.reviewVideoPath) files.push(pl.reviewVideoPath);   // the coach's recorded review (big webm)
      if(pl.voicePath) files.push(pl.voicePath);
      noteIds.push(r.id); if(r.video_path) clipPaths.push(r.video_path); }
    // remove the review recording/voice files (coach-folder files); the athlete's original clip is NOT in this list
    if(files.length){ try{ await sb.storage.from('lift-videos').remove(files); }catch(e){} }
    if(clipPaths.length){ try{ await sb.from('video_tracks').delete().in('video_path', clipPaths); }catch(e){} }   // bar-path analysis = part of the review
    const del=await sb.from('video_notes').delete().in('id', noteIds).select('id');   // this is what drops them off each athlete's Home feed
    const n=(del&&del.data)?del.data.length:0;
    if(n>0) toast('Cleared '+n+' coach review'+(n>1?'s':'')+' older than 2 weeks to save space.');
  }catch(e){}
}

// rollup renderer: a compact one-line summary that expands into the full ranked list on click
function attnPaint(host, C){

  const collapsed=(conState.attnCollapsed!==false);   // default rolled up

  const head=`<div class="attn-head"><h2 class="attn-title" style="margin:0" onclick="attnToggle()"><span class="attn-caret">${collapsed?'▸':'▾'}</span> 🔎 Athletes to watch${flagged.length?` <span class="attn-count">${flagged.length}</span>`:''}</h2>${toggle}</div>`;
  if(collapsed){
    let sum;
    if(flagged.length){
      const names=flagged.slice(0,6).map(({a,tr})=>`<span class="attn-sumitem">${sevDot[tr.topSev]||'•'} ${esc(a.full_name)}</span>`).join('');

    } else {

    }

  }
  const recChips=(tr)=>{ const r=tr.rec; const c=[];

    if(r.srpeWeekly!=null) c.push(`<span class="attn-chip">load ${Math.round(r.srpeWeekly)}/wk</span>`);

      <div class="attn-chips">${recChips(tr)}</div></div>
    <span class="attn-go">›</span></div>`).join('');
  const footBits=[];
  if(onPlan.length) footBits.push(`🟢 ${onPlan.length} responding on plan`);
  if(noData.length) footBits.push(`○ ${noData.length} no recent data`);
  host.innerHTML=`<div class="card">${head}
    <div class="note sub" style="padding:2px 0 8px">Ranked by training-response + recovery signals over ${basis==='block'?'the current vs previous block':'the last 4 weeks vs the prior 4'}. Tap an athlete to open their full response panel.</div>
    ${flagged.length? rows : `<div class="note sub" style="padding:8px 0">Nobody's flagged right now — the whole roster is responding on plan. 🟢</div>`}
    ${footBits.length?`<div class="attn-foot">${footBits.join(' · ')}</div>`:''}
  </div>`;
}

/* ---- TEAMS tab ---- */
function teamAthCount(tid){ return (coachState.athletes||[]).filter(a=>a.team_id===tid).length; }
function teamProgram(team){
  const progs=conState._programs||[];
  let p=progs.find(pp=>pp.team_id===team.id && !pp.archived);
  if(p) return p;
  const athIds=new Set((coachState.athletes||[]).filter(a=>a.team_id===team.id).map(a=>a.id));
  const counts={}; (conState._assigns||[]).forEach(x=>{ if(athIds.has(x.athlete_id)) counts[x.program_id]=(counts[x.program_id]||0)+1; });
  let best=null,bn=0; Object.keys(counts).forEach(pid=>{ if(counts[pid]>bn){ bn=counts[pid]; best=pid; } });
  return best ? progs.find(pp=>pp.id===best) : null;
}
function teamScore(team){
  const rdy=(conState._stats||{}).rdyByAth||{};
  const vals=(coachState.athletes||[]).filter(a=>a.team_id===team.id).map(a=>rdy[a.id]).filter(v=>v!=null);
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*20) : null;
}
function scoreColor(s){ return s>=80?'var(--good)':(s>=60?'var(--warn)':'var(--bad)'); }
function teamBuffer(p){ if(!p) return ''; const u=pubInfo(progDerive(p));
  if(u.bufWks>0) return ` · <span class="bufmini">+${u.bufDays}d ready</span>`;
  if(u.built>=u.wks && u.pub>=u.wks) return ` · <span class="bufmini" style="color:var(--good)">fully published</span>`;
  return ` · <span class="bufmini" style="color:var(--muted)">no buffer</span>`;
}
function teamProgHtml(team){ const p=teamProgram(team); return p ? `<span class="tm-prog">${esc(p.name)}</span>${teamBuffer(p)}` : `<span style="color:var(--warn)">none assigned</span>`; }
function teamNextComp(team){
  if(!team.next_comp) return '—';
  let d=''; if(team.next_comp_date){ const dt=new Date(team.next_comp_date+'T00:00:00'); d=' · '+MONS[dt.getMonth()]+' '+dt.getDate(); }
  return esc(team.next_comp)+d;
}

/* ================= PROGRAMS (build once → stamp onto athletes) ================= */
function mondayOfDate(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function weekIdxInBlock(block, dateStr){
  const m0=mondayOfDate(new Date(block.start_date+'T00:00:00'));
  const m=mondayOfDate(new Date(dateStr+'T00:00:00'));
  return Math.round((m-m0)/(7*864e5));
}
window.saveBlockAsProgram=async function(){
  if(!cw || !cw.block){ toast('No training block is set for this week. Define a block first (✎ edit on the block banner).'); return; }
  if(ed && ed.dirty){ toast('Save your current changes first, then save the block as a program.'); return; }
  const block=cw.block;
  // fetch every session in the block for this athlete
  const { data: sess, error } = await sb.from('sessions')
    .select(SESSION_SELECT)
    .eq('athlete_id', cw.athId).gte('session_date', block.start_date).lte('session_date', block.end_date)
    .order('session_date',{ascending:true}).order('created_at',{ascending:true});
  if(error){ toast('Could not read the block — '+error.message); return; }
  const sessions=(sess||[]).filter(s=>(s.prescribed_exercises||[]).length);
  if(!sessions.length){ toast('This block has no programmed sessions to save yet.'); return; }
  const days=sessions.map(s=>({
    wk: Math.max(0, weekIdxInBlock(block, s.session_date)),
    dow: (new Date(s.session_date+'T00:00:00').getDay()+6)%7,
    title: s.title||'Training',
    exercises: (s.prescribed_exercises||[]).slice().sort(sortByPos).map(ex=>({
      name: ex.name, category: ex.category||'primary', load_type: ex.load_type||'percentage',
      cues: Array.isArray(ex.cues)?ex.cues:null, coach_note: ex.coach_note||null,
      sets: (ex.prescribed_sets||[]).slice().sort(sortByPos).map(ps=>({
        reps: ps.target_reps, pct: ps.target_pct!=null?parseFloat(ps.target_pct):null,
        vel: ps.target_vel!=null?parseFloat(ps.target_vel):null, eff: ps.target_eff!=null?parseFloat(ps.target_eff):null,
        kg: (ex.load_type==='weight' && ps.target_kg!=null)?parseFloat(ps.target_kg):null }))
    }))
  }));
  const weeksN=Math.max.apply(null, days.map(d=>d.wk+1).concat([1]));
  window._pgCapture={ name: block.name+' — program', phase: block.phase||null, weeks: weeksN, wave: block.wave||null, data:{days} };
  ovModal('pgSaveModal', `
    <div class="ov-hd"><h2 style="margin:0">⊞ Save block as program</h2><span class="vid-x" onclick="document.getElementById('pgSaveModal').style.display='none'">✕</span></div>
    <div class="sub" style="margin:6px 0 12px">Captured <b>${sessions.length} day${sessions.length===1?'':'s'}</b> across <b>${weeksN} week${weeksN===1?'':'s'}</b> (reps, %1RM/velocity, cues & notes). Loads re-price off each athlete's maxes when you stamp it.</div>
    <div class="bf-row"><input id="pgName" value="${esc(window._pgCapture.name)}" placeholder="Program name" style="flex:1;min-width:240px;font-weight:700;font-size:15px"></div>
    <div class="bf-row" style="margin-top:12px"><button class="btn" onclick="doSaveProgram()">Save to program library</button>
      <span class="saved" id="pgSaveMsg"></span></div>`);
};
window.doSaveProgram=async function(){
  const name=(document.getElementById('pgName').value||'').trim(); if(!name){ document.getElementById('pgName').focus(); return; }
  const c=window._pgCapture;
  const res=await sb.from('programs').insert({ gym_id:me_.gym_id, name, phase:c.phase, weeks:c.weeks, wave:c.wave, data:c.data }).select();
  if(res.error||!res.data||!res.data.length){ const m=document.getElementById('pgSaveMsg'); if(m){m.style.color='var(--bad)';m.textContent='Save failed — '+(res.error?res.error.message:'try again');} return; }
  document.getElementById('pgSaveModal').style.display='none';
  conState._programs=undefined; edMsgSet&&edMsgSet('✓ Saved "'+name+'" to your program library','var(--good)');

async function loadAssignments(){
  const { data, error } = await sb.from('program_assignments').select('*').eq('status','active');
  conState._assigns = error ? [] : (data||[]);
  return conState._assigns;
}
function asgProgress(a){
  const start=mondayOfDate(new Date(a.start_date+'T00:00:00'));
  const wks=a.weeks||1;
  const elapsed=Math.round((mondayOfDate(new Date())-start)/(7*864e5));
  if(elapsed<0) return {label:'starts '+a.start_date, upcoming:true};
  const wk=elapsed+1;
  if(wk>wks) return {label:'completed', done:true};
  return {label:'wk '+wk+'/'+wks};
}
async function loadProgramsRich(){
  if(conState._programs===undefined) await loadPrograms();
  if(conState._programs===null) return null;
  if(conState._assigns===undefined) await loadAssignments();
  if(conState._teams===undefined){ const { data:tms } = await sb.from('teams').select('*').order('name'); conState._teams=tms||[]; }
  if(conState._progSess===undefined){
    const ids=(conState._programs||[]).map(p=>p.id);
    let sess=[];
    if(ids.length){ const r=await sb.from('sessions').select('program_id,athlete_id,session_date,status').in('program_id', ids); if(!r.error) sess=r.data||[]; }
    conState._progSess=sess;
  }
  return conState._programs;
}
function teamNameById(id){ const t=(conState._teams||[]).find(x=>x.id===id); return t?t.name:null; }
function progAudience(p, assigns){
  if(p.team_id){ const n=teamNameById(p.team_id); if(n) return n; }
  const teamIds=new Set(); assigns.forEach(a=>{ const ath=(coachState.athletes||[]).find(x=>x.id===a.athlete_id); if(ath&&ath.team_id) teamIds.add(ath.team_id); });
  if(teamIds.size===1){ const n=teamNameById(Array.from(teamIds)[0]); if(n) return n; }
  return assigns.length ? 'Individual' : '—';
}
function progEdited(p, status){
  if(status==='draft') return 'Draft';
  const ts=p.updated_at||p.created_at;
  if(status==='arch') return 'Archived'+(p.updated_at?' · '+relTime(p.updated_at):'');
  return ts ? 'Edited '+relTime(ts) : 'Edited recently';
}
function progDerive(p){
  const assigns=(conState._assigns||[]).filter(a=>a.program_id===p.id);
  const status = p.archived ? 'arch' : (assigns.length ? 'active' : 'draft');
  const wks=p.weeks||1;
  let cur=0;
  if(assigns.length){
    const minStart=Math.min.apply(null, assigns.map(a=>mondayOfDate(new Date(a.start_date+'T00:00:00')).getTime()));
    const elapsed=Math.round((mondayOfDate(new Date())-minStart)/(7*864e5));
    cur=Math.max(0, Math.min(wks, elapsed+1));
  }
  const startByAth={}; assigns.forEach(a=>startByAth[a.athlete_id]=mondayOfDate(new Date(a.start_date+'T00:00:00')).getTime());
  const pubWeeks=new Set();
  (conState._progSess||[]).forEach(s=>{ if(s.program_id!==p.id||s.status!=='published') return; const st=startByAth[s.athlete_id]; if(st==null) return;
    const wk=Math.round((mondayOfDate(new Date(s.session_date+'T00:00:00'))-st)/(7*864e5)); if(wk>=0&&wk<wks) pubWeeks.add(wk); });
  return { id:p.id, name:p.name, phase:p.phase||'', wks, status, team:progAudience(p,assigns), athletes:assigns.length, edited:progEdited(p,status), built:wks, pub:pubWeeks.size, cur };
}
function pubInfo(d){ let wks=d.wks||0, built=Math.min(d.built==null?wks:d.built, wks), pub=Math.min(d.pub||0, built); const bufWks=built-pub; return {wks,built,pub,bufWks,bufDays:bufWks*7}; }
function pubMeter(d){ const u=pubInfo(d); if(!u.wks) return '';
  const live=Math.round(u.pub/u.wks*100), buf=Math.round(u.bufWks/u.wks*100);
  return `<div class="pub-bar">${live>0?`<span class="pub-live" style="width:${live}%"></span>`:''}${buf>0?`<span class="pub-buf" style="width:${buf}%"></span>`:''}</div>
    <div class="pub-legend"><span class="lg-live"><i></i>${u.pub}w published</span>${u.bufWks>0?`<span class="lg-buf"><i></i>${u.bufWks}w built ahead</span>`:''}${u.built<u.wks?`<span class="lg-un"><i></i>${u.wks-u.built}w unwritten</span>`:''}</div>`;
}
function pubChip(d){ const u=pubInfo(d);
  if(d.status==='draft') return `<div class="bufchip draftb">● Draft — ${u.built}w (${u.built*7}d) written, unpublished</div>`;
  if(d.status==='arch') return '';
  if(u.bufWks>0) return `<div class="bufchip ready">+${u.bufDays}d ready to publish (${u.bufWks}w built ahead)</div>`;
  if(u.built>=u.wks) return `<div class="bufchip full">✓ Fully published</div>`;
  return `<div class="bufchip none">No buffer — build next week</div>`;
}
function listPubNote(d){ const u=pubInfo(d);
  if(d.status==='draft') return `<span class="bufmini" style="color:var(--warn)">Draft · ${u.built*7}d written</span>`;
  if(d.status==='arch') return esc(d.edited);
  if(u.bufWks>0) return `<span class="bufmini">+${u.bufDays}d ready</span>`;
  return esc(d.edited);
}
const PROG_BLABEL={active:'Active',draft:'Draft',arch:'Archived'};
function progSendBtn(d, mini){
  if(d.status==='arch') return `<span class="${mini?'ropen':'extool'}" style="color:var(--muted)" onclick="event.stopPropagation();conRestoreProgram('${d.id}')">↩ Restore</span>`;
  const lbl = (d.team && d.team!=='Individual' && d.team!=='—' && !mini) ? 'Send to '+esc(d.team) : 'Send';
  return mini
    ? `<span class="ropen" onclick="event.stopPropagation();stampProgram('${d.id}')">📤 Send</span>`
    : `<span class="cbtn alt" style="padding:6px 12px" onclick="event.stopPropagation();stampProgram('${d.id}')">📤 ${lbl}</span>`;
}
function progGridCard(d){

    ${d.status!=='arch'?pubMeter(d)+pubChip(d):''}

}
function progRow(d){

}
function progDerivedList(){
  const q=(conState.progQ||'').toLowerCase();
  const filt=conState.progFilter||'all';
  const order={active:0,draft:1,arch:2};
  return (conState._programs||[]).map(progDerive)
    .filter(d=> (filt==='all'||d.status===filt) && (!q||d.name.toLowerCase().indexOf(q)>-1))
    .sort((a,b)=> (order[a.status]-order[b.status]) || a.name.localeCompare(b.name));
}
function renderProgramsBody(){
  const host=document.getElementById('progBody'); if(!host) return;

  const list=progDerivedList();
  if(!list.length){ host.innerHTML='<div class="con-empty">No programs match — “+ New program” to build one.</div>'; return; }
  host.innerHTML = view==='list'
    ? `<div class="clist">${list.map(progRow).join('')}</div>`
    : `<div class="cgrid">${list.map(progGridCard).join('')}</div>`;
}

  } else {
    const athletes=coachState.athletes||[];

window.doStamp=async function(id){
  const p=(conState._programs||[]).find(x=>x.id===id); if(!p) return;
  const start=document.getElementById('stampStart').value;
  let targets=[];
  if(window._stampMode==='team'){
    const teamId=document.getElementById('stampTeam').value;
    targets=(coachState.athletes||[]).filter(a=>a.team_id===teamId).map(a=>a.id);
    if(!targets.length){ const m=document.getElementById('stampMsg'); if(m){m.style.color='var(--warn)';m.textContent='That team has no athletes yet.';} return; }
  } else {
    targets=[document.getElementById('stampAth').value];
  }
  const msg=document.getElementById('stampMsg');
  // re-stamp guard: warn before silently creating a SECOND set of draft sessions
  const existRes = await sb.from('program_assignments').select('athlete_id').eq('program_id', p.id).in('athlete_id', targets);
  if(existRes.error){ if(msg){ msg.style.color='var(--bad)'; msg.textContent='Could not check for existing assignments — '+existRes.error.message+'. Try again.'; } return; }   // don't silently skip the duplicate guard
  const dupAths=[...new Set((existRes.data||[]).map(a=>a.athlete_id))];
  if(dupAths.length && !window._stampConfirmed){
    const names=dupAths.map(aid=>((coachState.athletes||[]).find(a=>a.id===aid)||{}).full_name||'athlete');
    const who = window._stampMode==='team' ? (dupAths.length+' of '+targets.length+' athlete'+(targets.length===1?'':'s')) : (names[0]||'this athlete');
    if(msg){ msg.style.color=''; msg.innerHTML=`<div class="stamp-warn">⚠ <b>${esc(who)}</b> already ${dupAths.length===1?'has':'have'} <b>${esc(p.name)}</b> stamped — re-stamping creates a <b>second</b> set of draft sessions (duplicates).
      <div class="stamp-warn-row">${PROG_ID_READY?`<button class="btn" onclick="window._stampConfirmed='replace';doStamp('${id}')">Replace old drafts &amp; re-stamp</button>`:''}<button class="btn ghost" onclick="window._stampConfirmed='add';doStamp('${id}')">${PROG_ID_READY?'Keep both':'Stamp anyway'}</button><button class="btn ghost" onclick="document.getElementById('stampMsg').innerHTML=''">Cancel</button></div></div>`; }
    return;
  }
  if(msg){ msg.style.color=''; msg.textContent='Stamping…'; }
  const btn=document.querySelector('#stampModal .btn'); if(btn) btn.disabled=true;
  // "Replace" → clear each duplicated athlete's existing DRAFT sessions for this program first (never touches published/logged)
  if(window._stampConfirmed==='replace' && PROG_ID_READY){
    for(const aid of dupAths){ try{ await deleteProgramDrafts(aid, p.id); }catch(_){} }
  }
  const startMon=mondayOfDate(new Date(start+'T00:00:00'));
  let athDone=0, totalSessions=0;
  try{
    for(const athId of targets){
      const { data: mx } = await sb.from('maxes').select('lift,kg').eq('athlete_id', athId);
      const maxes={}; (mx||[]).forEach(m=>maxes[m.lift]=parseFloat(m.kg));
      for(const day of (p.data.days||[])){
        const d=new Date(startMon); d.setDate(d.getDate()+ (day.wk||0)*7 + (day.dow||0));
        const sIns={ gym_id:me_.gym_id, athlete_id:athId, session_date:iso(d), title:day.title||'Training', status:'draft' };
        if(PROG_ID_READY) sIns.program_id=p.id;
        const { data: ns, error: se } = await sb.from('sessions').insert(sIns).select().single();
        if(se) throw se;
        let pos=0;
        for(const ex of (day.exercises||[])){
          const exIns={ gym_id:me_.gym_id, session_id:ns.id, position:pos++, name:ex.name, category:ex.category||'primary', coach_note:ex.coach_note||null };
          if(LT_READY){ exIns.load_type=ex.load_type||'percentage'; exIns.cues=ex.cues||null; }
          const { data: ne, error: ee } = await sb.from('prescribed_exercises').insert(exIns).select().single(); if(ee) throw ee;
          const orm=(ex.load_type||'percentage')==='percentage'?ormLookup(ex.name, maxes):null;
          const rows=(ex.sets||[]).map((s,si)=>{ const kg=(s.kg!=null&&s.kg!=='')?s.kg:((s.pct!=null&&orm)?Math.round(orm*s.pct/100):null);
            const st={reps:s.reps,pct:s.pct,kg,vel:s.vel,eff:s.eff};
            const row={ gym_id:me_.gym_id, exercise_id:ne.id, position:si,
              target_reps:s.reps!=null?s.reps:null, target_pct:s.pct!=null?s.pct:null, target_kg:st.kg,
              target_text:targetText({reps:s.reps==null?'':s.reps,pct:s.pct==null?'':s.pct,kg:st.kg==null?'':st.kg,vel:s.vel==null?'':s.vel,eff:s.eff==null?'':s.eff}, ex.load_type||'percentage') };
            if(LT_READY){ row.target_vel=s.vel!=null?s.vel:null; row.target_eff=s.eff!=null?s.eff:null; } return row; });
          if(rows.length){ const { error: re } = await sb.from('prescribed_sets').insert(rows); if(re) throw re; }
        }
        totalSessions++;
      }
      await sb.from('program_assignments').upsert({ gym_id:me_.gym_id, program_id:p.id, athlete_id:athId, start_date:start, weeks:p.weeks||1, status:'active' }, { onConflict:'program_id,athlete_id' });
      athDone++;
      if(msg) msg.textContent='Stamping… '+athDone+'/'+targets.length;
    }
    conState._assigns=undefined; conState._progSess=undefined;
    const replaced = window._stampConfirmed==='replace';
    window._stampConfirmed=null;
    const who = window._stampMode==='team'
      ? (athDone+' athlete'+(athDone===1?'':'s'))
      : (((coachState.athletes||[]).find(a=>a.id===targets[0])||{}).full_name || 'athlete');
    if(btn) btn.disabled=false;
    if(msg){ msg.style.color='var(--good)'; msg.innerHTML='✓ '+(replaced?'Re-stamped':'Stamped')+' <b>'+esc(p.name)+'</b> onto '+esc(who)+' — '+totalSessions+' draft session'+(totalSessions===1?'':'s')+' created. Open them in Coach View to review &amp; publish.'; }
    setTimeout(()=>{ const mm=document.getElementById('stampModal'); if(mm) mm.style.display='none'; if(coachState.screen==='console' && conState.tab==='programs') renderConBody(); }, 1900);
  }catch(e){ window._stampConfirmed=null; if(btn) btn.disabled=false; if(msg){ msg.style.color='var(--bad)'; msg.textContent='Stamp failed — '+(e.message||e); } }
};
// delete an athlete's existing DRAFT sessions for a program (used by re-stamp "Replace"); leaves published/logged alone
async function deleteProgramDrafts(athId, programId){
  const { data: ss } = await sb.from('sessions').select('id').eq('athlete_id', athId).eq('program_id', programId).eq('status','draft');
  const ids=(ss||[]).map(s=>s.id); if(!ids.length) return;
  const { data: ex } = await sb.from('prescribed_exercises').select('id').in('session_id', ids);
  const exIds=(ex||[]).map(e=>e.id);
  if(exIds.length) await sb.from('prescribed_sets').delete().in('exercise_id', exIds);
  await sb.from('prescribed_exercises').delete().in('session_id', ids);
  await sb.from('sessions').delete().in('id', ids);
}

let pbState=null; // {id,name,phase,weeks,wave,days:[{wk,dow,title,exercises:[{name,category,load_type,cues,coach_note,sets:[{reps,pct,vel,eff,kg}]}]}],wk}

function pbNum(v){ if(v===''||v==null) return null; const n=parseFloat(v); return isNaN(n)?null:n; }
function pbNormWave(wave, n){ const w=Array.isArray(wave)?wave:[]; return Array.from({length:n},(_,i)=>WAVE_LV[w[i]]?w[i]:'moderate'); }

window.pbWeeks=(delta)=>{

  const warn=document.getElementById('pbWksWarn');
  if(n<pbState.weeks && pbState.days.some(d=>d.wk>=n)){
    if(window._pbShrinkTo!==n){   // inline confirm — no native confirm() (browsers can mute it → silent no-op)
      window._pbShrinkTo=n;
      if(warn) warn.innerHTML=`⚠ Removing week ${n+1}+ deletes those days. <button class="btn ghost" style="padding:2px 9px;font-size:11px" onclick="pbWeeks(${delta})">Remove</button> <button class="btn ghost" style="padding:2px 9px;font-size:11px" onclick="window._pbShrinkTo=null;this.parentNode.innerHTML=''">Cancel</button>`;
      return;
    }
    window._pbShrinkTo=null;
    pbState.days=pbState.days.filter(d=>d.wk<n);

  else { pbState=null; conState.tab='programs'; coachState.screen='console'; renderConsole(); }
};

let pvState=null; // {id, prog, view:'month'|'week'|'day', wk, dayKey}
function ltLabel(v){ const m=PB_LT.find(x=>x[0]===v); return m?m[1]:(v||'%1RM'); }
function pgSetText(s, lt){
  lt=lt||'percentage'; const has=(x)=>x!=null&&x!==''; const r=has(s.reps)?s.reps:'?';
  if(lt==='vbt')    return r+(has(s.vel)?' @ ≥'+s.vel+' m/s':' · VBT');
  if(lt==='weight') return r+(has(s.kg)?' × '+s.kg+'kg':' reps');
  if(lt==='rpe')    return r+(has(s.eff)?' @ RPE '+s.eff:' reps');
  if(lt==='rir')    return r+(has(s.eff)?' @ '+s.eff+' RIR':' reps');
  if(lt==='open')   return (has(s.reps)?s.reps+' reps':'open')+' · open';

  for(const t of planState.tracks.filter(t=>t.plan_id===pid)){
    const nt=await sb.from('plan_tracks').insert({gym_id:me_.gym_id,plan_id:newId,grp:t.grp,name:t.name,sort_order:t.sort_order}).select();
    if(!nt.error&&nt.data&&nt.data.length){ const segs=planState.segments.filter(s=>s.track_id===t.id).map(s=>({gym_id:me_.gym_id,track_id:nt.data[0].id,label:s.label,color:s.color,start_date:s.start_date,end_date:s.end_date})); if(segs.length) await sb.from('plan_segments').insert(segs); }
  }
  await sb.from('plan_assignments').insert({gym_id:me_.gym_id,plan_id:newId,athlete_id:athId});                 // put her on the copy
  await sb.from('plan_assignments').insert({gym_id:me_.gym_id,plan_id:pid,athlete_id:athId,muted:true});        // and off the source (no double-up)

};

function planScopeBanner(){

function renderMacro(){

  if(window.mclClearDelBar) mclClearDelBar();   // drop any stale lasso bar when the macrocycle re-renders
  const ath=planIsAth();
  const y=planState.year, N=planWeeksInYear(), start=planYearStart(), td=new Date();
  const esq=(t)=>esc(t).replace(/'/g,"\\'");
  const col=(dateStr)=>Math.max(0,Math.min(N-1,planWeekIdx(dateStr)));
  const todayWk = (planMonday(td)>=start && planMonday(td)<=planMonday(new Date(y,11,31))) ? planWeekIdx(iso(td)) : -1;
  if(planState.selWk==null) planState.selWk = (todayWk>=0&&todayWk<N)?todayWk:0;

  const mesoScoped=planScopedPhases().filter(p=>(p.level||'meso')==='meso');
  const phaseAt=(i)=>mesoScoped.find(p=> col(p.start_date)<=i && i<=col(p.end_date));
  const T_=planState.athleteId?planTeamOf(planState.athleteId):null;
  const comps=planScopedComps().map(c=>({id:c.id,name:c.name,kind:c.kind,comp_date:c.comp_date,own:(!!planState.athleteId && c.athlete_id===planState.athleteId)}));
  const _cpPids=planState.athleteId?activePlanIds(planState.athleteId):null, _cpHid=planState.athleteId?hiddenSet(planState.athleteId,'event'):null;
  const compEv=planState.events.filter(e=>e.kind==='competition' && (

    : planState.athleteId ? (!_cpHid.has(e.id) && (e.athlete_id===planState.athleteId || (e.plan_id&&_cpPids.has(e.plan_id)) || (isLegacyShared(e)&&(!e.team_id||e.team_id===T_))))
    : (isLegacyShared(e)&&(!planState.teamId||!e.team_id||e.team_id===planState.teamId))

  const allComps=comps.concat(compEv).filter(c=>{const i=planWeekIdx(c.comp_date);return i>=0&&i<N;});

  const segEditable=(seg)=> !ath && (seg.src==='own' || !planState.athleteId);

  const segOverridable=(seg)=> !ath && !!planState.athleteId && seg.src==='inherit';
  const segClickable=(seg)=> segEditable(seg) || segOverridable(seg);
  const segClick=(seg)=> segEditable(seg)?` onclick="planEditPhase('${seg.id}')"` : (segOverridable(seg)?` onclick="planOverrideOpen('phase','${seg.id}')"`:'');

  const bandRow=(lvl)=>planBandSegments(lvl).map(seg=>{ const c=bandColor(lvl,seg.kind); const nm=esc(seg.name||bandLabel(lvl,seg.kind));
    return `<div class="mc2-seg${seg.src==='own'?' mc2-own':''}" style="grid-column:${seg.c0+1}/${seg.c1+2};${tintStyle(c)}${segClickable(seg)?'':';cursor:default'}"${segClick(seg)}${segEditable(seg)?` data-mlasso data-mkind="phase" data-mid="${seg.id}"`:''} title="${nm} · ${bandLabel(lvl,seg.kind)}${segOverridable(seg)?' · click to customize for this athlete':''}">${seg.src==='own'?'◆ ':''}${nm}</div>`; }).join('');
  const phaseRow=bandRow('phase');

    while(mi+span<N){ const d2=planWkDate(mi+span); d2.setDate(d2.getDate()+3); if(d2.getMonth()!==mon) break; span++; }
    monthCells+=`<div class="mc2-cell mc2-mon" style="grid-column:span ${span}">${MONS[mon]}</div>`; mi+=span; }
  // microcycle
  let wkCells=''; for(let i=0;i<N;i++) wkCells+=`<div class="mc2-cell mc2-wk${i===todayWk?' today':''}" onclick="planSelWk(${i})"${i===planState.selWk?' style="box-shadow:inset 0 0 0 1px var(--accent2)"':''}>${i+1}</div>`;
  // mesocycle
  const mesoRow=planBandSegments('meso').map(seg=>{ const ck=PHASE_COLORKEY[seg.kind]||'green'; return `<div class="mc2-seg${seg.src==='own'?' mc2-own':''}" style="grid-column:${seg.c0+1}/${seg.c1+2};${tintStyle(segColor(ck))}${segClickable(seg)?'':';cursor:default'}"${segClick(seg)}${segEditable(seg)?` data-mlasso data-mkind="phase" data-mid="${seg.id}"`:''} title="${esc(seg.name)} · ${phaseLabel(seg.kind)}${segOverridable(seg)?' · click to customize for this athlete':''}">${seg.src==='own'?'◆ ':''}${esc(seg.name)}</div>`; }).join('');
  // comps

function expandOccurrences(startISO, unit, interval, untilISO){
  if(!unit) return [startISO];

window.planSaveEvent=async(id)=>{
  const title=(document.getElementById('ceTitle').value||'').trim(); const msg=document.getElementById('ceMsg');
  if(!title){ document.getElementById('ceTitle').focus(); return; }
  const date=document.getElementById('ceDate').value; if(!date){ if(msg){msg.style.color='var(--warn)';msg.textContent='Pick a start date.';} return; }
  const ath=planIsAth(); const teamEl=document.getElementById('ceTeam');
  const payload={ title, kind:document.getElementById('ceType').value, start_date:date, days:+document.getElementById('ceDays').value||1, team_id: ath ? null : (teamEl?teamEl.value||null:null) };
  // recurrence rule
  const rv=(document.getElementById('ceRecur')||{}).value||'none';
  let recur_unit=null, recur_interval=1, recur_until=null;
  if(rv!=='none'){
    if(rv==='daily') recur_unit='day';
    else if(rv==='weekly') recur_unit='week';
    else if(rv==='monthly') recur_unit='month';
    else { recur_unit=document.getElementById('ceUnit').value; recur_interval=Math.max(1,+document.getElementById('ceEvery').value||1); }
    recur_until=document.getElementById('ceUntil').value||null;
    if(recur_until && recur_until<date){ if(msg){msg.style.color='var(--warn)';msg.textContent='“Until” must be on or after the start date.';} return; }
  }
  payload.recur_unit=recur_unit; payload.recur_interval=recur_interval; payload.recur_until=recur_until;
  if(ath) payload.athlete_id=me_.id;   // athlete events belong to them (RLS: athlete write own events)
  if(!id && !ath && planState.planId){ payload.plan_id=planState.planId; payload.team_id=null; }   // building into a named plan
  let res; if(id) res=await sb.from('calendar_events').update(payload).eq('id',id).select(); else res=await sb.from('calendar_events').insert(Object.assign({gym_id:me_.gym_id},payload)).select();
  if(res.error||!res.data||!res.data.length){ if(msg){msg.style.color='var(--bad)';msg.textContent='Save failed — '+(res.error?res.error.message:'try again');} return; }
  const p=date.split('-'); planState.cur={y:+p[0],m:+p[1]-1,d:+p[2]}; if(planState.calView==='year') planState.calView='month';
  document.getElementById('calEvtModal').style.display='none'; await loadPlan(); paintPlan();
};

window.planOverrideReplace=async(itemType,id)=>{
  const A=planState.athleteId; if(!A) return; const msg=document.getElementById('ovrMsg');
  if(!ATHPLAN_READY){ if(msg){msg.style.color='var(--warn)';msg.textContent='Run migration 38 to build a custom block for an athlete.';} return; }
  if(itemType==='phase'){
    const p=planState.phases.find(x=>x.id===id); if(!p){ toast('Block not found — reload the plan.'); return; }

function coachReadinessCard(rk){

function normEx(n){ return (n||'').toLowerCase().replace(/\s+/g,' ').trim(); }
// most-recent-session velocity summary for one exercise (Coach View option A)
function coachVbtSummary(reps, exName){
  const metric=vbtMetricFor(exName), fld=metric==='peak'?'peak_vel':'mean_vel';
  const dates=[...new Set(reps.map(r=>r.lift_date))].sort(); const last=dates[dates.length-1]; if(!last) return null;
  const day=reps.filter(r=>r.lift_date===last && r.load_kg!=null && r[fld]!=null); if(!day.length) return null;
  const topLoad=Math.max(...day.map(r=>r.load_kg));
  const vel=Math.max(...day.filter(r=>r.load_kg===topLoad).map(r=>r[fld]));
  let est=null;
  if(metric==='mean'){
    const byLoad={}; day.forEach(r=>{ if(r.mean_vel!=null && (byLoad[r.load_kg]==null||r.mean_vel>byLoad[r.load_kg])) byLoad[r.load_kg]=r.mean_vel; });
    const pts=Object.keys(byLoad).map(l=>({x:+l,y:byLoad[l]}));
    if(pts.length>=3){ const reg=vbtReg(pts), mvt=vbtMvt(exName); if(reg&&reg.a<0){ const e=(mvt-reg.b)/reg.a; if(e>topLoad*0.8 && e<topLoad*2.2) est=Math.round(e); } }
  }
  return { metric, date:last, topLoad:Math.round(topLoad), vel:Math.round(vel*100)/100, est, nDates:dates.length };
}
async function loadCoachVbt(athId){
  const out={};
  const r=await sb.from('vbt_reps').select('exercise,lift_date,load_kg,mean_vel,peak_vel').eq('athlete_id', athId).order('lift_date',{ascending:false}).limit(4000);
  if(r.error || !r.data) return out;
  const byEx={}; r.data.forEach(x=>{ const k=normEx(x.exercise); (byEx[k]=byEx[k]||[]).push(x); });
  Object.keys(byEx).forEach(k=>{ const sm=coachVbtSummary(byEx[k], byEx[k][0].exercise); if(sm) out[k]=sm; });
  return out;
}

function offForDate(d){
  const m=weekDates(0)[0]; const a=new Date(m.getFullYear(),m.getMonth(),m.getDate());
  const t=(typeof d==='string')?new Date(d+'T00:00:00'):new Date(d);
  const tm=new Date(t); tm.setDate(t.getDate()-((t.getDay()+6)%7));

function cwNum(n){ const f=parseFloat(n); if(isNaN(f)) return ''; return String(Math.round(f*100)/100); }
function cwLoadUnit(lt){ return lt==='rpe'?' RPE':lt==='rir'?' RIR':lt==='velocity'?' m/s':lt==='weight'?'kg':lt==='open'?'':'%'; }
function cwSetIntensity(st, lt){
  if(lt==='weight') return st.target_kg;
  if(lt==='velocity') return st.target_vel;
  if(lt==='rpe'||lt==='rir') return st.target_eff;
  if(lt==='open') return null;
  return st.target_pct;
}
function cwFmtScheme(ex){
  const lt=ex.load_type||'percentage';
  const sets=(ex.prescribed_sets||[]).slice().sort(sortByPos);
  if(!sets.length) return '';
  const reps=sets.map(s=>(s.target_reps==null||s.target_reps==='')?null:s.target_reps);
  const haveReps=reps.some(r=>r!=null);
  const intens=sets.map(s=>{ const v=cwSetIntensity(s,lt); return (v==null||v==='')?null:parseFloat(v); });
  const haveInt=intens.some(v=>v!=null);
  // reps part
  let repPart;
  if(!haveReps){ repPart = sets.length+' set'+(sets.length>1?'s':''); }
  else { const allEq=reps.every(r=>r===reps[0]); repPart = allEq ? (sets.length+' × '+reps[0]) : reps.map(r=>r==null?'–':r).join(', '); }
  if(!haveInt) return repPart;
  const unit=cwLoadUnit(lt);
  const allInt=intens.every(v=>v===intens[0]);
  const intPart = allInt ? (cwNum(intens[0])+unit) : (intens.map(v=>v==null?'–':cwNum(v)).join(', ')+unit);
  return repPart+' @ '+intPart;
}

let _cwDrag=null;

function cwWireDrag(){
  if(window._cwDragWired) return; window._cwDragWired=true;
  document.addEventListener('pointerdown', cwDragDown, true);
  document.addEventListener('pointermove', cwDragMove, true);
  document.addEventListener('pointerup', cwDragUp, true);

function cwDragDown(e){
  window._cwJustDragged=false;

  const scroll=document.getElementById('cwCalScroll'); if(!scroll || !scroll.contains(e.target)) return;
  if(!e.target.closest('.cwd-grid')) return;          // only start inside the day grid, not on header buttons
  _cwDrag={ x0:e.clientX, y0:e.clientY, started:false, scroll };

function cwDragMove(e){
  if(!_cwDrag) return;
  const dx=e.clientX-_cwDrag.x0, dy=e.clientY-_cwDrag.y0;
  if(!_cwDrag.started){
    if(Math.hypot(dx,dy)<6) return;                    // tiny moves = a click, let it through
    _cwDrag.started=true;
    cwClearSel();
    const r=document.createElement('div'); r.id='cwRubber'; r.className='cw-rubber'; document.body.appendChild(r);
    _cwDrag.scroll.classList.add('cw-dragging');
  }
  e.preventDefault();
  const L=Math.min(_cwDrag.x0,e.clientX), R=Math.max(_cwDrag.x0,e.clientX);
  const T=Math.min(_cwDrag.y0,e.clientY), B=Math.max(_cwDrag.y0,e.clientY);
  const rub=document.getElementById('cwRubber');
  if(rub){ rub.style.left=L+'px'; rub.style.top=T+'px'; rub.style.width=(R-L)+'px'; rub.style.height=(B-T)+'px'; }

    const c=card.getBoundingClientRect();

}
function cwDragUp(){

function mclWireDrag(){
