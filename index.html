<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>SoCal WLC</title>
<style>
  :root{--bg:#0c1116;--panel:#141c24;--panel2:#1a232c;--line:#26323d;--text:#e7edf3;--muted:#8b9aa8;
        --accent:#e8643c;--accent2:#3c9ee8;--good:#3ec97a;--warn:#e8b13c;--bad:#e85c5c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:760px;margin:0 auto;padding:18px 16px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .brand{font-weight:800;letter-spacing:.3px}.brand .o{color:var(--accent)}
  .who{font-size:12px;color:var(--muted);text-align:right}
  .who b{color:var(--text)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer}
  .btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.blue{background:var(--accent2)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
  .sub{color:var(--muted);font-size:13px}
  /* login */
  .login{max-width:380px;margin:8vh auto 0}
  .login .card{padding:24px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:12px 0 5px}
  input{width:100%;background:#0e151c;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--text);font-size:15px}
  input:focus{outline:none;border-color:var(--accent2)}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px}
  .hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
  .hint .lk{color:var(--accent2);font-weight:700;cursor:pointer}.hint .lk:hover{text-decoration:underline}
  .csection-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
  .inv-link-box{background:#13202c;border:1px solid #27425c;border-radius:10px;padding:12px;margin-top:12px}
  .inv-link-box input{flex:1;font-size:12px}
  /* session */
  .pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:11px;background:var(--panel2);color:var(--accent2)}
  .exh{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
  .exh .nm{font-weight:800;font-size:15px}
  .note{font-size:12.5px;color:var(--muted);font-style:italic;background:var(--panel2);border-left:2px solid var(--accent2);border-radius:0 8px 8px 0;padding:8px 11px;margin:6px 0 10px}
  table{width:100%;border-collapse:collapse}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;text-align:left;padding:6px 8px}
  td{padding:6px 8px;border-top:1px solid var(--line)}
  .tgt{color:var(--muted);font-size:13px}
  td input.cell{width:62px;padding:8px;text-align:center;font-weight:700}
  .chk{width:22px;height:22px;accent-color:var(--good)}
  .savebar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(12,17,22,0),var(--bg) 36%);padding:14px 0 4px;margin-top:8px;display:flex;gap:10px;align-items:center}
  .saved{color:var(--good);font-size:13px;font-weight:700}
  /* coach */
  .athrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
  .athrow.on{border-color:var(--accent)}
  .athrow .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .pa{display:flex;gap:8px;font-size:13px}
  .pa .p{color:var(--muted)}.pa .a{font-weight:800}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--good)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .delta-pos{color:var(--good)}.delta-neg{color:var(--bad)}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .spin{color:var(--muted);padding:30px;text-align:center}
  /* coach session builder */
  .b-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .b-ex{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
  .b-ex .b-name{width:100%;font-weight:700;font-size:15px;margin-bottom:6px}
  .b-ex .b-note{width:100%;font-size:13px;margin-bottom:8px}
  .b-set{display:flex;gap:8px;align-items:center;margin:5px 0}
  .b-set .lbl{flex:0 0 42px;color:var(--muted);font-size:12px;font-weight:700}
  .b-set input{width:74px;text-align:center;padding:8px}
  .b-x{color:var(--muted);cursor:pointer;font-size:13px;padding:2px 7px;user-select:none}
  .b-x:hover{color:var(--bad)}
  .b-add{display:inline-block;font-size:13px;font-weight:700;color:var(--accent2);cursor:pointer;margin-top:4px;user-select:none}
  .b-add:hover{text-decoration:underline}
  /* athlete logging table (mockup look) */
  .pill.phase{background:#2a3a2c;color:var(--good)}
  .pill.primary{background:#2a3340;color:var(--accent2)}
  .pill.accessory{background:#332d22;color:var(--warn)}
  .cvx-cat{cursor:pointer;user-select:none}.cvx-cat:hover{filter:brightness(1.3)}
  .ex{border:1px solid var(--line);border-radius:11px;margin-bottom:14px;overflow:hidden}
  .av-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer}
  .av-head .name{font-weight:800;font-size:15px}
  .av-head .tag{margin-left:auto;font-size:11px;color:var(--muted)}
  .ex-caret{display:inline-block;transition:transform .15s;color:var(--muted);font-size:12px;width:12px}
  .ex-collapsed .ex-caret{transform:rotate(-90deg)}
  .ex-collapsed .ex-body{display:none}
  .ex-collapsed .av-head{border-bottom:none}
  .ex-prog{font-size:11px;font-weight:800;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .ex-prog.done{color:var(--good);border-color:rgba(52,211,153,.45)}
  .ex-next{margin-left:auto;background:var(--bg);border:1px solid var(--line);color:var(--accent2);font-weight:700;font-size:12px;border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap}
  .ex-next:hover{border-color:var(--accent2)}
  .logwrap{overflow-x:auto}
  .logtable{width:100%;border-collapse:collapse;min-width:560px}
  .logtable th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:9px 6px;text-align:center}
  .logtable td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);font-size:13px}
  .logtable td:nth-child(2),.logtable th:nth-child(2){text-align:left}
  .logtable input{width:52px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);text-align:center;padding:7px 4px;font-size:13px;font-weight:700}
  .logtable input.mini{width:44px}
  .logtable input:focus{outline:none;border-color:var(--accent2)}
  .logtable .tgt{color:var(--accent2);font-weight:700;font-size:12px}
  .logtable .chk{width:20px;height:20px;accent-color:var(--good)}
  .lights{display:inline-flex;gap:3px;vertical-align:middle}
  .lights i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
  .lights i.w{background:#eef3f8}.lights i.r{background:var(--bad)}
  .lights.sm i{width:9px;height:9px}
  .lg-lts{cursor:pointer;padding:4px 5px;border-radius:6px;gap:4px}
  .lg-lts:hover{background:#16202b}.lg-lts i{width:14px;height:14px}
  .lg-eff{display:inline-flex;gap:3px}
  .lg-light{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:#0e151c;color:var(--muted);opacity:.6}
  .lg-light:hover{opacity:1}
  .lg-light.on{opacity:1;color:#06121d}
  .lg-light.easy.on{background:var(--good);border-color:var(--good)}
  .lg-light.moderate.on{background:var(--accent2);border-color:var(--accent2)}
  .lg-light.hard.on{background:var(--warn);border-color:var(--warn)}
  .lg-light.max.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .upvid{display:inline-flex;align-items:center;gap:4px;background:#2a2340;border:1px dashed #3d3460;color:#b9a8ff;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
  .upvid.on{background:#1d3a2a;border-color:#2f6b48;color:#7fdca8;border-style:solid}
  .upvid.up{background:#33302a;border-color:#5a4419;color:var(--warn);border-style:solid;cursor:default}
  .vidcell{white-space:nowrap}
  .vidrm{color:var(--muted);cursor:pointer;font-weight:700;margin-left:6px;font-size:12px}
  .vidrm:hover{color:var(--bad)}
  .vidrm.arm{color:var(--bad);font-size:11px;font-weight:800}
  .vidlink{color:#7fdca8;cursor:pointer;font-weight:700;white-space:nowrap}
  .vidlink:hover{text-decoration:underline}
  .vid-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;align-items:center;justify-content:center;padding:24px}
  .vid-box{position:relative;max-width:540px;width:100%;background:#0c1116;border:1px solid var(--line);border-radius:12px;padding:14px}
  .vid-x{position:absolute;top:-12px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
  /* ---- Video Annotation Studio ---- */
  .vstudio{display:none;position:fixed;inset:0;background:rgba(4,7,10,.94);z-index:300;flex-direction:column;padding:14px 16px 16px}
  .vstudio.on{display:flex}
  .vst-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .vst-top h3{margin:0;font-size:15px;font-weight:700;color:var(--text)}
  .vst-top .vst-sub{color:var(--muted);font-size:12px}
  .vst-close{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
  .vst-body{flex:1;display:flex;gap:14px;min-height:0}
  .vst-stage{flex:1.2 1 0;display:flex;flex-direction:column;min-width:0;min-height:0}
  .vst-canvaswrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}
  .vst-countdown{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none;font:800 128px/1 var(--font,system-ui);color:#fff;text-shadow:0 3px 24px rgba(0,0,0,.7);background:rgba(0,0,0,.32)}
  .vst-countdown.pop{animation:vstCdPop .7s ease-out}
  .vst-countdown.go{font-size:64px;color:#ff5a5a;background:rgba(0,0,0,.18)}
  @keyframes vstCdPop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:.9}}
  .vst-zoom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:center center}
  .vst-canvaswrap video{max-width:100%;max-height:100%;display:block;background:#000}
  .vst-canvaswrap canvas{position:absolute;cursor:crosshair;touch-action:none}
  .vst-side{width:260px;flex:none;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
  @media (max-width:1100px){
    /* phone / narrow: stop sharing one fixed height (which collapses the video & chart) — stack in normal flow and let the whole studio scroll */
    .vstudio{overflow-y:auto;-webkit-overflow-scrolling:touch}
    .vst-body{display:block;flex:0 0 auto;min-height:0}
    .vst-stage{display:block}
    .vst-canvaswrap{height:48vh;min-height:240px;flex:none}
    .bpg{display:flex;min-width:0;flex:none;margin-top:12px}
    #bpgCanvas{flex:none;height:240px}
    .vst-side{width:auto;overflow:visible;margin-top:12px}
  }
  .vst-transport{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .vst-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;font-weight:600;user-select:none;white-space:nowrap}
  .vst-btn:hover{border-color:var(--accent2)}
  .vst-btn.pri{background:var(--accent);border-color:var(--accent);color:#0a0d11}
  .vst-scrub{flex:1;min-width:120px;accent-color:var(--accent)}
  .vst-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:88px;text-align:right}
  .vst-tools{display:flex;flex-wrap:wrap;gap:6px}
  .vst-tool{width:38px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
  .vst-tool.on{background:var(--accent);border-color:var(--accent);color:#0a0d11}
  .vst-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .vst-card h4{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .vst-colors{display:flex;gap:6px;flex-wrap:wrap}
  .vst-color{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .vst-color.on{border-color:#fff}
  .vst-note{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-size:13px;resize:vertical;min-height:70px;font-family:inherit}
  .vst-row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
  .vst-fps{width:54px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font-size:12px}
  .vst-textin{position:absolute;z-index:5;background:#0c1116;border:1px solid var(--accent);color:var(--text);border-radius:6px;padding:3px 6px;font-size:14px;min-width:90px}
  .vst-msg{font-size:12px;color:var(--accent2)}
  .vst-trimlbl{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
  .vst-size{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .vst-size input{width:78px;vertical-align:middle}
  .bpg{flex:1 1 0;min-width:320px;align-self:stretch;display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:0}
  .bpg-heads{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bpg-head{display:flex;align-items:center;gap:6px}
  .bpg-head.a .bpg-axis,.bpg-head.a .bpg-sel{color:#3b82f6}
  .bpg-head.b .bpg-axis,.bpg-head.b .bpg-sel{color:#ef4444}
  .bpg-sel{background:transparent;border:none;font-size:15px;font-weight:700;cursor:pointer;-webkit-appearance:none;appearance:none;padding:2px 2px}
  .bpg-sel option{background:var(--panel);color:var(--text)}
  .bpg-axis{font-size:17px;cursor:pointer;font-weight:800;user-select:none}
  .bpg-axis.off{opacity:.28;cursor:not-allowed}
  .bpg-hint{font-size:10px;color:var(--muted);text-align:center;flex:1}
  #bpgCanvas{width:100%;flex:1 1 auto;min-height:220px;display:block;margin-top:4px;cursor:crosshair;touch-action:none}
  .bpg-table{margin-top:4px}
  .bpg-trow{display:grid;grid-template-columns:24px 1fr 1fr 1fr 1fr;align-items:center;font-variant-numeric:tabular-nums;font-size:13px;padding:1px 0}
  .bpg-trow.head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .bpg-trow.head b{text-align:right;font-weight:600}
  .bpg-trow i{text-align:right;font-style:normal}
  .bpg-trow .now{font-weight:800}
  .bpg-cap{font-size:11px;color:var(--muted);margin-top:5px}
  .bpg-dot{width:11px;height:11px;border-radius:50%}
  .bpg-dot.a{background:#3b82f6}.bpg-dot.b{background:#ef4444}
  .bpg-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .bpg-load{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .bpg-load input{width:72px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font-size:13px}
  .bpg-loadnote{font-size:11px;color:var(--muted)}
  .bpg-tmc{font-size:13px;font-weight:800;color:var(--accent2)}
  .bpg-msg{font-size:12px;color:#e0a85a}
  .vst-loop{font-size:11px;color:var(--muted)}
  .vst-loop b{color:var(--accent)}
  .bp-steps{display:flex;flex-direction:column;gap:6px}
  .bp-step{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted)}
  .bp-step .bp-num{flex:none;width:18px;height:18px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .bp-step.done .bp-num{background:var(--good);border-color:var(--good);color:#0a0d11}
  .bp-step.active .bp-num{background:var(--accent);border-color:var(--accent);color:#0a0d11}
  .bp-btn{width:100%;box-sizing:border-box;text-align:center;margin-top:4px}
  .bp-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 2px}
  .bp-btns>.bp-btn{margin-top:0;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;line-height:1.15}
  .bp-calib{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-height:38px;margin-top:8px}
  @media(max-width:420px){ .bp-btns{gap:7px} .bp-btns>.bp-btn{min-height:50px;font-size:12.5px} }
  .bp-tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .bp-tile{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .bp-tile .bp-v{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .bp-tile .bp-l{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-top:1px}
  .bp-phases{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:2px}
  .bp-ph-h{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:4px}
  .bp-ph-h span{cursor:help;opacity:.7}
  .bp-ph-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .bp-ph-row:first-of-type{border-top:0}
  .bp-ph-n{font-size:12px;color:var(--text);font-weight:600;flex:1}
  .bp-ph-d{font-size:12px;color:var(--muted);min-width:48px;text-align:right}
  .bp-ph-v{font-size:12px;color:var(--text);font-weight:700;min-width:58px;text-align:right}
  .ja-list{margin-top:6px;display:flex;flex-direction:column;gap:4px}
  .ja-row{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  .ja-deg{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;min-width:42px}
  .ja-lbl{flex:1;font-size:12px;color:var(--text)}
  .ja-t{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline dotted}

  .bp-pins{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

  .revbadge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:rgba(52,211,153,.16);border:1px solid rgba(52,211,153,.5);color:#34d399;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}

  .rev-list{display:flex;flex-direction:column;gap:8px}
  .rev-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .rev-meta{flex:1;min-width:0;font-size:13px;color:var(--text)}
  .rev-meta .rev-date{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .rev-meta .rev-note{color:var(--muted);font-size:12px;margin-top:3px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rev-row .cbtn{flex:none}
  .rev-row.rev-watched{opacity:.5;transition:opacity .45s ease}
  .rev-seen{margin-top:8px}

  .rev-seen[open]{display:flex;flex-direction:column;gap:8px}

  /* glitch/bug tickets */
  .tk-btn{padding:6px 10px}
  .tk-body{display:flex;flex-direction:column;gap:8px;padding:4px 2px 2px}
  .tk-lbl{font-size:13px;color:var(--muted)}
  .tk-ta{width:100%;box-sizing:border-box;min-height:96px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;resize:vertical}
  .tk-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px}
  .tk-status{flex:1;font-size:12px}
  .tk-listwrap{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .tk-hd{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .tk-list{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto}
  .tk-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .tk-row.tk-done{opacity:.5}
  .tk-main{flex:1;min-width:0}
  .tk-msg{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word}
  .tk-meta{color:var(--muted);font-size:11px;margin-top:3px}
  .tk-tag{flex:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--good);background:rgba(52,211,153,.16);border-radius:999px;padding:3px 8px}
  #rvNav .rv-pos{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.04em}
  #rvNav .rv-ex{font-size:15px;font-weight:700;color:var(--text);margin-top:3px}
  #rvNav .rv-set{font-size:12px;color:var(--muted);margin-top:2px}
  #rvNav .rv-set b{color:var(--text)}
  #rvNav .rv-pips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .rv-pip{min-width:22px;height:22px;padding:0 5px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}

  .rv-pip.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--text)}
  .vst-btn.disabled{opacity:.4;pointer-events:none}
  .lg-add{display:inline-block;margin:9px 14px;color:var(--accent2);font-weight:700;font-size:12px;cursor:pointer;user-select:none}
  .ex-foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .lg-tickall{color:var(--good);border:1px solid rgba(52,211,153,.4);border-radius:8px;padding:5px 11px;margin:9px 14px}
  .lg-tickall:hover{background:rgba(52,211,153,.12)}
  .lg-add:hover{color:#7bc0f5}
  .lg-del{color:var(--muted);cursor:pointer;font-weight:700;opacity:.45;padding:0 4px}
  .lg-del:hover{color:var(--bad);opacity:1}
  .addedtag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--warn);background:rgba(232,177,60,.13);border-radius:9px;padding:2px 8px}
  .av-note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:#1c2530;border-top:1px solid var(--line);font-size:12.5px}
  .av-note.av-note-top{border-top:none;border-bottom:1px solid var(--line)}
  .av-note .tag{color:var(--accent2);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.5px;white-space:nowrap;padding-top:2px}
  /* morning readiness check-in */
  .rk-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .rk-score{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
  .rk-num{font-size:26px;font-weight:800;color:var(--text)}
  .rk-num.good{color:var(--good)}.rk-num.warn{color:var(--warn)}.rk-num.bad{color:var(--bad)}
  .rk-meta{font-size:10px;color:var(--muted);line-height:1.3;text-transform:uppercase;letter-spacing:.4px}
  .rk-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .rk-row:last-of-type{border-bottom:none}
  .rk-lbl{flex:0 0 130px;font-size:14px;font-weight:600;color:var(--text)}
  .rk-hint{display:block;font-size:10px;color:var(--muted);font-weight:400}
  .rk-scale{display:flex;gap:6px;flex-wrap:wrap}
  .rk-dot{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#0e151c;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s}
  .rk-dot:hover{border-color:var(--accent2)}
  .rk-dot.on{background:var(--accent2);border-color:var(--accent2);color:#06121d}
  .rk-foot{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-top:14px}
  .rk-bw label,.rk-note label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
  .rk-bwrow{display:flex;align-items:center;gap:7px}
  .rk-bw input{background:#0e151c;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:15px;font-weight:700;width:96px}
  .rk-bw input:focus,.rk-note textarea:focus{outline:none;border-color:var(--accent2)}
  .rk-unit{color:var(--muted);font-size:13px;font-weight:600}
  .rk-note{flex:1;min-width:220px}
  .rk-note textarea{width:100%;background:#0e151c;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;min-height:48px;resize:vertical;font-family:inherit}
  /* coach view of a check-in */
  .rkc-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rkc-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .rkc-chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12px}
  .rkc-chip .rkc-l{color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .rkc-chip b{font-size:14px}
  .rkc-note{margin-top:10px;font-size:13px;font-style:italic;color:var(--text);background:var(--panel2);border-left:2px solid var(--accent2);border-radius:0 8px 8px 0;padding:8px 12px}
  .rk-scale{flex-wrap:nowrap}
  @media(max-width:560px){
    .rk-row{flex-direction:column;align-items:stretch;gap:8px;padding:11px 0}
    .rk-lbl{flex:none}
    .rk-scale{width:100%;gap:7px}
    .rk-dot{flex:1;width:auto;height:42px;font-size:14px}
  }
  .rk-donebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
  .rk-donebar .ok{color:var(--good);font-weight:700}
  .rk-edit{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent2)}
  /* body pain / injury heat-map */
  .bm-card{padding:14px 16px}
  .bm-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
  .bm-q{font-weight:800;font-size:15px}
  .bm-stat{display:flex;align-items:center;gap:8px}
  .bm-opt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .bm-badge{background:rgba(232,100,60,.16);color:var(--accent);border:1px solid rgba(232,100,60,.4);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800}
  .bm-chev{color:var(--muted);font-size:13px}
  .bm-views{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
  .bm-views button{background:#0e151c;color:var(--muted);border:none;padding:8px 18px;font-weight:700;font-size:13px;cursor:pointer}
  .bm-views button.on{background:var(--accent2);color:#06121d}
  .bm-stage{max-width:280px;margin:0 auto}
  .bm-svg{width:100%;height:auto;display:block;touch-action:manipulation}
  .bm-outline circle{fill:#1a232c;stroke:#2c3a47;stroke-width:1.5}
  .bm-region{cursor:pointer}
  .bm-region :is(rect,ellipse,circle){fill:#222d38;stroke:#3645524d;stroke-width:1.2;transition:fill .12s,fill-opacity .12s}
  .bm-region:not(.ro):hover :is(rect,ellipse,circle){fill:#2f3e4c;stroke:var(--accent2);stroke-width:1.6}
  .bm-region.on :is(rect,ellipse,circle){fill:var(--c);fill-opacity:.85;stroke:var(--c);stroke-opacity:.95;stroke-width:1.6}
  .bm-region.ro{cursor:default}
  .bm-editor{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:10px 0 4px}
  .bm-ehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .bm-ehead b{font-size:15px}
  .bm-eclose{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px;padding:0 4px}
  .bm-erow{display:flex;align-items:center;gap:10px;margin:7px 0}
  .bm-erow.sub{margin-top:0}
  .bm-elbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;width:38px;flex:none}
  .bm-shint{font-size:11px;color:var(--muted);font-style:italic}
  .bm-sides{display:flex;gap:6px;flex-wrap:wrap}
  .bm-side{background:#0e151c;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 13px;font-weight:700;font-size:12px;cursor:pointer}
  .bm-side.on{background:var(--accent2);border-color:var(--accent2);color:#06121d}
  .bm-scale{display:flex;gap:4px;flex-wrap:wrap}
  .bm-dot{width:30px;height:32px;border-radius:8px;border:1px solid var(--line);background:#0e151c;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .bm-dot.lo.on{background:var(--good);border-color:var(--good);color:#05140b}
  .bm-dot.mid.on{background:var(--warn);border-color:var(--warn);color:#1a1304}
  .bm-dot.hi.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bm-dot.on:not(.lo):not(.mid):not(.hi){background:#3a4654;border-color:#3a4654;color:var(--text)}
  .bm-enote textarea{width:100%;background:#0e151c;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;min-height:42px;resize:vertical;font-family:inherit}
  .bm-enote textarea:focus{outline:none;border-color:var(--accent2)}
  .bm-marks{margin-top:8px}
  .bm-none{font-size:12.5px;color:var(--muted);font-style:italic}
  .bm-chips{display:flex;gap:7px;flex-wrap:wrap}
  .bm-chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer}
  .bm-chip .bm-cdot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .bm-chip.lo .bm-cdot{background:var(--good)}.bm-chip.mid .bm-cdot{background:var(--warn)}.bm-chip.hi .bm-cdot{background:var(--accent)}
  /* coach + report read-only pain panel */

  .pn-maps{display:flex;gap:10px}

  .pn-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
  .pn-row:first-child{border-top:none}
  .pn-dot{width:10px;height:10px;border-radius:50%;flex:none}
  .pn-row.pn-arch{opacity:.55}
  .pn-reg{font-weight:700;min-width:120px}
  .pn-sev{font-weight:800}
  .pn-meta{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
  .pn-note{color:var(--muted);font-style:italic;font-size:12px;flex-basis:100%;padding-left:19px}
  .pn-legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:6px}

  /* week day-strip */
  .av-weekcard{padding:14px 16px}
  .av-weekhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:11px}
  .av-weeklbl{font-size:13px;color:var(--muted)}

  .av-weekprog{font-size:12px;font-weight:700;color:var(--accent2)}

  .av-day-dot.up{background:var(--accent2)}
  .av-day-dot.rest{background:#3a4754}
  .av-day-dot.draft{background:var(--warn)}
  /* expandable week — each day shows its sessions */
  .cwd-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  @media(max-width:1100px){.cwd-grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:680px){.cwd-grid{grid-template-columns:repeat(2,1fr)}}
  .cwd-col{background:#0e151c;border:1px solid var(--line);border-radius:11px;padding:9px;min-height:96px;display:flex;flex-direction:column;gap:6px}
  .cwd-col.today{border-color:var(--accent)}
  .cwd-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1px}
  .cwd-dow{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .cwd-col.today .cwd-dow{color:var(--accent)}
  .cwd-dnum{font-size:15px;font-weight:800;color:var(--text)}
  .cwd-sess{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:8px;padding:7px 9px;cursor:pointer;transition:border-color .12s}

  #cwCalScroll.cw-dragging *{user-select:none}

  .cwd-st{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  .cwd-sx{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .cwd-sm{font-size:10px;color:var(--accent2);font-weight:700;margin-top:3px}
  .cwd-rest{font-size:10.5px;color:var(--muted);text-align:center;padding:14px 0;opacity:.7}

  .cwd-add:hover{border-color:var(--accent2)}
  .pv-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap;align-items:center}
  .pv-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  /* TrainHeroic-style scrolling/month calendar (coach view) */
  .cw-calhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

  .rpt-thr th.on,.rpt-thr td.on{background:rgba(62,201,122,.16);color:var(--good);font-weight:800;border-color:var(--good)}
  .rpt-note{font-size:11px;color:var(--muted);margin-top:8px}
  .rpt-story{font-size:12.5px;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .rpt-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .rpt-tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;text-align:center}
  .rpt-tile .v{font-size:18px;font-weight:800;color:var(--text)}
  .rpt-tile .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:2px}
  .rpt-chart-cap{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px}
  .rpt-leg{font-weight:600;color:var(--muted);font-size:11px;margin-left:8px}
  .rpt-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px;vertical-align:middle}
  .report .chart{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
  .rpt-summary .rpt-sumbody{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:13px;min-height:30px}
  .rpt-foot{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);text-align:center}
  .rpt-sub{color:var(--muted)}
  .rep-list{display:flex;flex-direction:column;gap:8px}
  .rep-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .rpt-winlbl{font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:inline-block}
  /* athlete "My Review" panel */
  .mreview{border:1px solid var(--accent)}
  .mrev-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .mrev-head h2{margin:0}
  .mrev-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
  .mrev-toggle button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:7px;cursor:pointer}
  .mrev-toggle button.on{background:var(--accent);color:#fff}
  .mrev-sub{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:10px}
  .mrev-focus{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 13px;font-size:13.5px;line-height:1.5}
  .mrev-focus.coach{background:rgba(232,100,60,.08);border-left-color:var(--accent)}
  .mrev-flbl{font-weight:800;color:var(--accent);margin-right:4px}
  .mrev-pain{margin-top:12px}
  .mrev-plbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .mrev-next{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;cursor:pointer}
  .mrev-next:hover{border-color:var(--accent)}
  .mrev-nlbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  .mrev-nex{font-weight:700;color:var(--text);margin-top:2px}
  .mrev-next .cta{color:var(--accent);font-weight:800;white-space:nowrap}
  .mrev-empty{display:flex;gap:13px;align-items:flex-start;padding:6px 2px}
  .mrev-eico{font-size:26px;line-height:1}
  .mrev-sent-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .mrev-sent-t{font-size:16px;font-weight:800;color:var(--text)}
  .mrev-sent-m{font-size:11.5px;color:var(--muted);margin-top:3px}
  .mrev-older{margin-top:14px}
  .mrev-olbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:7px}
  .mrev-older .rep-item{margin-top:7px}
  @media (max-width:760px){ .rpt-2col{grid-template-columns:1fr} .rpt-tiles{grid-template-columns:repeat(2,1fr)} .report{padding:20px 16px} }

  /* ============ REPORTS REDESIGN (rptx) — executive layout, light/dark themeable ============ */
  .rptx{--rx-sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --rx-card:#FFFFFF;--rx-ink:#141A23;--rx-muted:#606B7B;--rx-muted2:#8A94A2;--rx-line:#E3E7EC;--rx-line2:#EDF0F3;
    --rx-fill:#FBFCFD;--rx-navy:#1D2A38;--rx-accent:#E4572E;--rx-accent-soft:rgba(228,87,46,.10);
    --rx-good:#1F9D5B;--rx-warn:#B8791A;--rx-crit:#C0392B;--rx-good-bg:rgba(31,157,91,.12);--rx-warn-bg:rgba(184,121,26,.14);--rx-crit-bg:rgba(192,57,43,.12);--rx-chip:#E7ECF1;
    max-width:840px;margin:14px auto;background:var(--rx-card);color:var(--rx-ink);border:1px solid var(--rx-line);
    border-radius:6px;overflow:hidden;font-family:var(--rx-body,system-ui,-apple-system,"Segoe UI",sans-serif);font-size:13.5px;line-height:1.55}
  .rptx[data-theme="dark"]{--rx-card:#141B24;--rx-ink:#E7EEF4;--rx-muted:#93A2B3;--rx-muted2:#6B7C8E;--rx-line:#243140;--rx-line2:#1B2531;
    --rx-fill:#111A23;--rx-navy:#0E1620;--rx-accent:#F2703F;--rx-accent-soft:rgba(242,112,63,.16);
    --rx-good:#3ECD84;--rx-warn:#E0A23A;--rx-crit:#EA6A5C;--rx-good-bg:rgba(62,205,132,.14);--rx-warn-bg:rgba(224,162,58,.16);--rx-crit-bg:rgba(234,106,92,.16);--rx-chip:#20303F}
  .rptx .tnum{font-variant-numeric:tabular-nums}
  .rptx .rx-accent{color:var(--rx-accent)}
  .rptx .rx-pad{padding:22px 30px}
  .rptx .rx-note{font-size:11px;color:var(--rx-muted);margin-top:9px;line-height:1.5}
  .rptx .rx-dim{color:var(--rx-muted2)}
  .rptx .rx-modsub{font-weight:600;font-size:11px;color:var(--rx-muted);letter-spacing:0;text-transform:none}
  /* masthead */
  .rptx .rx-mast{background:var(--rx-navy);color:#fff;padding:24px 30px 20px;display:flex;justify-content:space-between;gap:18px;position:relative}
  .rptx .rx-mast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--rx-accent) 0 34%,rgba(255,255,255,.12) 34%)}
  .rptx .rx-lockup{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .rptx .rx-mark{width:28px;height:28px;border-radius:6px;background:var(--rx-accent);color:#fff;display:grid;place-items:center;font:800 12px/1 var(--rx-sans)}
  .rptx .rx-name{font:800 14px/1 var(--rx-sans);letter-spacing:.02em}
  .rptx .rx-name small{display:block;font:600 9px/1.3 var(--rx-sans);letter-spacing:.16em;color:rgba(255,255,255,.5);text-transform:uppercase;margin-top:3px}
  .rptx .rx-eyebrow{font:700 10px/1 var(--rx-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--rx-accent)}
  .rptx .rx-h1{font:800 27px/1.05 var(--rx-sans);letter-spacing:-.01em;margin:8px 0 3px;text-wrap:balance}
  .rptx .rx-sub{color:rgba(255,255,255,.62);font-size:12px}
  .rptx .rx-meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:rgba(255,255,255,.55)}
  .rptx .rx-meta b{color:rgba(255,255,255,.82);font-weight:600}
  .rptx .rx-badge{flex:none;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:11px 15px;min-width:100px;align-self:flex-start}
  .rptx .rx-badge .k{font:800 28px/1 var(--rx-sans);color:#fff}
  .rptx .rx-badge .l{font:700 8.5px/1.3 var(--rx-sans);letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:6px}
  .rptx .rx-badge .goal{font-size:10.5px;color:var(--rx-accent);margin-top:5px;font-weight:700}
  /* exec */
  .rptx .rx-eyebrow2{font:700 10px/1 var(--rx-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--rx-muted2)}
  .rptx .rx-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rx-line);border:1px solid var(--rx-line);border-radius:10px;overflow:hidden;margin-top:11px}
  .rptx .rx-kpi{background:var(--rx-card);padding:12px 14px}
  .rptx .rx-kpi .l{font:700 9px/1.2 var(--rx-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--rx-muted)}
  .rptx .rx-kpi .v{font:800 25px/1.05 var(--rx-sans);letter-spacing:-.01em;margin-top:4px;display:flex;align-items:baseline;gap:6px}
  .rptx .rx-kpi .v small{font-size:12px;color:var(--rx-muted2);font-weight:700}
  .rptx .rx-knote{font-size:10.5px;color:var(--rx-muted2);margin-top:3px;background:none;border:0;padding:0}
  .rptx .rx-trend{font:700 10.5px/1 var(--rx-sans);padding:2px 6px;border-radius:20px}
  .rptx .rx-trend.up{color:var(--rx-good);background:var(--rx-good-bg)}
  .rptx .rx-trend.down{color:var(--rx-warn);background:var(--rx-warn-bg)}
  .rptx .rx-trend.flat{color:var(--rx-muted);background:var(--rx-line2)}
  .rptx .rx-exec{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:18px;align-items:start}
  .rptx .rx-read{border-left:3px solid var(--rx-accent);padding:2px 0 2px 14px}
  .rptx .rx-read p{margin:0;font-size:13.5px;line-height:1.6;color:var(--rx-ink)}
  .rptx .rx-read .sig{margin-top:10px;font-size:11px;color:var(--rx-muted)}
  .rptx .rx-read .sig b{color:var(--rx-ink)}
  .rptx .rx-callouts{display:flex;flex-direction:column;gap:7px}
  .rptx .rx-call{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:9px;border:1px solid var(--rx-line);background:var(--rx-fill);font-size:12px;line-height:1.4}
  .rptx .rx-call .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px}
  .rptx .rx-call.g .dot{background:var(--rx-good)} .rptx .rx-call.w .dot{background:var(--rx-warn)} .rptx .rx-call.c .dot{background:var(--rx-crit)}
  .rptx .rx-call .tag{margin-left:auto;flex:none;font:700 8.5px/1 var(--rx-sans);letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:20px}
  .rptx .rx-call.g .tag{color:var(--rx-good);background:var(--rx-good-bg)}
  .rptx .rx-call.w .tag{color:var(--rx-warn);background:var(--rx-warn-bg)}
  .rptx .rx-call.c .tag{color:var(--rx-crit);background:var(--rx-crit-bg)}
  /* chapters */
  .rptx .rx-chapter{border-top:1px solid var(--rx-line)}
  .rptx .rx-chhead{display:flex;align-items:center;gap:13px;padding:18px 30px 0}
  .rptx .rx-chnum{font:800 12px/1 var(--rx-sans);color:#fff;background:var(--rx-navy);border-radius:7px;width:28px;height:28px;display:grid;place-items:center}
  .rptx[data-theme="dark"] .rx-chnum{background:var(--rx-accent)}
  .rptx .rx-chtitle{font:800 17px/1.1 var(--rx-sans);letter-spacing:-.01em}
  .rptx .rx-chdesc{font-size:11px;color:var(--rx-muted);margin-top:1px}
  .rptx .rx-chapter .rx-pad{padding-top:6px}
  .rptx .rx-module{page-break-inside:avoid}
  .rptx h4.rx-mod{font:800 11.5px/1 var(--rx-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--rx-ink);margin:20px 0 10px;display:flex;align-items:center;gap:9px}
  .rptx h4.rx-mod::after{content:"";flex:1;height:1px;background:var(--rx-line)}
  .rptx .rx-2col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  /* tables */
  .rptx .rx-tbl{width:100%;border-collapse:collapse;font-size:12px}
  .rptx .rx-tbl th{text-align:left;font:700 9px/1.2 var(--rx-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--rx-muted);padding:0 7px 6px;border-bottom:1.5px solid var(--rx-ink)}
  .rptx .rx-tbl td{padding:5px 7px;border-bottom:1px solid var(--rx-line2)}
  .rptx .rx-tbl td.num,.rptx .rx-tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
  .rptx .rx-tbl tr.tot td{border-top:1.5px solid var(--rx-ink);border-bottom:none;font-weight:800;padding-top:7px}
  .rptx .rx-tbl tr.rx-grp td{font:700 9px/1 var(--rx-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--rx-muted);padding-top:11px;border-bottom:none}
  .rptx .rx-line{font-size:12.5px;color:var(--rx-ink);margin-bottom:6px}
  /* ladder + progress */
  .rptx .rx-ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--rx-line);border:1px solid var(--rx-line);border-radius:8px;overflow:hidden;margin-top:11px}
  .rptx .rx-ladder .cell{background:var(--rx-card);padding:7px 3px;text-align:center}
  .rptx .rx-ladder .cell.on{background:var(--rx-navy);color:#fff}
  .rptx[data-theme="dark"] .rx-ladder .cell.on{background:var(--rx-accent)}
  .rptx .rx-ladder .cell .r{font:700 8px/1.2 var(--rx-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--rx-muted)}
  .rptx .rx-ladder .cell.on .r{color:rgba(255,255,255,.75)}
  .rptx .rx-ladder .cell .t{font:800 13px/1.2 var(--rx-sans);margin-top:2px}
  .rptx .rx-prog{height:7px;border-radius:20px;background:var(--rx-line);margin:12px 0 3px;overflow:hidden}
  .rptx .rx-prog i{display:block;height:100%;border-radius:20px;background:var(--rx-accent)}
  /* clusters */
  .rptx .rx-clusters{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .rptx .rx-cluster{border:1px solid var(--rx-line);border-radius:11px;padding:12px 14px}
  .rptx .rx-cluster .ct{font:700 9.5px/1 var(--rx-sans);letter-spacing:.11em;text-transform:uppercase;color:var(--rx-accent);margin-bottom:10px}
  .rptx .rx-cluster .row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--rx-line2)}
  .rptx .rx-cluster .row:last-child{border-bottom:none}
  .rptx .rx-cluster .row .lab{font-size:11.5px;color:var(--rx-muted)}
  .rptx[data-theme="dark"] .rx-cluster .row .lab{color:var(--rx-ink)}
  .rptx .rx-cluster .row .val{font:800 13px/1 var(--rx-sans);font-variant-numeric:tabular-nums}
  /* reads / flags */
  .rptx .rx-read-x{}
  .rptx .rx-read.ineff,.rptx .rx-read.eff,.rptx .rx-read.hyper{all:unset}
  .rptx span.rx-read{font:700 9px/1 var(--rx-sans);letter-spacing:.03em;padding:3px 7px;border-radius:20px;text-transform:uppercase}
  .rptx span.rx-read.ineff{color:var(--rx-crit);background:var(--rx-crit-bg)}
  .rptx span.rx-read.eff{color:var(--rx-good);background:var(--rx-good-bg)}
  .rptx span.rx-read.hyper{color:var(--rx-ink);background:var(--rx-chip)}
  .rptx .rx-flag{font:800 9.5px/1 var(--rx-sans);text-transform:uppercase;letter-spacing:.03em}
  .rptx .rx-flag.in{color:var(--rx-good)} .rptx .rx-flag.over{color:var(--rx-crit)} .rptx .rx-flag.under{color:var(--rx-warn)}
  .rptx .rx-story{font-size:12px;color:var(--rx-ink);margin-top:10px;padding:11px 13px;border:1px solid var(--rx-line);border-radius:9px;background:var(--rx-fill)}
  .rptx .rx-cap{font:700 9.5px/1 var(--rx-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--rx-muted);margin-bottom:8px;display:flex;gap:13px;align-items:center;flex-wrap:wrap}
  .rptx .rx-cap .leg{display:inline-flex;align-items:center;gap:5px;color:var(--rx-muted2);font-weight:600;letter-spacing:0;text-transform:none;font-size:10px}
  .rptx .rx-cap .leg i{width:9px;height:9px;border-radius:2px;display:inline-block}
  /* footer */
  .rptx .rx-foot{border-top:1px solid var(--rx-line);padding:13px 30px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--rx-muted2)}
  .rptx .rx-foot .conf{font:700 8.5px/1 var(--rx-sans);letter-spacing:.13em;text-transform:uppercase}
  /* theme toggle control */
  .rpt-theme{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px}
  .rpt-theme button{border:0;background:transparent;color:var(--muted);font:700 12px/1 inherit;padding:6px 11px;border-radius:7px;cursor:pointer}
  .rpt-theme button.on{background:var(--accent);color:#fff}
  /* report structure builder */
  .rb-groups{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;align-items:stretch}
  .rb-group{flex:0 0 190px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px;display:flex;flex-direction:column;gap:8px}
  .rb-ghead{display:flex;align-items:center;gap:3px}
  .rb-gname{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;color:var(--text);font-size:12px;font-weight:800}
  .rb-gname:focus{outline:none;border-color:var(--accent2)}
  .rb-mv{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;padding:3px 4px;border-radius:5px}
  .rb-mv:hover:not(:disabled){background:var(--panel);color:var(--text)} .rb-mv:disabled{opacity:.3;cursor:default}
  .rb-del{border:0;background:transparent;cursor:pointer;font-size:12px;padding:3px 4px;border-radius:5px;opacity:.7}
  .rb-del:hover{opacity:1;background:var(--panel)}
  .rb-body{display:flex;flex-direction:column;gap:6px;min-height:36px;border-radius:8px}
  .rb-chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:11.5px;cursor:grab}
  .rb-chip:active{cursor:grabbing}
  .rb-chip .grip{color:var(--muted2,#6b7f92);letter-spacing:-1px}
  .rb-chip .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rb-chip .x{color:var(--muted);cursor:pointer;font-size:11px}
  .rb-chip .x:hover{color:var(--bad)}
  .rb-empty{font-size:10.5px;color:var(--muted2,#6b7f92);text-align:center;padding:8px 0;border:1px dashed var(--line);border-radius:7px}
  .rb-add{background:var(--panel);border:1px dashed var(--line);border-radius:7px;color:var(--muted);font-size:11px;padding:5px 7px;cursor:pointer}
  .rb-addgroup{flex:0 0 120px;border:1.5px dashed var(--line);border-radius:11px;background:transparent;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer}
  .rb-addgroup:hover{border-color:var(--accent);color:var(--accent)}
  .rb-avail{font-size:11px;color:var(--muted);margin-top:6px}
  /* slice 3: coach-note block + note-add tool */
  .rb-tools{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
  .rb-note{border:1.5px dashed var(--line);border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:12px;padding:7px 12px;cursor:pointer}
  .rb-note:hover{border-color:var(--accent);color:var(--accent)}
  .rb-toolnote{font-size:11px;color:var(--muted)}
  .rptx .rx-note-block{border:1px solid var(--rx-line);border-left:3px solid var(--rx-accent);border-radius:8px;background:var(--rx-fill);padding:13px 15px}
  .rptx .rx-nb-title{font:800 13px/1.3 var(--rx-sans);color:var(--rx-ink);letter-spacing:.01em}
  .rptx .rx-nb-body{font-size:12.5px;color:var(--rx-ink);line-height:1.55;margin-top:5px;white-space:pre-wrap}
  /* slice 3: inline value-edit chrome — screen-only, scoped under .rx-editing so it never bakes into the PDF */

/* ---------------- athlete session autosave ----------------

       so it reaches the coach live. A dead token is handled by KEEPING the local draft and
       retrying — never by dumping the athlete to the login screen. */
let _alogTimer=null, _alogDbTimer=null, _alogPending=new Set(), _alogDraft=null, _alogRestored=false;
function alogDraftKey(){ return (me_&&curSession)?('wlc_alog_'+me_.id+'_'+curSession.id):null; }

function alogClearStart(sid){ try{ localStorage.removeItem(alogStartKey(sid)); }catch(e){} }
function alogWriteDraft(){
  const k=alogDraftKey(); if(!k) return;
  try{ const snap={}; for(const id in logState){ const s=logState[id];
      snap[id]={reps:s.reps,kg:s.kg,lights:s.lights,effort:s.effort,miss:s.miss,done:s.done}; }
    localStorage.setItem(k, JSON.stringify({t:Date.now(), sets:snap})); }catch(e){}
}
function alogClearDraft(){ const k=alogDraftKey(); if(k){ try{ localStorage.removeItem(k); }catch(e){} } }
function alogLoadDraft(){   // call once at the top of a render, before rows are built
  const k=alogDraftKey(); if(!k){ _alogDraft=null; return; }

}

function alogTouch(id){   // called on every edit to a set row
  if(curSession) alogMarkStart(curSession.id);   // first edit of the session = training started (auto timer)
  if(id) _alogPending.add(id);
  if(_alogTimer) clearTimeout(_alogTimer);
  _alogTimer=setTimeout(alogWriteDraft, 250);   // local safety-net first, always
  alogSetStatus('saving');
  if(_alogDbTimer) clearTimeout(_alogDbTimer);
  _alogDbTimer=setTimeout(alogFlush, 1400);

async function alogFlush(){
  if(_alogDbTimer){ clearTimeout(_alogDbTimer); _alogDbTimer=null; }
  alogWriteDraft();                       // make sure the latest keystroke is on disk before we try the network
  if(!_alogPending.size) return;
  let sess=null; try{ sess=(await sb.auth.getSession()).data.session; }catch(e){}
  if(!sess){ alogSetStatus('offline'); return; }   // token lapsed — draft holds it; don't boot to login
  const ids=[..._alogPending];
  for(const id of ids){ const st=logState[id];
    if(!st){ _alogPending.delete(id); continue; }
    try{ const payload=setPayload(st);
      const res = st.logId ? await sb.from('logged_sets').update(payload).eq('id',st.logId).select()
                           : await sb.from('logged_sets').insert(payload).select();
      if(res.error || !res.data || !res.data.length){ alogSetStatus('offline'); return; }
      st.logId=res.data[0].id; _alogPending.delete(id);
    }catch(e){ alogSetStatus('offline'); return; }
  }
  alogSetStatus(_alogPending.size?'offline':'saved');
}

// ===================== MANUAL BAR-PATH (keyframes + monotone-cubic fill) =====================
// The coach taps the bar centre on a handful of frames; we fit a smooth, overshoot-limited curve
// THROUGH those taps and sample it at the video fps → a dense `track` identical in shape to the
// auto tracker's, so every downstream metric/chart/drift/save works unchanged. This is the
// guaranteed-accurate path when auto-detection can't be trusted (black plates, decoy plates, blur).
// PCHIP (Fritsch–Carlson monotone cubic) slopes for data (x=times, y=values) — no overshoot between taps.
function bpPchipSlopes(x,y){ const n=x.length; if(n<2) return [0];
  if(n===2){ const d=(y[1]-y[0])/((x[1]-x[0])||1); return [d,d]; }
  const h=[],del=[]; for(let i=0;i<n-1;i++){ h[i]=(x[i+1]-x[i])||1e-6; del[i]=(y[i+1]-y[i])/h[i]; }
  const m=new Array(n).fill(0);
  for(let i=1;i<n-1;i++){ if(del[i-1]*del[i]<=0){ m[i]=0; } else { const w1=2*h[i]+h[i-1], w2=h[i]+2*h[i-1]; m[i]=(w1+w2)/(w1/del[i-1]+w2/del[i]); } }
  m[0]=del[0]; m[n-1]=del[n-2];
  return m;
}
function bpPchipEval(x,y,m,t){ const n=x.length;
  if(t<=x[0]) return y[0]; if(t>=x[n-1]) return y[n-1];
  let i=0; while(i<n-1 && t>x[i+1]) i++;
  const h=(x[i+1]-x[i])||1e-6, s=(t-x[i])/h;
  const h00=2*s*s*s-3*s*s+1, h10=s*s*s-2*s*s+s, h01=-2*s*s*s+3*s*s, h11=s*s*s-s*s;

function bpKfBuildTrack(){

  const K=[]; for(const p of src){ if(K.length&&Math.abs(p.t-K[K.length-1].t)<1e-4) K[K.length-1]=p; else K.push(p); }
  if(K.length<2){ annS.track=null; annS.metrics=null; annS.trackSource=(annS.kf&&annS.kf.length)?'manual':null; return; }
  // pixel basis for scale + metrics (normalized→px uses _trackW/H). Prefer a grabbed frame; fall back to the
  // video's own dimensions so manual plotting + 📏 scale work even when pixel reads are blocked (cross-origin clips).
  if(!annS._trackW||!annS._trackH){ const v=document.getElementById('vstVid'); const fr=v?vstGrabGray(v):null;
    if(fr&&!fr.error){ annS._trackW=fr.w; annS._trackH=fr.h; }
    else if(v&&v.videoWidth){ const sc=Math.min(1,TRACK_MAXW/v.videoWidth); annS._trackW=Math.round(v.videoWidth*sc); annS._trackH=Math.round(v.videoHeight*sc); } }

// ===================== PLATE-CIRCLE DETECTION (gradient Hough) =====================
// We track the barbell PLATE as a CIRCLE, not a brightness patch. A circle's centre
// doesn't move when the plate spins (rotation-proof) and can't wander onto the lifter,
// which kills the old template-drift. The radius also self-calibrates (45 cm = plate Ø).
const BP_EDGE_MIN=70;       // Sobel |gx|+|gy| edge threshold (3-tap kernel, ~0..4300)

// 3-tap Sobel gradient at (x,y) of a gray frame — returns {gx,gy}
function bpGrad(g,w,x,y){

// ±r along its gradient direction (handles bright-on-dark and dark-on-bright plates).

  if(!v||!v.videoWidth){ bpHint('Video not ready yet.', true); return; }
  v.pause();

  const end=v.duration||start;

  const inp=document.createElement('input'); inp.className='ja-in'; inp.placeholder=`Label this ${deg}° (e.g. Knee @ lift-off) — Enter`;
  card.appendChild(inp); inp.focus();

  inp.addEventListener('blur',()=>commit(true));
}

function bpRender(){

  if(pinrow) pinrow.style.display=(hasTrack&&!annS.readOnly)?'flex':'none';

      const m=annS.metrics, tile=(v,l,t)=>`<div class="bp-tile"${t?` title="${t}"`:''}><div class="bp-v">${v}</div><div class="bp-l">${l}</div></div>`;
      const cm=v=>v==null?'—':Math.round(v*100)+' cm', scm=v=>v==null?'—':(v>=0?'+':'')+Math.round(v*100)+' cm';

      let pk=m.peak_vel;

        let mx=-Infinity; for(let i=lo;i<=hi&&i<vV.length;i++){ if(isFinite(vV[i])&&vV[i]>mx) mx=vV[i]; }

          m.phases.map(p=>`<div class="bp-ph-row"><span class="bp-ph-n">${p.name}</span><span class="bp-ph-d">${p.dur.toFixed(2)}s</span><span class="bp-ph-v">${p.vpk!=null?p.vpk.toFixed(2)+' m/s':'—'}</span></div>`).join('')+`</div>`

        tile(cm(m.peak_h_m),relLbl('Ymax · peak ht',m.peak_h_m),'Maximum bar height (Ymax). Elite ≈ 65–70% of standing height.')+
        tile(cm(m.catch_h_m),relLbl('Ycatch · catch ht',m.catch_h_m),'Bar height at the catch / fixation (Ycatch).')+
        tile(cm(m.crash_m),'Ydrop · drop','Ymax − Ycatch — how far the bar drops into the catch. Elite ≈ 13–17 cm.')+
        tile(m.catchrel!=null?m.catchrel+'%':'—','Catchrel · catch÷peak','Ycatch ÷ Ymax. Higher = caught nearer peak height. Elite ≈ 82–87%. (Inverse of the Aita TMC.)')+
        tile(m.theta1!=null?m.theta1+'°':'—','θ1 · pull angle','Angle of the start→rearmost-point (X1) line from vertical. Elite ≈ 5–10°.')+
        tile(cm(m.X1_m),'X1 · rearward','How far the bar travels toward you in the first pull (rearmost point). Elite ≈ 4–7 cm.')+
        tile(cm(m.X2_m),'X2 · anterior','Forward swing from X1 to the most anterior point before peak height. Elite ≈ 4–8 cm.')+
        tile(cm(m.Xloop_m),'Xloop · loop','Horizontal travel from X2 to the catch. Elite ≈ 8–15 cm.')+
        tile(cm(m.Xnet_m),'Xnet · net horiz','Net horizontal travel, start → catch. Elite ≈ 6–15 cm.')+
        (tr?tile('Type '+tr.k,'Trajectory',tr.note):'')+
        tile(m.pull_dur!=null?m.pull_dur.toFixed(2):'—','Pull time (s)','Lift-off → peak velocity.')+
        tile(m.pct_to_peak!=null?m.pct_to_peak+'%':'—','Peak speed @','How far into the pull peak velocity occurs (% of lift-off → catch). Later = a more patient, sustained second pull.')+
        phHtml;
    } else {
      tiles.style.display='block';
      tiles.innerHTML=`<div class="bp-tile"><div class="bp-v">Trace captured</div><div class="bp-l">Calibrate a plate for cm &amp; m/s</div></div>`;
    }
  }
  if(hint){ if(annS.readOnly){ hint.textContent=hasTrack?'Coach’s bar-path trace. Trend-grade, not lab-grade.':'No bar-path analysis on this clip.'; }
    else { hint.textContent=hasTrack?'Set the “Forward” arrow to match how the bar kicks off the hip in this clip. Scrub to the catch then 📍 Catch to pin the fixation point.':'Films best side-on, but slight angles track fine. Trend-grade, not lab-grade.'; } }
  bpgDraw();
}
// ---- Lift graph (time-series of velocity / displacement / accel / force / power, synced to the scrub) ----
const BPG_METRICS=[['velocity','Velocity'],['displacement','Displacement'],['acceleration','Acceleration'],['force','Force'],['power','Power']];
const BPG_VONLY={force:1,power:1};   // force & power are vertical-only

function bpgBuild(){

  // exact frame pixel dims + calibration the track was built with; the athlete never tracked, so
  // recomputing there collapses everything to ~0. Displaying the saved series is dimension-independent.
  if(annS.readOnly && annS._savedGraph && annS._savedGraph.velV && annS._savedGraph.velV.length){ annS.graph=annS._savedGraph; return; }

  const W=annS._trackW||1, H=annS._trackH||1;
  const sm=(a,w)=>a.map((_,i)=>{ let s=0,n=0; for(let k=-w;k<=w;k++){ const j=i+k; if(j>=0&&j<a.length){ s+=a[j]; n++; } } return s/n; });

  const powerV=load?velV.map((v,i)=>load*(accV[i]+g)*v):null;

function bpgArr(s){ const g=annS.graph; if(!g) return null; const h=s.axis==='h';

function bpgLoadRow(){ const inp=document.getElementById('bpgLoad'), note=document.getElementById('bpgLoadNote');

function bpgColor(k){ return k==='A'?'#3b82f6':'#ef4444'; }
function bpgChart(){

function bpgWireBrush(){ const cv=document.getElementById('bpgCanvas'); if(!cv) return; let down=null;

function recompute(){
  let pNL=0,aNL=0,accPNL=0,accANL=0,aTon=0,miss=0,planSets=0,doneSets=0,good=0,effSum=0,effN=0;
  const per=curExercises.map(ex=>{
    const acc=!!ex.acc;
    let e={name:ex.name,exId:ex.exId,acc,pNL:0,aNL:0,aTon:0,miss:0,sets:ex.setIds.length,done:0};
    ex.setIds.forEach(id=>{ const st=logState[id];
      const pr=parseInt(st.targetReps)||0, r=parseInt(st.reps)||0, k=num(st.kg), m=parseInt(st.miss)||0;
      planSets++; if(st.done){doneSets++;e.done++;}
      if(st.lights===3)good++;
      if(st.effort){effN++;effSum+=EFFN[st.effort];}
      e.pNL+=pr; e.aNL+=r; e.aTon+=r*k; e.miss+=m;
      if(acc){ accPNL+=pr; accANL+=r; } else { pNL+=pr; aNL+=r; }   // accessories tracked separately from primary volume
      aTon+=r*k; miss+=m;
    });
    return e;
  });
  const completion=planSets?Math.round(doneSets/planSets*100):0, avgEff=effN?EFFL[Math.round(effSum/effN)]:'—';
  const tile=(l,a,p)=>`<div class="ss-tile"><div class="ss-v">${a}${p!=null?`<span class="ss-p"> / ${p}</span>`:''}</div><div class="ss-l">${l}</div></div>`;
  const hasAcc=(accANL||accPNL);
  const volTile=`<div class="ss-tile"><div class="ss-v">${aNL}<span class="ss-p"> / ${pNL}</span>${hasAcc?`<span class="ss-acc" title="main lifts ${aNL}/${pNL} · accessory ${accANL}/${accPNL} · total ${aNL+accANL}/${pNL+accPNL}">+${accANL} acc · ${aNL+accANL} tot</span>`:''}</div><div class="ss-l">Volume (NL)${hasAcc?' · main lifts':''}</div></div>`;
  const tiles=`<div class="ss-tiles">${volTile}${tile('Tonnage',(aTon/1000).toFixed(1)+'t')}${tile('Set completion',completion+'%')}${tile('Good lifts',good+'/'+planSets)}${tile('Misses',miss)}${tile('Avg effort',avgEff)}</div>`;
  const lines=`<table class="ss-ex"><tbody>${per.map(e=>`<tr><td>${esc(e.name)}${e.acc?' <span class="acc-tag">acc</span>':''}</td><td>${e.done}/${e.sets} sets</td><td><b style="color:var(--text)">${e.aNL}</b> NL / ${e.pNL}</td><td>${(e.aTon/1000).toFixed(1)}t</td><td>${e.miss?`<span style="color:var(--bad)">${e.miss} miss</span>`:'<span style="color:var(--good)">clean</span>'}</td></tr>`).join('')}</tbody></table>`;
  const box=document.getElementById('ssBody'); if(box) box.innerHTML=tiles+lines;
  // live per-exercise progress badge in each (roll-up) header
  per.forEach(e=>{ const b=document.querySelector(`[data-exprog="${e.exId}"]`); if(!b) return;
    const allDone = e.sets>0 && e.done>=e.sets;
    b.textContent = allDone ? `✓ ${e.done}/${e.sets}` : `${e.done}/${e.sets} sets`;
    b.classList.toggle('done', allDone); });
}

async function submitCheckin(){
  const btn=document.getElementById('rkSubmit'), msg=document.getElementById('rkMsg');
  msg.style.color=''; msg.textContent='';
  const missing=RK_METRICS.filter(m=>rkState.vals[m[0]]==null).map(m=>m[1]);
  if(missing.length){ msg.style.color='var(--warn)'; msg.textContent='Tap a score for: '+missing.join(', '); return; }
  const { data:{ user } } = await sb.auth.getUser();
  if(!user || user.id!==me_.id){ msg.style.color='var(--bad)'; msg.textContent='⚠ Session expired — sign in again.'; return; }
  btn.disabled=true; btn.textContent='Sending…';
  const payload={ gym_id: me_.gym_id, athlete_id: me_.id, check_date: iso(new Date()),
    bodyweight: rkState.bodyweight===''||rkState.bodyweight==null?null:parseFloat(rkState.bodyweight),
    note: (rkState.note||'').trim()||null };
  RK_METRICS.forEach(m=>payload[m[0]]=rkState.vals[m[0]]);

}

// roll raw rows into per-region/side summaries (latest severity + weeks-reported persistence)
// Auto-archive: a twinge with no report in the last PAIN_ACTIVE_DAYS is treated as DISSIPATED —
// it drops off the active list, the persistent watch-flags and the heat-map (moves to `archived`).
const PAIN_ACTIVE_DAYS=14;
function painAggregate(rows){
  const by={}; (rows||[]).forEach(x=>{ const k=x.region+'|'+x.side; if(!by[k]) by[k]={ region:x.region, label:x.region_label||x.region, side:x.side, view:x.view||'front', latest:0, latestDate:null, peak:0, note:'', weeks:new Set(), count:0 };
    const e=by[k]; e.count++; e.weeks.add(painMonKey(x.report_date)); if(x.severity>e.peak) e.peak=x.severity;
    if(!e.latestDate || x.report_date>e.latestDate){ e.latestDate=x.report_date; e.latest=x.severity; e.note=x.note||''; } });
  const today=new Date(); const D=s=>new Date(s+'T00:00:00');
  const list=Object.values(by).map(e=>{ const daysSince=e.latestDate?Math.floor((today-D(e.latestDate))/864e5):9999; return { ...e, weeksN:e.weeks.size, daysSince, active:daysSince<=PAIN_ACTIVE_DAYS }; })
    .sort((a,b)=> (b.latest-a.latest)||(b.weeksN-a.weeksN));
  const active=list.filter(e=>e.active), archived=list.filter(e=>!e.active);
  const sevMap={}; active.forEach(e=>{ sevMap[e.region+'|'+e.side]=e.latest; });   // heat-map + watch-flags = ACTIVE twinges only
  const persistent=active.filter(e=>e.weeksN>=2 || e.peak>=7);
  return { list, active, archived, sevMap, persistent };
}

function homeTrendSVG(weeks){
  const W=720,H=230,pL=8,pR=8,pT=14,pB=26, iw=W-pL-pR, ih=H-pT-pB, n=weeks.length;
  const maxVol=Math.max(1,...weeks.map(w=>w.vol)), bw=Math.min(46, iw/n*0.55);
  const X=i=> pL + iw*(i+0.5)/n, Yr=r=> pT+ih - ih*((r||0)/5);
  let bars='',labels='';
  weeks.forEach((w,i)=>{ const x=X(i), h=ih*(w.vol/maxVol); bars+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+(pT+ih-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="3" fill="#e8643c" opacity="0.92"></rect>'; labels+='<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" font-size="11" fill="#7e93a6" text-anchor="middle">'+w.lbl+'</text>'; });
  const linePts=weeks.map((w,i)=> w.rd!=null? (X(i).toFixed(1)+','+Yr(w.rd).toFixed(1)) : null).filter(Boolean);
  const line=linePts.length>1?'<polyline points="'+linePts.join(' ')+'" fill="none" stroke="#3ec97a" stroke-width="2.4"></polyline>':'';
  let dots=''; weeks.forEach((w,i)=>{ if(w.rd!=null) dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Yr(w.rd).toFixed(1)+'" r="3.6" fill="#3ec97a"></circle>'; });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+bars+line+dots+labels+'</svg>';
}

function athWatchedSet(){ try{ return new Set(JSON.parse(localStorage.getItem('wlc:watched:'+(me_&&me_.id))||'[]')); }catch(e){ return new Set(); } }
function athWatchedMark(key){ try{ const s=athWatchedSet(); if(!s.has(key)){ s.add(key); localStorage.setItem('wlc:watched:'+(me_&&me_.id), JSON.stringify([...s])); } }catch(e){} }

async function loadAthReviews(){

// ---- weekly: auto review of the last completed week (Mon–Sun). Shared by the
//      athlete's Home panel and the coach's "This week" level. ----
async function weekReview(athleteId){
  const today=new Date(); today.setHours(0,0,0,0); const D=s=>new Date(s+'T00:00:00');
  const thisMon=new Date(today); thisMon.setDate(thisMon.getDate()-((thisMon.getDay()+6)%7));
  const lwStart=new Date(thisMon); lwStart.setDate(lwStart.getDate()-7); const lwEnd=new Date(thisMon); lwEnd.setDate(lwEnd.getDate()-1);
  const s0=iso(lwStart), s1=iso(lwEnd); const me=athleteId;
  const rdScoreOf=r=>{ const vs=RK_METRICS.map(m=>r[m[0]]).filter(v=>v!=null); return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null; };
  const sR=await sb.from('sessions').select('id,session_date,title,prescribed_exercises(prescribed_sets(target_reps,target_pct))').eq('athlete_id',me).neq('status','draft').gte('session_date',s0).lte('session_date',s1);
  const sess=sR.data||[]; const ids=sess.map(s=>s.id);
  let logs=[]; if(ids.length){ const r=await sb.from('logged_sets').select('session_id,done,miss,prescribed_set_id,actual_kg,actual_reps,lights,velocity').in('session_id',ids); logs=r.data||[]; }
  const rR=await sb.from('readiness').select('*').eq('athlete_id',me).gte('check_date',s0).lte('check_date',s1);
  const rd=rR.data||[];
  const planned=sess.length; const doneSet=new Set(logs.filter(l=>l.done).map(l=>l.session_id)); const doneN=doneSet.size;
  let tonnage=0; logs.forEach(l=>{ if(l.done&&l.actual_kg&&l.actual_reps) tonnage+=l.actual_kg*l.actual_reps; });
  const tonTxt=tonnage>=1000?(tonnage/1000).toFixed(1)+'K':(tonnage?String(Math.round(tonnage)):'—');
  let presN=0; sess.forEach(s=>(s.prescribed_exercises||[]).forEach(ex=>presN+=(ex.prescribed_sets||[]).length));
  const doneSets=logs.filter(l=>l.done&&l.prescribed_set_id).length; const compPct=presN?Math.round(doneSets/presN*100):null;
  const rdScores=rd.map(rdScoreOf).filter(v=>v!=null); const rdAvg=rdScores.length?rdScores.reduce((a,b)=>a+b,0)/rdScores.length:null;
  const withLights=logs.filter(l=>l.done&&l.lights!=null); const cleanN=withLights.filter(l=>l.lights===3).length; const cleanPct=withLights.length?Math.round(cleanN/withLights.length*100):null;
  const misses=logs.reduce((a,l)=>a+(l.miss||0),0);
  // auto focus
  let focus;
  if(!planned){ focus='Nothing was scheduled last week — a planned down week or a gap. This week starts fresh below.'; }
  else if(!doneN){ const bits=[`No sessions logged last week — ${planned} ${planned>1?'were':'was'} scheduled`];
    if(rdAvg!=null) bits.push(`but you kept up your check-ins (readiness ${rdAvg.toFixed(1)})`);
    focus=bits.join(' ')+'. Let’s get back on the page this week.'; }
  else { const bits=[`${doneN} of ${planned} session${planned>1?'s':''} done`];
    if(compPct!=null){ if(compPct>=90) bits.push('you finished what was on the page'); else if(compPct<70) bits.push(`a few sets slipped (${compPct}% of prescribed) — worth closing this week`); else bits.push(`${compPct}% of prescribed sets`); }
    if(rdAvg!=null){ if(rdAvg<3) bits.push('readiness ran low — bank some recovery'); else if(rdAvg>=4) bits.push('readiness held strong'); }
    if(cleanPct!=null&&withLights.length>=3){ if(cleanPct>=80) bits.push(`bar work was clean (${cleanPct}% made)`); else if(cleanPct<60) bits.push(`make-rate dipped to ${cleanPct}% — tighten the makeable attempts`); }
    focus=bits.join(' · ')+'.'; }
  // up next (current/next published session)
  const todayStr=iso(today);
  const nR=await sb.from('sessions').select('id,session_date,title,prescribed_exercises(name,position)').eq('athlete_id',me).neq('status','draft').gte('session_date',todayStr).order('session_date',{ascending:true}).limit(1);
  const nx=(nR.data||[])[0]; let upNext='';
  if(nx){ const exs=(nx.prescribed_exercises||[]).slice().sort((a,b)=>(a.position||0)-(b.position||0)).map(e=>e.name).filter(Boolean).slice(0,4);
    const lbl=nx.session_date===todayStr?'Today':D(nx.session_date).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
    upNext=`<div class="mrev-next" onclick="planOpenWeekAth('${nx.session_date}')"><div><div class="mrev-nlbl">Up next · ${esc(lbl)}</div><div class="mrev-nex">${esc(exs.join(' · ')||nx.title||'Training')}</div></div><span class="cta">${nx.session_date===todayStr?'Start →':'Preview →'}</span></div>`; }
  // recent pain (last 4 weeks) — surfaces in the athlete's My Review + the coach's week preview
  let painHtml='';
  if(PAIN_READY){ const pStart=new Date(today); pStart.setDate(pStart.getDate()-27);
    const pAgg=painAggregate(await loadPainRange(me, iso(pStart), todayStr));
    if(pAgg.list.length){
      const top=pAgg.list.slice(0,5).map(e=>`<span class="bm-chip ${painSevClass(e.latest)}"><span class="bm-cdot"></span>${esc(e.label)}${e.side!=='center'?' '+SIDE_LBL[e.side]:''} · ${e.latest}/10${e.weeksN>=2?' · '+e.weeksN+'w':''}</span>`).join('');
      painHtml=`<div class="mrev-pain"><div class="mrev-plbl">🩺 Recent pain · last 4 wks</div><div class="bm-chips">${top}</div></div>`;
      const fl=painFocusLine(pAgg); if(fl) focus += ' '+fl;
    }
  }
  const stat=(v,l,cls)=>`<div class="dev-stat"><div class="v ${cls||''}">${v}</div><div class="l">${l}</div></div>`;
  const statsHtml=`<div class="mrev-sub">Last week · ${fmtShort(s0)} – ${fmtShort(s1)}</div>
    <div class="dev-stats">
      ${stat(doneN+'/'+planned,'Sessions')}
      ${stat(tonTxt,'Tonnage (kg)')}
      ${stat(compPct!=null?compPct+'%':'—','Set completion',compPct!=null&&compPct>=90?'good':'')}
      ${stat(rdAvg!=null?rdAvg.toFixed(1):'—','Avg readiness',rdAvg!=null?(rdAvg>=4?'good':rdAvg>=3?'warn':''):'')}
      ${stat(cleanPct!=null?cleanPct+'%':'—','Clean lifts',cleanPct!=null&&cleanPct>=80?'good':'')}
      ${stat(String(misses),'Misses',misses?'warn':'')}
    </div>${painHtml}`;
  return { statsHtml, autoFocus:focus, upNextHtml:upNext, periodKey:iso(thisMon), weekStart:s0, weekEnd:s1 };
}

async function trWindows(athleteId, basis){

    const tp=await sb.from('profiles').select('team_id').eq('id',athleteId).maybeSingle();
    const teamId=tp.data?tp.data.team_id:null;
    const phR=await sb.from('plan_phases').select('*').order('start_date');
    const all=(phR.error?[]:(phR.data||[])).filter(p=>(!p.team_id||p.team_id===teamId)&&(p.level||'meso')==='meso');

  if(sn) s += sn.read==='ineff' ? `the snatch lags relative to the C&J (${Math.round(sn.eff*100)}% vs ${Math.round(sn.ratio*100)}% target) — a technique/speed priority, not a strength one. ` : `the snatch sits at ${Math.round(sn.eff*100)}% of the C&J — right on target. `;
  if(hy) s += `Biggest strength: ${hy.mv} (hyper-efficient, +${hy.gap.toFixed(0)}kg over ideal). `;
  if(inf) s += `Biggest gap to close: ${inf.mv} (${inf.gap.toFixed(0)}kg under ideal).`;
  return s.trim();
}

// "The climb" — competition total over time vs classification thresholds
function climbSVG(meets, cls){
  // Only plot FULL totals (both a snatch AND a clean & jerk were made) — a snatch-only / partial meet would otherwise
  // plot as if its lone lift were a total and show a false dip in the climb. Partial meets still appear in the meet list.
  const pts=meets.map(m=>({d:m.meet_date, t:((+m.best_snatch||0)+(+m.best_cj||0)), full:(m.best_snatch!=null&&m.best_cj!=null), name:m.meet_name||'Meet'})).filter(p=>p.full&&p.t>0).sort((a,b)=>a.d<b.d?-1:1);
  if(!pts.length) return '';
  const totals=pts.map(p=>p.t), tmax=Math.max(...totals), tmin=Math.min(...totals);
  const thr=cls?cls.thresholds.map((t,i)=>({t,name:cls.ranks[i]})):[];
  const shown=thr.filter(x=>x.t>=tmin*0.82 && x.t<=tmax*1.2);
  const ymax=Math.max(tmax,...shown.map(x=>x.t))*1.05, ymin=Math.min(tmin,...shown.map(x=>x.t))*0.9;
  const W=720,H=300,pL=40,pR=88,pT=16,pB=32,iw=W-pL-pR,ih=H-pT-pB,n=pts.length;
  const X=i=> n>1? pL+iw*(i/(n-1)) : pL+iw/2; const Y=v=> pT+ih-ih*((v-ymin)/(ymax-ymin||1));
  const thrLines=shown.map(x=>`<line x1="${pL}" y1="${Y(x.t).toFixed(1)}" x2="${W-pR}" y2="${Y(x.t).toFixed(1)}" stroke="#5a6b7a" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/><text x="${W-pR+6}" y="${(Y(x.t)+3).toFixed(1)}" font-size="10" fill="#8aa0b4">${esc(x.name)} ${x.t}</text>`).join('');
  const line=pts.length>1?`<polyline points="${pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.t).toFixed(1)).join(' ')}" fill="none" stroke="#e8643c" stroke-width="2.4"/>`:'';
  const D=s=>new Date(s+'T00:00:00');
  const stars=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.t).toFixed(1)}" r="5" fill="#e8b13c" stroke="#0c1116" stroke-width="1"/><text x="${X(i).toFixed(1)}" y="${(Y(p.t)-10).toFixed(1)}" font-size="10" fill="#e8b13c" text-anchor="middle" font-weight="800">${p.t}</text>`).join('');
  const lbls=pts.map((p,i)=> (i===0||i===n-1||n<=5)?`<text x="${X(i).toFixed(1)}" y="${H-8}" font-size="10" fill="#7e93a6" text-anchor="middle">${MONS[D(p.d).getMonth()]} ’${String(D(p.d).getFullYear()).slice(2)}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${thrLines}${line}${stars}${lbls}</svg>`;
}

  const headCard=(inner)=>`<div class="card"><div class="tr-head" style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2 style="margin:0">${esc(teamName)} · team roll-up</h2>${basisBtns}</div>${inner}</div>`;
  app.innerHTML = chrome + picker + headCard(`<div class="note sub" style="padding:6px 0">Scanning ${roster.length} athlete${roster.length>1?'s':''} — training response + recovery…</div>`);
  let results;
  try{ results=await Promise.all(roster.map(a=>trainingResponse(a.id,{basis}).then(tr=>({a,tr})).catch(()=>({a,tr:null})))); }
  catch(e){ app.innerHTML=chrome+picker+headCard(`<div class="note sub">Couldn't scan the team right now.</div>`); return; }
  const withData=results.filter(r=>r.tr&&r.tr.ok);
  const noData=results.filter(r=>!r.tr||!r.tr.ok);
  const avg=(fn)=>{ const vs=withData.map(r=>fn(r.tr)).filter(v=>v!=null); return vs.length? vs.reduce((a,b)=>a+b,0)/vs.length : null; };
  const rng=(fn)=>{ const vs=withData.map(r=>fn(r.tr)).filter(v=>v!=null); return vs.length? {min:Math.min.apply(null,vs),max:Math.max.apply(null,vs)} : null; };
  const aReady=avg(t=>t.rec.readiness), rReady=rng(t=>t.rec.readiness);
  const aLoad=avg(t=>t.rec.srpeWeekly), rLoad=rng(t=>t.rec.srpeWeekly);

  const nFlag=withData.filter(r=>r.tr.score>0).length;

  const pct=v=>v==null?'—':Math.round(v*100)+'%';
  const stat=(v,l,cls,sub)=>`<div class="dev-stat"><div class="v ${cls||''}">${v}</div><div class="l">${l}</div>${sub?`<div class="l" style="text-transform:none;letter-spacing:0;margin-top:4px">${sub}</div>`:''}</div>`;

/* ====================== Reports (coach -> athlete PDF) ======================
   Assemble a polished athlete report from data the app already has, render a

const REPORT_SECTIONS=[
  ['maxes','Current maxes'],

  ['methodology','Methodology metrics'],
  ['trends','Trends — load / readiness / bodyweight'],

  ['injury','Injury / pain'],

];

// default grouping (chapters) per level — the coach can then edit/add/delete/reorder
function reportDefaultGroups(level){
  const base=[
    {name:'Performance & Classification', mods:level==='macro'?['maxes','climb','meets']:['maxes','climb']},
    {name:'Training Analysis', mods:['methodology','trends','redflags']},
