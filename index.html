/* ---------------- methodology engine (methodology-spec §3) ---------------- */
// Rep-Max table: % of 1RM achievable for N reps (powers RI). Off-curve reps interpolate.
const REP_MAX_PCT={1:100,2:95,3:92.5,4:90,5:87.5,6:85,7:82.5,8:80,9:78.5,10:75,12:67,15:62,20:43};
const RM_KEYS=Object.keys(REP_MAX_PCT).map(Number).sort((a,b)=>a-b);
function repMaxPct(reps){ reps=Math.max(1,Math.round(reps||1));
  if(REP_MAX_PCT[reps]!=null) return REP_MAX_PCT[reps];
  if(reps<RM_KEYS[0]) return REP_MAX_PCT[RM_KEYS[0]];
  if(reps>RM_KEYS[RM_KEYS.length-1]){ const a=RM_KEYS[RM_KEYS.length-2], b=RM_KEYS[RM_KEYS.length-1]; const slope=(REP_MAX_PCT[b]-REP_MAX_PCT[a])/(b-a); return Math.max(1,REP_MAX_PCT[b]+slope*(reps-b)); }
  let lo=RM_KEYS[0], hi=RM_KEYS[RM_KEYS.length-1];
  for(let i=0;i<RM_KEYS.length-1;i++){ if(reps>RM_KEYS[i] && reps<RM_KEYS[i+1]){ lo=RM_KEYS[i]; hi=RM_KEYS[i+1]; break; } }
  return REP_MAX_PCT[lo]+((reps-lo)/(hi-lo))*(REP_MAX_PCT[hi]-REP_MAX_PCT[lo]);
}
// metrics from a list of {reps, pct} sets (pct = %1RM as a number, e.g. 80). per methodology §3b.
function liftMetrics(sets){
  let vol=0,volPri=0,volAcc=0,vw=0,pv=0,riw=0,inol=0,peak=0;
  (sets||[]).forEach(s=>{ const r=parseInt(s.reps)||0, p=parseFloat(s.pct)||0; if(!r) return; vol+=r;   // vol = TOTAL (back-compat)
    if(s.acc){ volAcc+=r; return; }   // accessory reps: tracked apart, EXCLUDED from primary volume + intensity (ARI/RI/INOL/peak)
    volPri+=r;
    if(p>0){ vw+=p*r; pv+=r; riw+=r*(p/repMaxPct(r)); if(p>peak)peak=p; inol+=r/Math.max(1,(100-p)); } });
  return { vol, volPri, volAcc, ari: pv?vw/pv:0, ri: pv?riw/pv:0, inol, peak, pv,
    _vw:vw, _riw:riw };   // _vw/_riw/pv let callers volume-weight a roll-up
}
function riDisplay(ri){ return ri? (ri*10).toFixed(1) : '—'; }   // RI on a 0–10 (RPE-like) scale per spec
function statsFor(sessRows, logs){
  let vol=0, volPri=0, volAcc=0, vw=0, pv=0, peak=0, totalSets=0;
  (sessRows||[]).forEach(s=>(s.prescribed_exercises||[]).forEach(ex=>{
    const acc=exIsAcc(ex);
    (ex.prescribed_sets||[]).forEach(ps=>{
      const r=ps.target_reps||0, p=ps.target_pct!=null?parseFloat(ps.target_pct):0;
      vol+=r; totalSets++;
      if(acc){ volAcc+=r; return; }   // accessories: separate bucket, out of primary vol + ARI/peak
      volPri+=r; if(p&&r){ vw+=p*r; pv+=r; if(p>peak)peak=p; }
    });
  }));
  let miss=0, done=0, added=0;
  (logs||[]).forEach(l=>{ miss+=(l.miss||0); if(l.done) done++; if(!l.prescribed_set_id) added++; });
  return { vol, volPri, volAcc, ari: pv?vw/pv:0, peak, miss, done, total: totalSets+added, sessions:(sessRows||[]).length };
}

let ed = null;   // open day-editor state

function rnd1(n){ return Math.round(n); }
// classify one movement -> the canonical lift it should price off (handles abbreviations).
// pulls/DLs/extensions price off the DL; snatch/clean variations off the comp lift.
function classifyLift(seg){
  const s=(seg||'').toLowerCase();
  const sn=/snatch/.test(s)||/\bsn\b/.test(s);
  const cl=/clean/.test(s)||/\bcl\b/.test(s);
  const jk=/\bjerk\b/.test(s)||/\bjk\b/.test(s);
  const pull=/\b(dl|deadlift|pull|extension|ext|rdl|high\s*pull|halting|segment)\b/.test(s);
  const squat=/squat/.test(s);
  const press=/press/.test(s);
  if(/front\s*squat/.test(s)) return 'Front Squat';
  if(/(overhead|oh)\s*squat/.test(s)) return 'Snatch';       // OH squat = snatch family
  if(squat && !sn && !cl) return 'Back Squat';
  if(press) return 'Push Press';
  if(sn) return pull ? 'Snatch DL' : 'Snatch';
  if(cl && jk) return 'Clean & Jerk';
  if(cl) return pull ? 'Clean DL' : 'Clean';
  if(jk) return 'Jerk';
  return null;
}
// "main lift" = the competition lifts + squats + pulls/DLs (snatch/clean/jerk, squats, pulls & deadlifts).
// Everything else (presses, KB work, curls, extensions, GHR, …) is accessory. Coach can override per-exercise:
//   category==='accessory' → force accessory · category==='main' → force main · else auto by name.
function mainLiftName(name){ const s=(name||'').toLowerCase(); if(!s.trim()) return false;
  if(/snatch|clean|jerk|\bsn\b|\bcj\b|\bc&j\b/.test(s)) return true;         // O-lifts + variations
  if(/squat/.test(s)) return true;                                          // squats (front/back/OH/pause…)
  if(/\b(pull|deadlift|dead\s*lift|dl|rdl|sldl)\b/.test(s)) return true;     // pulls & deadlifts
  return false; }
function exIsMain(ex){ const c=((ex&&ex.category)||'').toLowerCase();
  if(c==='accessory') return false; if(c==='main') return true; return mainLiftName(ex&&ex.name); }
function exIsAcc(ex){ return !exIsMain(ex); }
// resolve a movement name -> {kg, lift}. For a complex (A + B [+ C]), the LAST movement drives the load.
function ormResolveName(name, maxes){
  if(!maxes||!name) return null;
  if(maxes[name]!=null) return {kg:maxes[name], lift:name};         // exact custom-lift match
  const segs=String(name).split('+').map(s=>s.trim()).filter(Boolean);
  const last=segs.length?segs[segs.length-1]:name;
  let lift=classifyLift(last) || classifyLift(name);
  if(lift && maxes[lift]!=null) return {kg:maxes[lift], lift};
  // fall back to whatever lift in the whole name has a max (first hit)
  for(const seg of segs.length?segs:[name]){ const l=classifyLift(seg); if(l && maxes[l]!=null) return {kg:maxes[l], lift:l}; }
  return null;
}
// the load base for an exercise, honouring a per-exercise override (a kg number OR a lift name).
function resolveBase(ex, maxes){
  maxes = maxes || (cw&&cw.maxes);
  const ov=(ex && ex.baseOverride||'').trim();
  if(ov){
    if(/^[0-9]+(\.[0-9]+)?$/.test(ov)) return { kg:parseFloat(ov), lift:ov+'kg', override:true };
    const r=ormResolveName(ov, maxes); if(r) return { kg:r.kg, lift:r.lift, override:true };
    return { kg:null, lift:ov, override:true, missing:true };       // named override with no max on file
  }
  return ormResolveName(ex&&ex.name, maxes);
}

async function propagateTeamEdit(ctx){
  const src=(await sb.from('sessions').select(SESSION_SELECT).eq('id', ctx.repSessId).single()).data;
  if(!src) return { applied:0, created:0, skippedLogged:0 };
  const newTitle=(src.title||'Training').trim()||'Training';   // honor a title change
  const others=(ctx.athIds||[]).filter(id=>id!==ctx.repAthId);
  let applied=0, created=0, skippedLogged=0;
  for(const aid of others){
    // this athlete's session(s) that day — prefer the one matching the ORIGINAL title
    const { data: matches } = await sb.from('sessions').select('id,title').eq('athlete_id', aid).eq('session_date', ctx.date);
    let target=(matches||[]).find(m=>(m.title||'').toLowerCase()===(ctx.title||'').toLowerCase()) || (matches||[])[0];
    if(target){
      const { data: lg } = await sb.from('logged_sets').select('id').eq('session_id', target.id).limit(1);
      if(lg && lg.length){ skippedLogged++; continue; }   // already logged → leave it
      await sb.from('sessions').update({ title:newTitle }).eq('id', target.id);
      await replaceSessionStructure(target.id, src);
      applied++;
    } else {
      await cloneSessionFor(src, ctx.date, aid, src.status==='published'?'published':'draft');
      created++;
    }
  }
  return { applied, created, skippedLogged };
}

function buildReviewQueue(){

  const athName=(cw&&cw.ath&&cw.ath.full_name)||'', athId=(cw&&cw.ath&&cw.ath.id)||(cw&&cw.athId)||'';

    if(type==='weight') return reps+' × '+(st.kg||'–')+'kg';
    if(type==='percentage'){ const p=tgtValOf(st,type); return reps+' × '+(p?p+'%':'%'); }
    if(type==='vbt'){ const p=tgtValOf(st,type); return reps+' × '+(p?'≥'+p+' m/s':'VBT'); }
    const p=tgtValOf(st,type); return reps+' × '+(p?p+' '+type.toUpperCase():type); };
  const q=[];
  ed.exercises.forEach((ex,ei)=>{ const type=ex.loadType||'percentage'; const sets=ex.sets||[];
    sets.forEach((st,si)=>{ const lg=st.id?logBySet[st.id]:null;
      if(lg&&lg.video_path) q.push({ path:lg.video_path, athleteId:athId, athName, exName:ex.name||'Lift', exIdx:ei, setNo:si+1, setTotal:sets.length, target:tgtStr(st,type), load:(lg.load_kg!=null?lg.load_kg:(type==='weight'?st.kg:null)) }); });
    // athlete-added sets with a clip
    ed.logs.filter(l=>!l.prescribed_set_id && l.exercise_id===ex.id && l.video_path)
      .forEach((l,j)=>q.push({ path:l.video_path, athleteId:athId, athName, exName:ex.name||'Lift', exIdx:ei, setNo:'+'+(j+1), setTotal:sets.length, target:'added by athlete', added:true, load:(l.load_kg!=null?l.load_kg:null) }));
  });

function ssRuns(list){ const runs=[]; let i=0; const a=list||[];

async function renderRollup(){
  const host=document.getElementById('cvRollup'); if(!host||!ed||!cw) return;
  const needFetch = !cw.rollupCache || (cw.block && !cw.rollupCache.block) || !cw.rollupCache.all;
  if(needFetch && !host.querySelector('table.ru')){
    host.innerHTML=`<div class="card"><h2 style="margin:0 0 4px">Metric rollup</h2><div class="sub" style="margin-bottom:8px">This session, then up the hierarchy.</div><div class="spin" style="padding:12px">computing…</div></div>`;
  }
  try{
    if(!cw.rollupCache) cw.rollupCache={};
    if(cw.block && !cw.rollupCache.block){
      const { data: bs } = await sb.from('sessions')
        .select('id,session_date,prescribed_exercises(category,prescribed_sets(target_reps,target_pct))')
        .eq('athlete_id', cw.athId).gte('session_date', cw.block.start_date).lte('session_date', cw.block.end_date);
      const bids=(bs||[]).map(x=>x.id);
      let blogs=[];
      if(bids.length){ const { data: bl } = await sb.from('logged_sets').select('miss,done,session_id,prescribed_set_id').in('session_id', bids); blogs=bl||[]; }
      cw.rollupCache.block={ rows:bs||[], logs:blogs };
    }
    if(!cw.rollupCache.all){
      const { data: as_ } = await sb.from('sessions')
        .select('id,session_date,prescribed_exercises(category,prescribed_sets(target_reps,target_pct))')
        .eq('athlete_id', cw.athId);
      const aids=(as_||[]).map(x=>x.id);
      let alogs=[];
      if(aids.length){ const { data: al } = await sb.from('logged_sets').select('miss,done,session_id,prescribed_set_id').in('session_id', aids); alogs=al||[]; }
      cw.rollupCache.all={ rows:as_||[], logs:alogs };
    }
  }catch(e){ if(!cw.rollupCache) cw.rollupCache={}; /* blocks table may be missing */ }
  paintRollup();
}

    if(t.dataset.f==='baseovr'){ ex.baseOverride=t.value; ed.dirty=true;
      cvxRefreshBase(cvx, ex);

      if(type==='percentage'){ ex.sets.forEach(st=>{ const p=parseFloat(st.pct); st.kg=(base!=null && !isNaN(p))?rnd1(base*p/100):''; });

      else { const drop=cur-want;

        ex.sets.splice(si+want, drop); }
      ed.dirty=true; paintEditor();

      const si=+tr.dataset.si, cnt=+(tr.dataset.count||1);
      for(let k=0;k<cnt;k++){ const st=ex.sets[si+k]; if(st && st.id) ex.delSets.push(st.id); }
      ex.sets.splice(si, cnt); ed.dirty=true; paintEditor(); return; }
    const cu=e.target.closest('.cue-x');
    if(cu){ const cvx=cu.closest('.cvx'); const ex=ed.exercises[+cvx.dataset.ei];
      ex.cues.splice(+cu.dataset.ci,1); ed.dirty=true; paintEditor(); return; }
    const ca=e.target.closest('[data-cue]');

    const sc=e.target.closest('[data-scheme]');

    const cs=e.target.closest('[data-copysets]');
    if(cs){ const ei=+cs.closest('.cvx').dataset.ei;
      if(document.activeElement && document.activeElement.blur) document.activeElement.blur();   // commit a pending Sets-count edit (which repaints) before anchoring the menu
      const btn=document.querySelector(`.cvx[data-ei="${ei}"] [data-copysets]`)||cs;             // re-find the button after any repaint so the menu anchors correctly

    const dx=e.target.closest('[data-delex]');
    if(dx){ if(!dx.classList.contains('arm')){ dx.classList.add('arm'); dx.textContent='remove?';
        setTimeout(()=>{ if(dx.isConnected){ dx.classList.remove('arm'); dx.textContent='✕ remove'; } },3500); return; }
      const cvx=dx.closest('.cvx'); const ei=+cvx.dataset.ei; const ex=ed.exercises[ei];
      if(ex.id) ed.delExs.push(ex.id);
      ed.exercises.splice(ei,1); ed.dirty=true; paintEditor(); return; }
    if(e.target.id==='edAddEx' || e.target.closest('#edAddEx')){
      ed.exercises.push({id:null,name:'',note:'',category:'primary',loadType:'percentage',cues:[],sets:[{id:null,reps:'',pct:'',kg:'',vel:'',eff:''}],delSets:[]});
      ed.dirty=true; paintEditor(); return; }
    if(e.target.id==='edSave'){ saveEditor(false); return; }
    if(e.target.id==='edPublish' || e.target.id==='edPublish2'){ saveEditor(true); return; }
    if(e.target.id==='edUnpublish'){ saveEditor('draft'); return; }
    if(e.target.id==='edCopyOpen'){ const ui=document.getElementById('edCopyUI'); ui.style.display = ui.style.display==='none'?'inline-flex':'none'; return; }

    const ds=e.target.closest('#edDelSess');
    if(ds){ if(!ds.classList.contains('arm')){ ds.classList.add('arm'); ds.textContent='delete session?';
        setTimeout(()=>{ if(ds.isConnected){ ds.classList.remove('arm'); ds.textContent='✕ session'; } },3500); return; }
      deleteSession(); return; }
  });

function schemeExpand(n,reps,shape,top,rampFrom,amp){
  const out=[];
  for(let i=0;i<n;i++){
    let v=top;
    if(shape==='ramp' && n>1) v=top-rampFrom + rampFrom*(i/(n-1));
    if(shape==='wave') v=(i%2===0)?top-amp:top;
    out.push({reps:reps, val:Math.round(v*100)/100});
  }
  return out;
}

window.applyLibScheme=function(){
  if(schLib.scope==='block') return applyAcrossBlock();
  const s=libSelected(); const ex=ed&&ed.exercises[schemeTarget];
  if(!s||!ex) return;
  const weekRows=(s.data||[])[schLib.wk]||[];
  if(!weekRows.length) return;
  const built=schemeRowsToSets(weekRows, ex.name);
  ex.loadType=built.loadType;
  ex.sets.forEach(st=>{ if(st.id) ex.delSets.push(st.id); });
  ex.sets=built.sets;
  ed.dirty=true;
  document.getElementById('schemeModal').style.display='none';
  paintEditor();
};
function addDaysIso(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return iso(d); }
window.applyAcrossBlock=async function(){
  const s=libSelected(); const ex=ed&&ed.exercises[schemeTarget];
  if(!s||!ex) return;
  if(ed.dirty){ edMsgSet('Save your current changes first, then lay the scheme across the weeks.','var(--warn)'); return; }
  const exName=(ex.name||'').trim(); if(!exName){ edMsgSet('Give the exercise a name first.','var(--warn)'); return; }
  const btn=document.getElementById('slApply'); if(btn){ btn.disabled=true; btn.textContent='Applying…'; }
  const totalW=(s.data||[]).length;
  // anchor at the source session's week, then lay each scheme week forward on the SAME weekday (creating sessions as needed)
  const D0=new Date(ed.session.session_date+'T00:00:00');
  const srcMon=mondayOfDate(D0), dow=((D0.getDay()+6)%7);   // dow: 0=Mon … 6=Sun
  const baseTitle=ed.session.title||'Training';
  let updated=0, createdEx=0, createdSess=0, blank=0;
  try{
    for(let w=0; w<totalW; w++){
      const weekRows=(s.data||[])[w]||[];
      if(!weekRows.length){ blank++; continue; }              // scheme week has no rows — skip
      const built=schemeRowsToSets(weekRows, exName);
      const td=new Date(srcMon); td.setDate(td.getDate()+w*7+dow); const targetDate=iso(td);
      const { data: daySess } = await sb.from('sessions')
        .select('id,prescribed_exercises(id,name,position,prescribed_sets(id))')
        .eq('athlete_id', cw.athId).eq('session_date', targetDate);
      let tgt=null, sessOnDay=(daySess||[])[0]||null;
      (daySess||[]).forEach(se=>(se.prescribed_exercises||[]).forEach(e=>{ if((e.name||'').trim().toLowerCase()===exName.toLowerCase()) tgt={exId:e.id, setIds:(e.prescribed_sets||[]).map(x=>x.id)}; }));
      let exId;
      if(tgt){
        // existing matching exercise → replace its sets
        exId=tgt.exId;
        if(tgt.setIds.length){ const r=await sb.from('prescribed_sets').delete().in('id', tgt.setIds); if(r.error) throw r.error; }
        if(LT_READY){ await sb.from('prescribed_exercises').update({load_type:built.loadType}).eq('id', exId); }
        updated++;
      } else {
        // no matching exercise this week → create the session (if the day is empty) + the exercise
        let sid, pos=0;
        if(sessOnDay){ sid=sessOnDay.id; pos=(sessOnDay.prescribed_exercises||[]).length; }
        else { const si=await sb.from('sessions').insert({ gym_id:me_.gym_id, athlete_id:cw.athId, session_date:targetDate, title:baseTitle, status:'draft' }).select().single(); if(si.error) throw si.error; sid=si.data.id; createdSess++; }
        const exIns={ gym_id:me_.gym_id, session_id:sid, position:pos, name:exName, category:ex.category||'primary' };
        if(LT_READY){ exIns.load_type=built.loadType; }
        const ei=await sb.from('prescribed_exercises').insert(exIns).select().single(); if(ei.error) throw ei.error;
        exId=ei.data.id; createdEx++;
      }
      const rows=built.sets.map((st,pos)=>{ const row={ gym_id:me_.gym_id, exercise_id:exId, position:pos,
        target_reps: st.reps===''?null:parseInt(st.reps,10), target_pct: st.pct===''?null:parseFloat(st.pct),
        target_kg: st.kg===''?null:parseFloat(st.kg), target_text: targetText(st, built.loadType) };
        if(LT_READY){ row.target_vel=null; row.target_eff=null; } return row; });
      if(rows.length){ const r=await sb.from('prescribed_sets').insert(rows); if(r.error) throw r.error; }
    }
    const _sm=document.getElementById('schemeModal'); if(_sm) _sm.style.display='none';
    if(cw){ cw.rollupCache=null; }
    await renderCoachDay();                                    // refresh the open editor (new sessions in other weeks show when the day modal closes)
    const parts=[]; if(updated) parts.push(updated+' updated'); if(createdEx) parts.push(createdEx+' added'+(createdSess?' ('+createdSess+' new session'+(createdSess===1?'':'s')+')':''));
    const n=updated+createdEx;
    edMsgSet('✓ Applied "'+s.name+'" across '+n+' week'+(n===1?'':'s')+(parts.length?' — '+parts.join(', '):'')+(blank?' · '+blank+' scheme week'+(blank===1?'':'s')+' blank':''), n?'var(--good)':'var(--warn)');
    setTimeout(()=>edMsgSet(''),6000);
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Apply across block →'; } edMsgSet('Apply across block failed — '+(e.message||e),'var(--bad)'); console.error('applyAcrossBlock:',e); }
};

function paintTweak(){

    }).join('')+'</tr>';

  const box=document.querySelector('#schemeModal .vid-box'); if(box) box.classList.add('sch-wide');
  const grid=document.querySelector('.tw-grid');
  grid.addEventListener('input', e=>{ const t=e.target.closest('.tw-in'); if(!t) return;
    const wi=+t.dataset.w, i=+t.dataset.i, f=t.dataset.f, wk=tweak.weeks[wi];
    while(wk.length<=i) wk.push({});

window.saveTweak=async function(){
  const name=(document.getElementById('twName').value||'').trim();
  if(!name){ toast('Give the scheme a name.'); return; }
  const weeks=tweak.weeks.map(wk=>wk.filter(r=>r&&(r.s!=null||r.r!=null||r.p!=null)).map(r=>({s:r.s!=null?r.s:1,r:r.r!=null?r.r:null,p:r.p!=null?r.p:null}))).filter(wk=>wk.length);
  if(!weeks.length){ toast('Add at least one set.'); return; }
  const repsAll=weeks.reduce((a,wk)=>a.concat(wk.map(r=>r.r).filter(Boolean)),[]);
  const freq={}; let reps_mode=null,best=0; repsAll.forEach(r=>{ freq[r]=(freq[r]||0)+1; if(freq[r]>best){best=freq[r];reps_mode=r;} });
  const payload={ gym_id:me_.gym_id, name, movement:tweak.movement||null, phase:tweak.phase||null, pattern:tweak.pattern||null, weeks:weeks.length, reps_mode, data:weeks };
  const res=await sb.from('schemes').insert(payload).select();
  if(res.error||!res.data||!res.data.length){ toast('Save failed — '+(res.error?res.error.message:'try again')); return; }
  schLib.rows.unshift(res.data[0]); schLib.selId=res.data[0].id; schLib.wk=0; schLib.q='';
  paintSchemeLib();
};
function schemeUnit(){ const ex=ed&&ed.exercises[schemeTarget]; const t=ex?(ex.loadType||'percentage'):'percentage';
  return t==='percentage'?'%':(t==='vbt'?'m/s':(t==='weight'?'kg':(t==='rpe'?'RPE':(t==='rir'?'RIR':''))));

window.applyScheme=()=>{
  const ex=ed.exercises[schemeTarget]; if(!ex) return;
  const v={sets:+document.getElementById('schSets').value||1,reps:+document.getElementById('schReps').value||1,
    shape:document.getElementById('schShape').value,top:parseFloat(document.getElementById('schTop').value)||0,
    rampFrom:parseFloat((document.getElementById('schRamp')||{}).value)||10,amp:parseFloat((document.getElementById('schAmp')||{}).value)||4};
  const type=ex.loadType||'percentage';
  const orm=type==='percentage'?oneRMFor(ex.name):null;

  ex.sets=schemeExpand(v.sets,v.reps,v.shape,v.top,v.rampFrom,v.amp).map(r=>{
    const st={id:null,reps:r.reps,pct:'',kg:'',vel:'',eff:''};

  });

};
async function cvCopyDay(targetDate){
  const go=document.getElementById('edCopyGo'); if(go){ go.disabled=true; go.textContent='Copying…'; }
  try{
    if(ed.dirty) throw new Error('save your changes first, then copy');
    const { data: ns, error: se } = await sb.from('sessions').insert({
      gym_id: me_.gym_id, athlete_id: coachState.selected, session_date: targetDate,
      title: ed.session.title||'Training', status:'draft' }).select().single();
    if(se) throw se;
    for(let ei=0; ei<ed.exercises.length; ei++){
      const ex=ed.exercises[ei]; if(!ex.name.trim()) continue;
      const exIns={ gym_id: me_.gym_id, session_id: ns.id, position: ei, name: ex.name.trim(),
        category: ex.category||'primary', coach_note: ex.note.trim()||null };
      if(LT_READY){ exIns.load_type=ex.loadType||'percentage'; exIns.cues=(ex.cues&&ex.cues.length)?ex.cues:null; }
      const { data: ne, error: ee } = await sb.from('prescribed_exercises').insert(exIns).select().single();
      if(ee) throw ee;
      const rows = ex.sets
        .filter(st=>!(st.reps==='' && st.pct==='' && st.kg==='' && (st.vel===''||st.vel==null) && (st.eff===''||st.eff==null)))
        .map((st,si)=>{ const row={ gym_id: me_.gym_id, exercise_id: ne.id, position: si,
          target_reps: st.reps===''?null:parseInt(st.reps,10),
          target_pct: st.pct===''?null:parseFloat(st.pct),
          target_kg: st.kg===''?null:parseFloat(st.kg),
          target_text: targetText(st, ex.loadType) };
          if(LT_READY){ row.target_vel=st.vel===''||st.vel==null?null:parseFloat(st.vel); row.target_eff=st.eff===''||st.eff==null?null:parseFloat(st.eff); }
          return row; });
      if(rows.length){ const { error: re } = await sb.from('prescribed_sets').insert(rows); if(re) throw re; }
    }
    document.getElementById('edCopyUI').style.display='none';
    edMsgSet('✓ Copied to '+fmtDate(targetDate)+' as a draft','var(--good)');
    setTimeout(()=>edMsgSet(''),4000);
  }catch(e2){

}

async function deleteSession(){
  const id=ed.session.id;
  const res=await sb.from('sessions').delete().eq('id', id).select();
  if(res.error){ edMsgSet('⚠ Delete failed — '+res.error.message,'var(--bad)'); return; }
  // success — even if 0 rows came back (already deleted elsewhere)
  if(cw && cw.sessByDate && cw.sessByDate[cw.selDate]){
    cw.sessByDate[cw.selDate]=cw.sessByDate[cw.selDate].filter(s=>s.id!==id);
    if(!cw.sessByDate[cw.selDate].length) delete cw.sessByDate[cw.selDate];
  }
  if(cw){ cw.selSess=null; cw.rollupCache=null; }
  ed=null;
  renderCoachPanel();
}
function targetText(st, type){
  const r=st.reps===''||st.reps==null?null:parseInt(st.reps,10);
  const p=st.pct===''||st.pct==null?null:parseFloat(st.pct);
  const k=st.kg===''||st.kg==null?null:parseFloat(st.kg);
  const v=st.vel===''||st.vel==null?null:parseFloat(st.vel);
  const e=st.eff===''||st.eff==null?null:parseFloat(st.eff);
  type=type||'percentage';
  if(type==='vbt'){ if(r!=null&&v!=null) return `${r} @ ≥${v.toFixed(2)} m/s${k!=null?` (${k}kg)`:''}`; if(r!=null) return `${r} reps · VBT`; return '—'; }
  if(type==='rpe'){ if(r!=null&&e!=null) return `${r} @ RPE ${e}`; if(r!=null) return `${r} reps`; return '—'; }
  if(type==='rir'){ if(r!=null&&e!=null) return `${r} @ ${e} RIR`; if(r!=null) return `${r} reps`; return '—'; }
  if(type==='open'){ return r!=null?`${r} reps · open`:'open set'; }
  if(type==='weight'){ if(r!=null&&k!=null) return `${r} × ${k}kg`; if(k!=null) return `${k}kg`; if(r!=null) return `${r} reps`; return '—'; }
  if(r!=null&&p!=null&&k!=null) return `${r} @ ${p}% (${k}kg)`;
  if(r!=null&&k!=null) return `${r} × ${k}kg`;
  if(r!=null) return `${r} reps`;
  if(k!=null) return `${k}kg`;
  return '—';
}
async function saveEditor(publishAfter, opts){
  opts=opts||{}; const auto=!!opts.auto;
  const btn=auto?null:document.getElementById('edSave'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  if(!auto) edMsgSet('');
  try{
    const { data:{ user } } = await sb.auth.getUser();
    if(!user || user.id!==me_.id) throw new Error('login mismatch — sign out and back in');
    const s=ed.session;
    // session title (+ optional publish/unpublish toggle)
    const sessPatch={ title:(s.title||'Training').trim()||'Training' };
    if(publishAfter===true) sessPatch.status='published';
    else if(publishAfter==='draft') sessPatch.status='draft';
    const su=await sb.from('sessions').update(sessPatch).eq('id', s.id).select();
    if(su.error || !su.data || !su.data.length) throw (su.error||new Error('session update rejected'));
    // removed exercises / sets
    if(ed.delExs.length){ const r=await sb.from('prescribed_exercises').delete().in('id', ed.delExs); if(r.error) throw r.error; }
    for(const ex of ed.exercises){ if(ex.delSets.length){ const r=await sb.from('prescribed_sets').delete().in('id', ex.delSets); if(r.error) throw r.error; } }
    // upsert exercises + sets
    for(let ei=0; ei<ed.exercises.length; ei++){
      const ex=ed.exercises[ei];
      if(!ex.name.trim()){ continue; }
      if(ex.id){
        const exPatch={ name:ex.name.trim(), coach_note:ex.note.trim()||null, position:ei, category:ex.category||'primary' };
        if(LT_READY){ exPatch.load_type=ex.loadType||'percentage'; exPatch.cues=(ex.cues&&ex.cues.length)?ex.cues:null; }
        if(OVR_READY){ exPatch.base_override=(ex.baseOverride||'').trim()||null; }
        if(SS_READY){ exPatch.superset_group=ex.ssGroup!=null?ex.ssGroup:null; }
        const r=await sb.from('prescribed_exercises').update(exPatch).eq('id', ex.id).select();
        if(r.error) throw r.error;
      } else {
        const exIns={ gym_id:me_.gym_id, session_id:s.id, position:ei, name:ex.name.trim(), category:ex.category||'primary', coach_note:ex.note.trim()||null };
        if(LT_READY){ exIns.load_type=ex.loadType||'percentage'; exIns.cues=(ex.cues&&ex.cues.length)?ex.cues:null; }
        if(OVR_READY){ exIns.base_override=(ex.baseOverride||'').trim()||null; }
        if(SS_READY){ exIns.superset_group=ex.ssGroup!=null?ex.ssGroup:null; }
        const r=await sb.from('prescribed_exercises').insert(exIns).select().single();
        if(r.error) throw r.error; ex.id=r.data.id;
      }
      for(let si=0; si<ex.sets.length; si++){
        const st=ex.sets[si];
        const empty = st.reps==='' && st.pct==='' && st.kg==='' && (st.vel===''||st.vel==null) && (st.eff===''||st.eff==null);
        if(empty && !st.id) continue;
        const payload={ gym_id:me_.gym_id, exercise_id:ex.id, position:si,
          target_reps: st.reps===''?null:parseInt(st.reps,10),
          target_pct: st.pct===''?null:parseFloat(st.pct),
          target_kg: st.kg===''?null:parseFloat(st.kg),
          target_text: targetText(st, ex.loadType) };
        if(LT_READY){ payload.target_vel = st.vel===''||st.vel==null?null:parseFloat(st.vel); payload.target_eff = st.eff===''||st.eff==null?null:parseFloat(st.eff); }
        if(st.id){ const r=await sb.from('prescribed_sets').update(payload).eq('id', st.id).select(); if(r.error) throw r.error; }
        else { const r=await sb.from('prescribed_sets').insert(payload).select().single(); if(r.error) throw r.error; st.id=r.data.id; }
      }
      ex.delSets=[];
    }
    ed.delExs=[]; ed.dirty=false;
    if(cw) cw.rollupCache=null;
    // TEAM bulk-edit: push this session to every other team athlete (overwrite everyone; unlogged only)
    let teamMsg='';
    if(!auto && ed._teamEdit){
      try{ const tr=await propagateTeamEdit(ed._teamEdit);
        const bits=[]; if(tr.applied) bits.push(tr.applied+' updated'); if(tr.created) bits.push(tr.created+' added'); if(tr.skippedLogged) bits.push(tr.skippedLogged+' skipped (already logged)');
        teamMsg = ' · team ('+ed._teamEdit.n+'): '+(bits.length?bits.join(', '):'no others to update');
      }catch(pe){ teamMsg=' · ⚠ team apply failed: '+(pe.message||pe); console.error('team propagate failed:',pe); }
    }
    const statusChanged = (publishAfter===true || publishAfter==='draft');
    if(publishAfter===true) ed.session.status='published';
    else if(publishAfter==='draft') ed.session.status='draft';
    const wkEntry = cw && cw.sessByDate && (cw.sessByDate[cw.selDate]||[]).find(s=>s.id===ed.session.id);
    if(wkEntry){ wkEntry.title=ed.session.title; if(statusChanged) wkEntry.status=ed.session.status; }
    if(statusChanged){
      // the status write already committed above (sessPatch) — refresh defensively so a
      // render hiccup can never make a successful publish look like it failed
      conState._progSess=undefined;            // program publish-bar recomputes
      const ath=cw.ath.full_name.split(' ')[0];
      const okMsg = (publishAfter===true?('✓ Published — it\'s on '+ath+'\'s phone'):'✓ Unpublished — back to a draft')+teamMsg;
      try{ await renderCoachPanel(); }catch(_){ paintEditor(); }
      const m=document.getElementById('edMsg'); if(m){ m.style.color='var(--good)'; m.textContent=okMsg; setTimeout(()=>{ if(m.isConnected && m.textContent===okMsg) m.textContent=''; },3500); }
      return;
    }
    if(auto){ refreshStripDot(); edAutoSet('✓ Auto-saved'); return; }
    refreshStripDot();
    paintEditor();
    edMsgSet('✓ Saved'+teamMsg,'var(--good)');
    setTimeout(()=>edMsgSet(''),5000);
  }catch(e2){
    if(auto){ edAutoSet('⚠ auto-save failed'); ed.dirty=true; return; }
    if(btn){ btn.disabled=false; btn.textContent='Save changes'; }
    edMsgSet('⚠ Save failed — '+(e2.message||e2),'var(--bad)');
  }
  if(btn){ btn.disabled=false; btn.textContent='Save changes'; }
}
/* ---- draft auto-save: never lose a draft on refresh/logout ---- */
let _draftTimer=null, _draftSaving=false;
function edAutoSet(txt){ const el=document.getElementById('edAuto'); if(el){ el.textContent=txt||''; if(txt) setTimeout(()=>{ if(el.isConnected && el.textContent===txt) el.textContent=''; }, 2500); } }
function scheduleDraftSave(){
  if(!ed || !ed.session || ed.session.status!=='draft' || !ed.dirty) return;   // only auto-persist dirty drafts
  if(_draftTimer) clearTimeout(_draftTimer);
  edAutoSet('saving…');
  _draftTimer=setTimeout(doDraftSave, 1100);
}
async function doDraftSave(){
  _draftTimer=null;
  if(_draftSaving){ scheduleDraftSave(); return; }
  if(!ed || !ed.session || ed.session.status!=='draft' || !ed.dirty) return;
  _draftSaving=true;
  try{ await saveEditor(undefined, {auto:true}); } catch(e){}
  _draftSaving=false;
}
// best-effort flush before a refresh/tab-close/logout, so the last edit isn't lost inside the debounce window
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && ed && ed.session && ed.session.status==='draft' && ed.dirty){ if(_draftTimer){ clearTimeout(_draftTimer); _draftTimer=null; } doDraftSave(); } });
window.addEventListener('pagehide', ()=>{ if(ed && ed.session && ed.session.status==='draft' && ed.dirty){ if(_draftTimer){ clearTimeout(_draftTimer); _draftTimer=null; } doDraftSave(); } });
async function refreshEditorActuals(){
  if(!ed) return;
  const { data: logs } = await sb.from('logged_sets').select('*').eq('session_id', ed.session.id);
  ed.logs = logs||[];
  if(!ed.dirty){ paintEditor(); return; }
  // coach has unsaved edits — patch only the actual cells per row
  const logBySet={}; ed.logs.forEach(l=>{ if(l.prescribed_set_id) logBySet[l.prescribed_set_id]=l; });
  document.querySelectorAll('#edCard tr[data-ps]').forEach(tr=>{
    const ps=tr.dataset.ps; if(!ps) return;
    tr.querySelectorAll('.cva').forEach(td=>td.remove());
    tr.lastElementChild.insertAdjacentHTML('beforebegin', actualCells(logBySet[ps]));
  });
  if(cw) cw.rollupCache=null;
  renderRollup();
}

boot();
</script>
